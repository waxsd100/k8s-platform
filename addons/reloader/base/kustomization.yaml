apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reloader

# Secret / ConfigMap が更新されたとき、それを参照している Deployment を
# 自動で rollout restart する。ESO は Secret Manager の値をクラスタへ同期するが、
# env 経由で読んでいる Pod は再起動するまで古い値を持ち続けるため。
resources:
  - namespace.yaml

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: 2.2.17
    releaseName: reloader
    namespace: reloader
    valuesInline:
      reloader:
        # 明示的に reloader.stakater.com/auto: "true" を付けた対象だけを見る。
        # 全 Namespace の全 Deployment を監視すると、Canine がデプロイした
        # アプリまで巻き込んで意図しない再起動が起きるため。
        watchGlobally: true
        autoReloadAll: false
        # Reloader は全 Namespace の Secret を読める。コンテナが破られたときの足場を減らすため、
        # チャートが用意している設定でルートファイルシステムを読み取り専用にし、権限を落とす。
        readOnlyRootFileSystem: true
        deployment:
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          nodeSelector:
            workload-type: platform
          tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

# イメージは digest で固定する。タグは上流で付け替えられるが、digest は変わらない。
# helmCharts の version を上げるときは、この images も同じ変更で更新する。
# 更新しないと古いタグと digest が新しいチャートに載るため、
# hack/check-backup-consistency.sh がチャートの描画するタグとの不一致で失敗する。
images:
  - name: ghcr.io/stakater/reloader
    newTag: v1.4.22@sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c
