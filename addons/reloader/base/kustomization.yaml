apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Secret / ConfigMap が更新されたとき、それを参照している Deployment を
# 自動で rollout restart する。ESO は Secret Manager の値をクラスタへ同期するが、
# env 経由で読んでいる Pod は再起動するまで古い値を持ち続けるため。
#
# NOTE: watchGlobally: false + namespaces: [infra] により、Helm チャートは
#       infra / reloader の 2 Namespace それぞれに名前空間付き Role / RoleBinding を
#       生成する。top-level の namespace: reloader を置くと全 Role が reloader に書き換えられて
#       衝突するため外し、networkpolicy.yaml 側で metadata.namespace: reloader を明示する。
resources:
  - namespace.yaml
  - networkpolicy.yaml

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: 2.2.17
    releaseName: reloader
    namespace: reloader
    valuesInline:
      reloader:
        # 明示的に reloader.stakater.com/auto: "true" を付けた対象（現在は infra のみ）
        # に監視と RBAC を限定する。ClusterRole を廃し、他 Namespace（kube-system / kyverno / prod-* 等）の
        # Secret 読み取りや Workload 更新権限を持たせない。
        watchGlobally: false
        namespaces:
          - infra
        autoReloadAll: false
        # Deployment のみを再起動対象とし、Job / CronJob は対象外にする。
        ignoreJobs: true
        ignoreCronJobs: true
        # コンテナが破られたときの足場を減らすため、チャートが用意している設定で
        # ルートファイルシステムを読み取り専用にし、権限を落とす。
        readOnlyRootFileSystem: true
        deployment:
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          nodeSelector:
            workload-type: platform
          tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

# チャート 2.2.17 の templates/_helpers.tpl (reloader-namespaced-rules) は
# ignoreJobs / ignoreCronJobs を参照せず batch/cronjobs と batch/jobs の権限を
# 無条件に出力するため、op: test ガード付き JSON パッチで namespaced Role から除去する。
patches:
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: reloader-reloader-role
    patch: |-
      - op: test
        path: /rules/3/resources/0
        value: jobs
      - op: remove
        path: /rules/3
      - op: test
        path: /rules/2/resources/0
        value: cronjobs
      - op: remove
        path: /rules/2

# イメージは digest で固定する。タグは上流で付け替えられるが、digest は変わらない。
# helmCharts の version を上げるときは、この images も同じ変更で更新する。
# 更新しないと古いタグと digest が新しいチャートに載るため、
# hack/check-backup-consistency.sh がチャートの描画するタグとの不一致で失敗する。
images:
  - name: ghcr.io/stakater/reloader
    newTag: v1.4.22@sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c
