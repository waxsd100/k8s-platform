# =============================================================================
# Headlamp のログイン用 SA に、dev と本番で分けた権限を Namespace ごとに配る
#
#   - dev（caninemanaged=true）: ClusterRole edit（Secret の確認や手動デバッグを含む）
#   - 本番（prod-*）           : ClusterRole headlamp-user-prod-ops（Pod の削除による再起動と
#                                ExternalSecret の同期状態の確認だけ。Secret の閲覧・書き換えや
#                                ExternalSecret の作成、exec、Deployment の変更はできない）
#
# どちらも後から増えるので、Namespace の作成を契機に RoleBinding を生成する。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: headlamp-edit-app-namespaces-v2
  annotations:
    policies.kyverno.io/title: Grant Headlamp scoped access on app namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      headlamp/headlamp-user に、dev（caninemanaged=true）の Namespace では edit を、
      本番（prod-*）の Namespace では Secret の閲覧や書き換えを含まない headlamp-user-prod-ops の
      RoleBinding を生成する。
spec:
  rules:
    - name: rolebinding-dev-v2
      # NOTE: synchronize: true の generate ルールを持つ既存の ClusterPolicy を更新するとき、
      # Kyverno（pkg/validation/policy/generate.go の immutableGenerateFields）は旧ルールの
      # {name, match, exclude, context, preconditions} のハッシュ集合が新ルール集合の部分集合
      # （newRuleHashes.IsSuperset(oldRuleHashes)）でない限り更新を拒否し、Config Sync が KNV2009 で止まる。
      # ルール名だけを変えても同じ ClusterPolicy のままでは旧ルールのハッシュが消えて拒否されるため、
      # match / exclude を変えるときは ClusterPolicy の metadata.name・ルール名・生成先の RoleBinding 名を
      # すべて新しくして入れ直す（Config Sync が旧 ClusterPolicy を prune すると、旧ルールが作った
      # prod-* の RoleBinding/headlamp-user-edit も Kyverno が自動で削除する）。
      # なお generate.data の中身だけの変更はハッシュ対象外なので、そのまま更新できる。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  caninemanaged: "true"
      # ラベルは付け替えられるので、プラットフォーム・ビルダー・本番の Namespace は名前で必ず外す
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - canine
                - canine-k8s-builder
                - canine-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - prod-*
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: headlamp-user-dev-edit
        namespace: "{{request.object.metadata.name}}"
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: edit
          subjects:
            - kind: ServiceAccount
              name: headlamp-user
              namespace: headlamp

    - name: rolebinding-prod-v2
      # NOTE: synchronize: true の generate ルールの match / exclude を変えるときは、上と同じく
      # ClusterPolicy の metadata.name と生成先の RoleBinding 名を新しくして入れ直す。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - prod-*
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - canine
                - canine-k8s-builder
                - canine-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: headlamp-user-prod-ops
        namespace: "{{request.object.metadata.name}}"
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: headlamp-user-prod-ops
          subjects:
            - kind: ServiceAccount
              name: headlamp-user
              namespace: headlamp
---
# 上の生成に必要な権限。RoleBinding を作るには参照先の ClusterRole への bind が要る（RBAC の権限昇格防止）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:headlamp-edit
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["edit", "headlamp-user-prod-ops"]
    verbs: ["bind"]
