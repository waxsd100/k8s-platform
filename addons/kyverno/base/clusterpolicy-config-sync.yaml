apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: optimize-config-sync
  annotations:
    policies.kyverno.io/title: "Optimize Config Sync Resource Limits"
    policies.kyverno.io/category: "Optimization"
    policies.kyverno.io/description: >-
      Adjusts resource requests/limits for Config Sync components to prevent
      resource exhaustion on system-pool nodes. Config Sync pods remain on
      system-pool (the only untainted pool) by design.
spec:
  # background is set to false because we strictly want to mutate via admission webhook
  # when the Pod is created by the Config Sync Operator (Deployment/ReplicaSet).
  background: false
  rules:
    - name: mutate-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - config-management-system
                - config-management-monitoring
                - resource-group-system
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): otel-collector
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 200m
                    memory: 512Mi
              - (name): otel-agent
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 200m
                    memory: 512Mi
              - (name): reconciler
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 100m
                    memory: 256Mi
