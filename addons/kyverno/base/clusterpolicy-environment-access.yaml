# =============================================================================
# kubectl のコンテキスト wax100-dev / wax100-prod の権限（velaux-store ConfigMap 隔離対応）
#
# hack/kubectl-contexts.sh が、管理者の認証（gcloud）のまま次のユーザーに**なりすます**
# コンテキストを作る（kubeconfig の users[].as）。
#   wax100-dev   dev（VelaUX が作った Namespace）だけ edit（Secret を含む）。
#                本番（prod-*）では ConfigMap 閲覧可、他は configmaps 除外の閲覧のみ
#   wax100-prod  閲覧だけ（Secret は見えない。ConfigMap はアプリ Namespace のみ閲覧可）。
#                本番の変更は Git（components/apps/）の PR で行う
#
# velaux-store Namespace の ConfigMap には VelaUX の JWT 署名鍵（signedKey）や
# bcrypt パスワードハッシュが格納されるため、標準の ClusterRole/view（全 Namespace の
# configmaps 読取を含む）はバインドせず、configmaps を除外した wax100-cluster-view と
# アプリ Namespace 限定の RoleBinding（wax100-app-cm-view）に分離する。
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wax100-cluster-view
rules:
  # Kubernetes 1.31-1.34 標準 ClusterRole/view 相当（ただし velaux-store 隔離のため configmaps を除外）
  # NOTE: aggregationRule は付けない（aggregate-to-view を集約すると system:aggregate-to-view 経由で
  #       全 Namespace の configmaps 読取が再注入されてしまうため）。
  - apiGroups: [""]
    resources:
      - bindings
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - pods
      - pods/log
      - pods/status
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - controllerrevisions
      - daemonsets
      - daemonsets/status
      - deployments
      - deployments/scale
      - deployments/status
      - replicasets
      - replicasets/scale
      - replicasets/status
      - statefulsets
      - statefulsets/scale
      - statefulsets/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
      - horizontalpodautoscalers/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - cronjobs/status
      - jobs
      - jobs/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - daemonsets
      - daemonsets/status
      - deployments
      - deployments/scale
      - deployments/status
      - ingresses
      - ingresses/status
      - networkpolicies
      - replicasets
      - replicasets/scale
      - replicasets/status
      - replicationcontrollers/scale
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
      - poddisruptionbudgets/status
    verbs: ["get", "list", "watch"]
  # KubeVela OAM リソース（Dev / Prod の状態・定義の読取専用可視化）
  - apiGroups: ["core.oam.dev"]
    resources:
      - applications
      - applications/status
      - applicationrevisions
      - resourcetrackers
      - componentdefinitions
      - traitdefinitions
      - policydefinitions
      - workflowstepdefinitions
      - workloaddefinitions
      - definitionrevisions
      - policies
      - workflows
    verbs: ["get", "list", "watch"]
  # Kyverno ポリシー・レポート（従来の view 集約 kyverno:rbac:view:* 相当を明示維持）
  - apiGroups: ["kyverno.io"]
    resources:
      - cleanuppolicies
      - clustercleanuppolicies
      - policies
      - clusterpolicies
      - updaterequests
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policies.kyverno.io"]
    resources:
      - deletingpolicies
      - generatingpolicies
      - imagevalidatingpolicies
      - mutatingpolicies
      - namespaceddeletingpolicies
      - namespacedgeneratingpolicies
      - namespacedimagevalidatingpolicies
      - namespacedmutatingpolicies
      - namespacedvalidatingpolicies
      - policyexceptions
      - validatingpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources:
      - policyreports
      - clusterpolicyreports
    verbs: ["get", "list", "watch"]
  - apiGroups: ["reports.kyverno.io"]
    resources:
      - ephemeralreports
      - clusterephemeralreports
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wax100-contexts-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wax100-cluster-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: wax100-dev
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: wax100-prod
---
# アプリ Namespace（Dev および prod-*。velaux-store は厳格除外）限定の ConfigMap 読取ロール
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wax100-configmap-view
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
# Dev Namespace（usage.oam.dev/runtime=target かつ Config Sync 管理外）に edit の RoleBinding を配り、
# アプリ Namespace（prod-* と Dev、velaux-store 除外）に ConfigMap 読取 RoleBinding を配る
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: environment-access
  annotations:
    policies.kyverno.io/title: Grant wax100 contexts scoped edit and ConfigMap view on app namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      kubectl のコンテキスト wax100-dev に Dev Namespace（usage.oam.dev/runtime=target）での edit RoleBinding を、
      wax100-dev / wax100-prod にアプリ Namespace（prod-* / Dev、velaux-store 除外）での
      ConfigMap 読取 RoleBinding を生成する。
spec:
  rules:
    - name: dev-namespace-edit
      # NOTE: generate ルールの match / exclude は、作った後に変えられない（Kyverno が更新を拒否し、
      # Config Sync が KNV2009 で止まる）。構築後に変えるときは ClusterPolicy 名と生成先名を新しくして入れ直す。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  usage.oam.dev/runtime: "target"
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: DoesNotExist
      # ラベルは付け替えられるので、プラットフォームと本番の Namespace は名前で必ず外す
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - prod
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - vela-system
                - velaux-store
                - prod-*
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: wax100-dev-edit
        namespace: "{{request.object.metadata.name}}"
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: edit
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: wax100-dev

    - name: app-namespace-configmaps-view
      # アプリ Namespace（prod-* および Dev）でのみ ConfigMap 閲覧を許可し、velaux-store と基盤は除外する
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - prod-*
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  usage.oam.dev/runtime: "target"
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: DoesNotExist
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - prod
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - vela-system
                - velaux-store
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: wax100-app-cm-view
        namespace: "{{request.object.metadata.name}}"
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: wax100-configmap-view
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: wax100-dev
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: wax100-prod
---
# Dev Namespace 限定で VelaUX (kubevela-ux) にアプリ用 Secret CRUD を付与する ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velaux-dev-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Dev Namespace (usage.oam.dev/runtime=target かつ Config Sync 管理外) にのみ
# kubevela-ux 用の Secret CRUD RoleBinding を自動生成する（prod-* や infra の Secret 隔離は維持）
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: velaux-dev-secrets-access
  annotations:
    policies.kyverno.io/title: Grant VelaUX scoped Secret CRUD on Dev namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      Dev Namespace（usage.oam.dev/runtime=target）にのみ VelaUX（kubevela-ux）向けの
      Secret CRUD RoleBinding を生成し、UI から Dev アプリの Secret 作成・選択を可能にする。
spec:
  rules:
    - name: velaux-dev-namespace-secrets
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  usage.oam.dev/runtime: "target"
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: DoesNotExist
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - prod
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - vela-system
                - velaux-store
                - prod-*
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: velaux-dev-secrets
        namespace: "{{request.object.metadata.name}}"
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: velaux-dev-secrets
          subjects:
            - kind: ServiceAccount
              name: kubevela-ux
              namespace: vela-system
---
# 上の生成に必要な権限（edit / wax100-configmap-view / velaux-dev-secrets を含む RoleBinding を作るには bind が要る）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:environment-access
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["edit", "wax100-configmap-view", "velaux-dev-secrets"]
    verbs: ["bind"]
