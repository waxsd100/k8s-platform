apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - clusterpolicy-registry-mirror.yaml
  - clusterpolicy-app-scheduling.yaml
  - clusterpolicy-canine-boundary.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    releaseName: kyverno
    namespace: kyverno
    version: 3.7.0
    includeCRDs: true
    valuesInline:
      admissionController:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      backgroundController:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      cleanupController:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      reportsController:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"

images:
  - name: ghcr.io/kyverno/kyverno
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/kyverno
  - name: ghcr.io/kyverno/kyvernopre
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/kyvernopre
  - name: ghcr.io/kyverno/cleanup-controller
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/cleanup-controller
  - name: ghcr.io/kyverno/reports-controller
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/reports-controller
  - name: ghcr.io/kyverno/background-controller
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/background-controller
