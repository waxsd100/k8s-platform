apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - clusterpolicy-registry-mirror.yaml
  - clusterpolicy-app-scheduling.yaml
  - clusterpolicy-dev-gvisor.yaml
  - clusterpolicy-app-hardening.yaml
  - clusterpolicy-build-scheduling.yaml
  - clusterpolicy-canine-boundary.yaml
  - clusterpolicy-config-sync-placement.yaml
  - deletingpolicy-config-sync-placement.yaml
  - clusterpolicy-db-backup-exec.yaml
  - clusterpolicy-pvc-backup-job.yaml
  - clusterpolicy-headlamp-edit.yaml
  - clusterpolicy-headlamp-backup-ops.yaml
  - clusterpolicy-environment-isolation.yaml
  - clusterpolicy-canine-system-egress.yaml
  - clusterpolicy-canine-builder-egress.yaml
  - clusterpolicy-environment-access.yaml
  - clusterpolicy-ingress-hosts.yaml
  - clusterpolicy-canine-volumes.yaml
  - clusterpolicy-postgres-extensions.yaml
  - configmap-postgres-extensions.yaml
  - clusterpolicy-externalsecret-scope.yaml
  - validatingadmissionpolicy-canine-boundary.yaml
  - validatingadmissionpolicy-canine-promote-boundary.yaml
  - validatingadmissionpolicy-db-backup-exec-boundary.yaml
  - validatingadmissionpolicy-app-storage-network-boundary.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    releaseName: kyverno
    namespace: kyverno
    version: 3.9.1
    includeCRDs: true
    skipTests: true
    valuesInline:
      # Kyverno 自身の Pod は resourceFilters により artifact-registry-mirror の対象外になる。
      # チャート 3.9.1 の既定レジストリは reg.kyverno.io（webhooksCleanup のみ ghcr.io）なので、
      # チャートの設定で全イメージを Artifact Registry の ghcr-cache へ統一する。
      global:
        # ESO の ExternalSecret 等の CRD が後から入った場合でも、15 分の再同期を待たずに
        # Webhook ルール（externalsecret-scope-by-namespace 等）を即時登録させる。
        crdWatcher: true
        image:
          registry: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache
      # admin ClusterRole へ Kyverno の PolicyException 作成権等を集約しない。
      rbac:
        roles:
          aggregate:
            admin: false
      # Config Sync は描画結果をそのまま適用し、Helm のフックを解釈しない。
      # そのため次の 2 種類は無効にする。pre-delete のフックは導入時にそのまま走って
      # Webhook を消し Pod を 0 台に縮めてしまい、完了後に残る Job は Pod テンプレートが
      # 不変なので次のアップグレードを止めてしまう。
      # CRD の保存バージョン移行（crds.migration）が必要なアップグレードでは、Job を手で実行する。
      webhooksCleanup:
        # pre-delete のフック（rm-webhooks / scale-to-zero）を描画しない。
        # image は再び有効にしたときのために残す。
        enabled: false
        image:
          registry: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache
      crds:
        migration:
          # post-upgrade のフック（migrate-resources 一式）を描画しない
          enabled: false
      admissionController:
        # platform-pool を小型 VM 1 台に収めるため 1 本で動かす。
        # Fail のポリシーには matchConditions を付けてあるため、再起動中の数秒間も
        # kube-system / infra / Config Sync の Pod 作成は止まらない。
        replicas: 1
        podDisruptionBudget:
          enabled: false
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      backgroundController:
        rbac:
          coreClusterRole:
            # チャート既定の extraResources（ingresses / roles / configmaps / resourcequotas 等の
            # 全 Namespace 書き込み権限）を無効化する。generate ポリシーが必要な権限は各ポリシー同梱の
            # 集約 ClusterRole（networkpolicies / rolebindings / clusterroles bind）で最小限に付与している。
            extraResources: []
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      cleanupController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      reportsController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"

# イメージは digest で固定する。タグは上流で付け替えられるが、digest は変わらない。
# 名前は描画されるイメージ名（ghcr-cache 経由）のまま書く。
# helmCharts の version を上げるときは、この images も同じ変更で更新する。
# 更新しないと古いタグと digest が新しいチャートに載るため、
# hack/check-backup-consistency.sh がチャートの描画するタグとの不一致で失敗する。
images:
  - name: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/kyverno
    newTag: v1.19.1@sha256:b31d8511ae5fd6010e2a01ea72ebae08eb82fa51d91af14a1d9fe989949b4edb
  - name: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/kyvernopre
    newTag: v1.19.1@sha256:c25c47461f06f2845a48c319ae86fbbc1730a7b9ed5b701889c9dc1f9ee94b09
  - name: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/background-controller
    newTag: v1.19.1@sha256:8f1e9143373a27578cafc2d28d2c66ba0926c63b4c77e63de8d2fdd4a122859f
  - name: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/cleanup-controller
    newTag: v1.19.1@sha256:67a48e62a8d8f8120c86914ff822b90017c54054c7b64ef8a1555645e9d9761e
  - name: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/reports-controller
    newTag: v1.19.1@sha256:c0eee97b9b44a0dd35805d56b358fa52548480f79d4944602b9609538eccd64c
