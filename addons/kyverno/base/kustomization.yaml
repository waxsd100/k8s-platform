apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - clusterpolicy-registry-mirror.yaml
  - clusterpolicy-app-scheduling.yaml
  - clusterpolicy-app-hardening.yaml
  - clusterpolicy-build-scheduling.yaml
  - clusterpolicy-canine-boundary.yaml
  - clusterpolicy-config-sync-placement.yaml
  - deletingpolicy-config-sync-placement.yaml
  - clusterpolicy-db-backup-exec.yaml
  - clusterpolicy-pvc-backup-job.yaml
  - clusterpolicy-headlamp-edit.yaml
  - clusterpolicy-headlamp-backup-ops.yaml
  - clusterpolicy-environment-isolation.yaml
  - clusterpolicy-environment-access.yaml
  - clusterpolicy-ingress-hosts.yaml
  - clusterpolicy-canine-volumes.yaml
  - clusterpolicy-postgres-extensions.yaml
  - configmap-postgres-extensions.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    releaseName: kyverno
    namespace: kyverno
    version: 3.9.1
    includeCRDs: true
    skipTests: true
    valuesInline:
      admissionController:
        # platform-pool を小型 VM 1 台に収めるため 1 本で動かす。
        # Fail のポリシーには matchConditions を付けてあるため、再起動中の数秒間も
        # kube-system / infra / Config Sync の Pod 作成は止まらない。
        replicas: 1
        podDisruptionBudget:
          enabled: false
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      backgroundController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      cleanupController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      reportsController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"

images:
  - name: ghcr.io/kyverno/kyverno
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/kyverno
  - name: ghcr.io/kyverno/kyvernopre
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/kyvernopre
  - name: ghcr.io/kyverno/cleanup-controller
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/cleanup-controller
  - name: ghcr.io/kyverno/reports-controller
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/reports-controller
  - name: ghcr.io/kyverno/background-controller
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/kyverno/background-controller
