apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - clusterpolicy-registry-mirror.yaml
  - clusterpolicy-app-scheduling.yaml
  - clusterpolicy-app-hardening.yaml
  - clusterpolicy-build-scheduling.yaml
  - clusterpolicy-canine-boundary.yaml
  - clusterpolicy-config-sync-placement.yaml
  - deletingpolicy-config-sync-placement.yaml
  - clusterpolicy-db-backup-exec.yaml
  - clusterpolicy-pvc-backup-job.yaml
  - clusterpolicy-headlamp-edit.yaml
  - clusterpolicy-headlamp-backup-ops.yaml
  - clusterpolicy-environment-isolation.yaml
  - clusterpolicy-canine-system-egress.yaml
  - clusterpolicy-environment-access.yaml
  - clusterpolicy-ingress-hosts.yaml
  - clusterpolicy-canine-volumes.yaml
  - clusterpolicy-postgres-extensions.yaml
  - configmap-postgres-extensions.yaml
  - clusterpolicy-externalsecret-scope.yaml
  - validatingadmissionpolicy-canine-boundary.yaml
  - validatingadmissionpolicy-canine-promote-boundary.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    releaseName: kyverno
    namespace: kyverno
    version: 3.9.1
    includeCRDs: true
    skipTests: true
    valuesInline:
      # Kyverno 自身の Pod は resourceFilters により artifact-registry-mirror の対象外になる。
      # チャート 3.9.1 の既定レジストリは reg.kyverno.io（webhooksCleanup のみ ghcr.io）なので、
      # チャートの設定で全イメージを Artifact Registry の ghcr-cache へ統一する。
      global:
        image:
          registry: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache
      # Config Sync は描画結果をそのまま適用し、Helm のフックを解釈しない。
      # そのため次の 2 種類は無効にする。pre-delete のフックは導入時にそのまま走って
      # Webhook を消し Pod を 0 台に縮めてしまい、完了後に残る Job は Pod テンプレートが
      # 不変なので次のアップグレードを止めてしまう。
      # CRD の保存バージョン移行（crds.migration）が必要なアップグレードでは、Job を手で実行する。
      webhooksCleanup:
        # pre-delete のフック（rm-webhooks / scale-to-zero）を描画しない。
        # image は再び有効にしたときのために残す。
        enabled: false
        image:
          registry: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache
      crds:
        migration:
          # post-upgrade のフック（migrate-resources 一式）を描画しない
          enabled: false
      admissionController:
        # platform-pool を小型 VM 1 台に収めるため 1 本で動かす。
        # Fail のポリシーには matchConditions を付けてあるため、再起動中の数秒間も
        # kube-system / infra / Config Sync の Pod 作成は止まらない。
        replicas: 1
        podDisruptionBudget:
          enabled: false
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      backgroundController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      cleanupController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      reportsController:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
