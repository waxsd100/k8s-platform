# =============================================================================
# アプリケーション Pod を apps-pool に固定する
#
# 背景:
#   Canine が生成する Pod は nodeSelector も toleration も持たない。
#   そのままだと taint の無い system-pool にも載ってしまい、GKE の
#   システムコンポーネントとアプリが同居する。逆に apps-pool を Spot の
#   taint で保護すると、今度はアプリがどこにも載らなくなる。
#
#   そこで Admission 時に nodeSelector と toleration を注入する。
#   これにより apps-pool（Spot）にだけ載るようになり、
#   system-pool / platform-pool / build-pool からは締め出される。
#
# dev の gVisor 分離は clusterpolicy-dev-gvisor.yaml（autogen-controllers: none、Pod CREATE のみ）で
# 行う（Deployment / StatefulSet 本体に runtimeClassName: gvisor を永続保存させないため）。
#
# 除外:
#   GKE のシステム Namespace と、このリポジトリが管理する
#   プラットフォーム構成要素の Namespace。これらは自前で
#   nodeSelector / toleration を持っている。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pin-apps-to-apps-pool
  annotations:
    policies.kyverno.io/title: Pin application pods to apps-pool
    policies.kyverno.io/category: Scheduling
    policies.kyverno.io/description: >-
      アプリ用 Namespace の Pod に workload-type=app の nodeSelector と
      Spot・GKE Sandbox・標準 NoExecute（300 秒）の toleration を注入し、apps-pool にのみスケジュールさせる。
spec:
  background: false
  # Kyverno が止まっていても、対象外の Namespace の Pod 作成を巻き込まないための条件。
  # Kyverno の Webhook は既定で kube-system と kyverno 以外の**全 Namespace**で呼ばれ、
  # 下の exclude は Kyverno の中でしか効かない。Fail のまま Kyverno が落ちると、
  # infra (cloudflared / ingress-nginx) や Config Sync の Pod まで作れなくなる。
  # matchConditions を付けると Kyverno はこのポリシー専用の Webhook を作り、
  # 条件は API サーバーが評価する（Kyverno が落ちていても対象外は素通しになる）。
  # NOTE: 下の exclude と同じ一覧を保つこと。
  webhookConfiguration:
    matchConditions:
      - name: only-app-namespaces
        expression: >-
          !(request.namespace in [
            'kube-system', 'kube-node-lease', 'kube-public',
            'gmp-system', 'gmp-public',
            'config-management-system', 'config-management-monitoring', 'resource-group-system',
            'canine', 'infra', 'external-secrets', 'kyverno', 'reloader', 'headlamp',
            'canine-k8s-builder'
          ] || request.namespace.startsWith('gke-'))
  rules:
    - name: inject-apps-pool-scheduling
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                # GKE / Kubernetes のシステム
                - kube-system
                - kube-node-lease
                - kube-public
                - gke-*
                - gmp-system
                - gmp-public
                # Config Sync
                - config-management-system
                - config-management-monitoring
                - resource-group-system
                # 本リポジトリが管理するプラットフォーム構成要素
                - canine
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                # Canine のビルダーは build-pool へ (clusterpolicy-build-scheduling.yaml)
                - canine-k8s-builder
      mutate:
        patchStrategicMerge:
          spec:
            # アンカー (+()) を使わず**上書き**する。
            # 以前は「アプリ側が明示していれば尊重する」+() アンカーだったが、
            # それだとアプリが自分で workload-type: system を書くだけで、taint の無い
            # system-pool (kube-system と外部の入口が居る) に載れてしまう。
            # platform を書けば Canine (cluster-admin 相当) と同じノードにも載れる。
            # apps-pool 以外への配置は一切許さない。
            nodeSelector:
              workload-type: app
            tolerations:
              # Kubernetes 既定の DefaultTolerationSeconds（300 秒）を明示的に保持する。
              # これを落とすと一時的なノード不調で 0 秒退避が起きてしまう一方、
              # リスト全体の上書きにより不正な toleration（workload-type: system 等）は引き続き除去される。
              - key: node.kubernetes.io/not-ready
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
              - key: node.kubernetes.io/unreachable
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
              - key: cloud.google.com/gke-spot
                operator: Equal
                value: "true"
                effect: NoSchedule
              # apps-pool は GKE Sandbox のノードで、GKE が sandbox.gke.io/runtime=gvisor の taint を付ける。
              # gVisor で動かす dev の Pod には RuntimeClass がこの toleration を足すが、上の一覧は上書きなので
              # （Kyverno と RuntimeClass のどちらが後に効いても載れるよう）全部の Pod に付ける
              - key: sandbox.gke.io/runtime
                operator: Equal
                value: gvisor
                effect: NoSchedule

    # requests を持たないコンテナに既定値を入れる。
    # Canine 経由のアプリは requests を書かないことが多い。requests が 0 だと
    #   - スケジューラが同じノードにいくらでも詰め込み、オートスケーラは
    #     「まだ入る」と判断して apps-pool を**増やさない**（判断は実使用量でなく requests）
    #   - HPA の使用率も計算できない
    # 本人が requests か limits を書いていれば触らない（limits だけ書いた場合、
    # Kubernetes が requests = limits を補うため。ここで入れると limits を超えうる）。
    #
    # NOTE: このポリシーでは inject-apps-pool-scheduling の autogen-controllers を効かせるため、
    #       patchesJson6902（ポリシー全体の autogen を無効化する）ではなく patchStrategicMerge を
    #       order: Descending で全コンテナに適用する。末尾から先頭へ順に Strategic Merge Patch を
    #       当てることで、複数コンテナ Pod でも containers[0]（既定コンテナ）と全体の並び順を保つ。
    - name: default-app-requests
      match:
        any:
          - resources:
              kinds:
                - Pod
              # 作成時だけ。Pod の resources は作成後に変えられないため、
              # UPDATE で足そうとすると（Kyverno より前に作られた Pod など）更新ごと拒否される。
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                # GKE / Kubernetes のシステム
                - kube-system
                - kube-node-lease
                - kube-public
                - gke-*
                - gmp-system
                - gmp-public
                # Config Sync
                - config-management-system
                - config-management-monitoring
                - resource-group-system
                # 本リポジトリが管理するプラットフォーム構成要素
                - canine
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                # Canine のビルダーは build-pool へ (clusterpolicy-build-scheduling.yaml)
                - canine-k8s-builder
      preconditions:
        all:
          - key: "{{ length((request.object.spec.containers || `[]`)[?length(resources.requests || `{}`) == `0` && length(resources.limits || `{}`) == `0`]) }}"
            operator: GreaterThan
            value: 0
          - key: '{{ contains(to_string((request.object.spec.containers || `[]`)[].[name, resources]), `"\u007b\u007b"`) }}'
            operator: Equals
            value: false
      mutate:
        foreach:
          - list: "request.object.spec.containers || `[]`"
            order: Descending
            context:
              - name: effResources
                variable:
                  jmesPath: >-
                    (length(element.resources.requests || `{}`) == `0` && length(element.resources.limits || `{}`) == `0`)
                    && merge(element.resources || `{}`, {requests: {cpu: '100m', memory: '128Mi'}})
                    || element.resources
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    resources: "{{ effResources }}"

    # seccompProfile を書かない Pod は Unconfined で動いてしまう（terraform/gke.tf に kubelet の既定値は無い）。
    # 検査（clusterpolicy-app-hardening.yaml）は「書かれていれば RuntimeDefault か Localhost」なので、
    # 書かれていない Pod は素通りになる。そこで作成時に Pod 単位の既定値を足す。
    # +() アンカーにより、Pod が自分で seccompProfile を書いていればそれを残す（その値は検査がそのまま見る）。
    # 作成時だけ。UPDATE で足すと、既存の Pod の spec を書き換えようとして更新ごと拒否されるため。
    # gVisor の Pod にも同じ既定値が入るが、実用上の影響は無い想定（実機では未確認）。
    - name: default-app-seccomp-profile
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                # GKE / Kubernetes のシステム
                - kube-system
                - kube-node-lease
                - kube-public
                - gke-*
                - gmp-system
                - gmp-public
                # Config Sync
                - config-management-system
                - config-management-monitoring
                - resource-group-system
                # 本リポジトリが管理するプラットフォーム構成要素
                - canine
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                # Canine のビルダーは build-pool へ (clusterpolicy-build-scheduling.yaml)
                - canine-k8s-builder
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
