# =============================================================================
# Canine の ServiceAccount を API サーバー組み込みの ValidatingAdmissionPolicy で縛る
#
# 背景:
#   公式チャートの Canine は ClusterRole で */*/*（実質 cluster-admin）を持つ。
#   Kyverno の Webhook（clusterpolicy-canine-boundary.yaml）だけでは次の隙間が残る:
#     1. Kyverno の Webhook は既定で kube-system・kube-public・kube-node-lease・kyverno を
#        対象外にしており、また kyverno-admission-controller が落ちている間は応答できない
#     2. クラスタ全体のリソース（ValidatingWebhookConfiguration・ClusterRoleBinding・
#        ClusterPolicy・Node・StorageClass・CRD 等）や、dev Namespace 内の PolicyException・
#        CiliumNetworkPolicy・VolumeSnapshot 等を書き換えられると、境界そのものを外せる
#     3. サブリソース（deployments/scale・pods/exec・serviceaccounts/token・nodes/proxy 等）の
#        操作（CONNECT を含む）で保護対象の Namespace やノードに踏み込める
#     4. dev や canine-system 等の Namespace 内で ClusterRole を参照する RoleBinding（削除を含む）や
#        特権 Role（特権 API グループ・Namespace・PVC・PV・Node・NetworkPolicy・builder/system の
#        Ingress 書き込み権限を含む）を操作して別 ServiceAccount 経由で境界を迂回できる
#     5. caninemanaged=true ラベル無しの Namespace 作成・既存管理用 Namespace の乗っ取り更新や削除・
#        kubernetes.io/metadata.name ラベル偽装、NetworkPolicy の追加による Cloud SQL 遮断や環境分離の
#        無効化、canine-k8s-builder / canine-system での本番ホスト名 Ingress 乗っ取り、Service の
#        externalIPs 指定、および PVC / volumeClaimTemplates / ワークロード volumes（gcePersistentDisk・
#        csi・ephemeral・volumeName・dataSource・dataSourceRef）経由のディスク奪取が起こりうる
#
#   そこで Kubernetes 標準の ValidatingAdmissionPolicy（API サーバー内で直接評価され、
#   kube-system や kyverno も例外にならず、Webhook の停止にも影響されない）で境界を強制する。
# =============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: canine-cluster-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # "*/*" はリソースとサブリソース（deployments/scale・pods/exec・serviceaccounts/token・nodes/proxy 等）の両方に一致する。
      # "*" と並べると API サーバーが「'*/*' がある場合は他を指定できない」として拒否する（1.33 / 1.34 で確認）。
      # NOTE: Kubernetes の OperationType に PATCH は無い（PATCH は UPDATE として渡る）。
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*/*"]
  matchConditions:
    - name: only-canine-serviceaccount
      expression: "request.userInfo.username == 'system:serviceaccount:canine:canine'"
  variables:
    - name: reqNs
      expression: "has(request.namespace) ? request.namespace : ''"
    - name: reqSubResource
      expression: "has(request.subResource) ? request.subResource : ''"
    - name: targetNs
      expression: >-
        variables.reqNs != ''
          ? variables.reqNs
          : (request.resource.group == '' && request.resource.resource == 'namespaces'
              ? ((has(request.name) && request.name != '')
                  ? request.name
                  : (object != null && type(object) == type({}) && has(object.metadata) && type(object.metadata) == type({})
                      ? ((has(object.metadata.name) && type(object.metadata.name) == string && object.metadata.name != '')
                          ? object.metadata.name
                          : ((has(object.metadata.generateName) && type(object.metadata.generateName) == string) ? object.metadata.generateName : ''))
                      : ''))
              : '')
    - name: isProtectedNamespaceName
      expression: >-
        variables.targetNs != '' && (
          variables.targetNs in [
            'default',
            'prod',
            'kyverno',
            'canine',
            'infra',
            'external-secrets',
            'reloader',
            'headlamp',
            'dev-access',
            'resource-group-system'
          ] ||
          variables.targetNs.startsWith('kube-') ||
          variables.targetNs.startsWith('prod-') ||
          variables.targetNs.startsWith('gke-') ||
          variables.targetNs.startsWith('gmp-') ||
          variables.targetNs.startsWith('config-management-')
        )
    # Canine の Volume 機能（resources/k8/stateless/pv.yaml）はデプロイのたびにダミーの manual PV を
    # 一緒に apply する（PVC 側は Kyverno が standard-rwo に書き換えるため、この PV は使われない）。
    # 本番や他用途の PV（CSI / GCE PD / claimRef 付き / 任意の hostPath 等）の作成・更新・削除は一切許さない。
    - name: pvObjValid
      expression: >-
        object != null &&
        type(object) == type({}) &&
        has(object.metadata) &&
        type(object.metadata) == type({}) &&
        has(object.metadata.labels) &&
        type(object.metadata.labels) == type({}) &&
        'caninemanaged' in object.metadata.labels &&
        type(object.metadata.labels['caninemanaged']) == string &&
        object.metadata.labels['caninemanaged'] == 'true' &&
        !('app.kubernetes.io/managed-by' in object.metadata.labels && type(object.metadata.labels['app.kubernetes.io/managed-by']) == string && object.metadata.labels['app.kubernetes.io/managed-by'] == 'configmanagement.gke.io') &&
        has(object.spec) &&
        type(object.spec) == type({}) &&
        has(object.spec.storageClassName) &&
        type(object.spec.storageClassName) == string &&
        object.spec.storageClassName == 'manual' &&
        has(object.spec.hostPath) &&
        type(object.spec.hostPath) == type({}) &&
        has(object.spec.hostPath.path) &&
        type(object.spec.hostPath.path) == string &&
        object.spec.hostPath.path.matches('^/data/volumes/[A-Za-z0-9_-]+$') &&
        !has(object.spec.csi) &&
        !has(object.spec.gcePersistentDisk) &&
        !has(object.spec.nfs) &&
        !has(object.spec.local) &&
        !has(object.spec.claimRef)
    - name: oldPvObjValid
      expression: >-
        oldObject != null &&
        type(oldObject) == type({}) &&
        has(oldObject.metadata) &&
        type(oldObject.metadata) == type({}) &&
        has(oldObject.metadata.labels) &&
        type(oldObject.metadata.labels) == type({}) &&
        'caninemanaged' in oldObject.metadata.labels &&
        type(oldObject.metadata.labels['caninemanaged']) == string &&
        oldObject.metadata.labels['caninemanaged'] == 'true' &&
        !('app.kubernetes.io/managed-by' in oldObject.metadata.labels && type(oldObject.metadata.labels['app.kubernetes.io/managed-by']) == string && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'configmanagement.gke.io') &&
        has(oldObject.spec) &&
        type(oldObject.spec) == type({}) &&
        has(oldObject.spec.storageClassName) &&
        type(oldObject.spec.storageClassName) == string &&
        oldObject.spec.storageClassName == 'manual' &&
        has(oldObject.spec.hostPath) &&
        type(oldObject.spec.hostPath) == type({}) &&
        has(oldObject.spec.hostPath.path) &&
        type(oldObject.spec.hostPath.path) == string &&
        oldObject.spec.hostPath.path.matches('^/data/volumes/[A-Za-z0-9_-]+$') &&
        !has(oldObject.spec.csi) &&
        !has(oldObject.spec.gcePersistentDisk) &&
        !has(oldObject.spec.nfs) &&
        !has(oldObject.spec.local) &&
        !has(oldObject.spec.claimRef)
    - name: isAllowedCanineDummyPv
      expression: >-
        request.resource.group == '' &&
        request.resource.resource == 'persistentvolumes' &&
        variables.reqSubResource == '' &&
        request.operation in ['CREATE', 'UPDATE', 'DELETE'] &&
        (
          (request.operation == 'CREATE' && variables.pvObjValid) ||
          (request.operation == 'UPDATE' && variables.pvObjValid && (oldObject == null || variables.oldPvObjValid)) ||
          (request.operation == 'DELETE' && (oldObject != null ? variables.oldPvObjValid : variables.pvObjValid))
        )
    # 10 種の Pod 実行系リソース（Pod / PodTemplate / ReplicationController / Deployment / StatefulSet /
    # DaemonSet / ReplicaSet / ControllerRevision / Job / CronJob）から PodSpec を 1 回だけ取り出す。
    - name: workloadPodSpec
      expression: >-
        !(request.operation in ['CREATE', 'UPDATE']) || object == null || type(object) != type({})
          ? null
          : (request.resource.group == '' && request.resource.resource == 'pods'
              ? (has(object.spec) && type(object.spec) == type({}) ? object.spec : null)
              : (request.resource.group == '' && request.resource.resource == 'podtemplates'
                  ? (has(object.template) && type(object.template) == type({}) && has(object.template.spec) && type(object.template.spec) == type({}) ? object.template.spec : null)
                  : (((request.resource.group == '' && request.resource.resource == 'replicationcontrollers') ||
                      (request.resource.group == 'apps' && request.resource.resource in ['deployments', 'statefulsets', 'daemonsets', 'replicasets']) ||
                      (request.resource.group == 'batch' && request.resource.resource == 'jobs'))
                      ? (has(object.spec) && type(object.spec) == type({}) && has(object.spec.template) && type(object.spec.template) == type({}) && has(object.spec.template.spec) && type(object.spec.template.spec) == type({}) ? object.spec.template.spec : null)
                      : (request.resource.group == 'apps' && request.resource.resource == 'controllerrevisions'
                          ? (has(object.data) && type(object.data) == type({}) && has(object.data.spec) && type(object.data.spec) == type({}) && has(object.data.spec.template) && type(object.data.spec.template) == type({}) && has(object.data.spec.template.spec) && type(object.data.spec.template.spec) == type({}) ? object.data.spec.template.spec : null)
                          : (request.resource.group == 'batch' && request.resource.resource == 'cronjobs'
                              ? (has(object.spec) && type(object.spec) == type({}) && has(object.spec.jobTemplate) && type(object.spec.jobTemplate) == type({}) && has(object.spec.jobTemplate.spec) && type(object.spec.jobTemplate.spec) == type({}) && has(object.spec.jobTemplate.spec.template) && type(object.spec.jobTemplate.spec.template) == type({}) && has(object.spec.jobTemplate.spec.template.spec) && type(object.spec.jobTemplate.spec.template.spec) == type({}) ? object.spec.jobTemplate.spec.template.spec : null)
                              : null)))))
  validations:
    # 1. 保護対象 Namespace（kube-* / kyverno / canine / infra / external-secrets / headlamp / prod / prod-* 等）
    #    および Config Sync 管理下の Namespace への変更・接続をすべて拒否する（名前無しの Namespace 操作も拒否）
    - expression: >-
        !variables.isProtectedNamespaceName &&
        (request.resource.group != '' || request.resource.resource != 'namespaces' || variables.targetNs != '') &&
        (
          namespaceObject == null ||
          !has(namespaceObject.metadata) ||
          !has(namespaceObject.metadata.labels) ||
          !('app.kubernetes.io/managed-by' in namespaceObject.metadata.labels) ||
          namespaceObject.metadata.labels['app.kubernetes.io/managed-by'] != 'configmanagement.gke.io'
        ) &&
        !(
          request.resource.group == '' &&
          request.resource.resource == 'namespaces' &&
          oldObject != null &&
          type(oldObject) == type({}) &&
          has(oldObject.metadata) &&
          type(oldObject.metadata) == type({}) &&
          has(oldObject.metadata.labels) &&
          type(oldObject.metadata.labels) == type({}) &&
          'app.kubernetes.io/managed-by' in oldObject.metadata.labels &&
          type(oldObject.metadata.labels['app.kubernetes.io/managed-by']) == string &&
          oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'configmanagement.gke.io'
        )
      message: >-
        Canine の ServiceAccount からシステム・プラットフォーム・本番（prod-*）および Config Sync 管理下の Namespace を変更・接続することはできません。

    # 2. クラスタ全体のリソースは許可リスト方式で縛る（ClusterRole / ClusterRoleBinding / Webhook /
    #    ValidatingAdmissionPolicy / ClusterPolicy / Node / StorageClass / RuntimeClass / CRD / VolumeSnapshotContent 等をすべて拒否）
    - expression: >-
        (variables.reqNs != '' && !(request.resource.group == '' && request.resource.resource == 'namespaces')) ||
        (request.resource.group == '' && request.resource.resource == 'namespaces' && variables.reqSubResource == '' && request.operation in ['CREATE', 'UPDATE', 'DELETE']) ||
        variables.isAllowedCanineDummyPv ||
        (request.operation == 'CREATE' && variables.reqSubResource == '' && request.resource.group == 'authorization.k8s.io' && request.resource.resource in ['selfsubjectaccessreviews', 'selfsubjectrulesreviews', 'subjectaccessreviews']) ||
        (request.operation == 'CREATE' && variables.reqSubResource == '' && request.resource.group == 'authentication.k8s.io' && request.resource.resource in ['selfsubjectreviews', 'tokenreviews'])
      message: >-
        Canine の ServiceAccount からクラスタ全体のリソース（Admission ポリシー・Webhook・RBAC・Node・StorageClass・CRD・本番 PV 等）を変更することはできません。

    # 3. dev や canine-system 等の Namespace の中であっても、特権・基盤系 25 API グループ（Admission /
    #    CRD / Kyverno / ESO / Config Sync / Cilium / Gateway / Storage / Snapshot 等）のリソース操作、
    #    NetworkPolicy の変更（足し算による Cloud SQL 遮断・環境分離の無効化防止）、および
    #    canine-k8s-builder / canine-system での Ingress 作成・更新・削除（本番ホスト名乗っ取り防止）を拒否する
    - expression: >-
        !(request.resource.group in [
          'admissionregistration.k8s.io',
          'apiextensions.k8s.io',
          'apiregistration.k8s.io',
          'certificates.k8s.io',
          'cilium.io',
          'cloud.google.com',
          'configmanagement.gke.io',
          'configsync.gke.io',
          'external-secrets.io',
          'flowcontrol.apiserver.k8s.io',
          'gateway.networking.k8s.io',
          'generators.external-secrets.io',
          'kpt.dev',
          'kyverno.io',
          'net.gke.io',
          'networking.gke.io',
          'node.k8s.io',
          'openreports.io',
          'policies.kyverno.io',
          'reports.kyverno.io',
          'resource.k8s.io',
          'scheduling.k8s.io',
          'snapshot.storage.k8s.io',
          'storage.k8s.io',
          'wgpolicyk8s.io'
        ]) &&
        !(
          request.resource.group == 'networking.k8s.io' &&
          request.resource.resource == 'networkpolicies'
        ) &&
        !(
          request.resource.group == 'networking.k8s.io' &&
          request.resource.resource == 'ingresses' &&
          variables.reqNs in ['canine-k8s-builder', 'canine-system']
        )
      message: >-
        Canine の ServiceAccount から特権 API グループ（Admission・CRD・Kyverno・ExternalSecret・Config Sync・Cilium・Snapshot 等）、NetworkPolicy、および canine-k8s-builder / canine-system 内の Ingress を変更することはできません。

    # 4. Namespace のラベル偽装・不正採用・不正削除の防止、Service の externalIPs 禁止、および
    #    PVC・StatefulSet volumeClaimTemplates・ワークロード volumes 経由のボリューム不正指定の拒否
    - expression: >-
        !(
          request.resource.group == '' &&
          request.resource.resource == 'namespaces' &&
          request.operation in ['CREATE', 'UPDATE'] &&
          (
            object == null ||
            type(object) != type({}) ||
            !has(object.metadata) ||
            type(object.metadata) != type({}) ||
            !has(object.metadata.name) ||
            type(object.metadata.name) != string ||
            object.metadata.name == '' ||
            (has(request.name) && request.name != '' && object.metadata.name != request.name) ||
            (has(object.metadata.labels) && object.metadata.labels != null && type(object.metadata.labels) != type({})) ||
            (
              has(object.metadata.labels) && type(object.metadata.labels) == type({}) && 'wax100.io/promote' in object.metadata.labels &&
              object.metadata.labels['wax100.io/promote'] != null && type(object.metadata.labels['wax100.io/promote']) != string
            ) ||
            (
              has(object.metadata.labels) && type(object.metadata.labels) == type({}) && 'wax100.io/sandbox' in object.metadata.labels &&
              object.metadata.labels['wax100.io/sandbox'] != null && type(object.metadata.labels['wax100.io/sandbox']) != string
            ) ||
            (
              (has(object.metadata.labels) && type(object.metadata.labels) == type({}) && 'wax100.io/promote' in object.metadata.labels
                ? (type(object.metadata.labels['wax100.io/promote']) == string ? '1:' + object.metadata.labels['wax100.io/promote'] : '2:')
                : '0:')
              !=
              (oldObject != null && type(oldObject) == type({}) && has(oldObject.metadata) && type(oldObject.metadata) == type({}) && has(oldObject.metadata.labels) && type(oldObject.metadata.labels) == type({}) && 'wax100.io/promote' in oldObject.metadata.labels
                ? (type(oldObject.metadata.labels['wax100.io/promote']) == string ? '1:' + oldObject.metadata.labels['wax100.io/promote'] : '2:')
                : '0:')
            ) ||
            (
              (has(object.metadata.labels) && type(object.metadata.labels) == type({}) && 'wax100.io/sandbox' in object.metadata.labels
                ? (type(object.metadata.labels['wax100.io/sandbox']) == string ? '1:' + object.metadata.labels['wax100.io/sandbox'] : '2:')
                : '0:')
              !=
              (oldObject != null && type(oldObject) == type({}) && has(oldObject.metadata) && type(oldObject.metadata) == type({}) && has(oldObject.metadata.labels) && type(oldObject.metadata.labels) == type({}) && 'wax100.io/sandbox' in oldObject.metadata.labels
                ? (type(oldObject.metadata.labels['wax100.io/sandbox']) == string ? '1:' + oldObject.metadata.labels['wax100.io/sandbox'] : '2:')
                : '0:')
            ) ||
            (
              has(object.metadata.labels) &&
              type(object.metadata.labels) == type({}) &&
              'app.kubernetes.io/managed-by' in object.metadata.labels &&
              (type(object.metadata.labels['app.kubernetes.io/managed-by']) != string || object.metadata.labels['app.kubernetes.io/managed-by'] == 'configmanagement.gke.io')
            ) ||
            (
              has(object.metadata.labels) &&
              type(object.metadata.labels) == type({}) &&
              'kubernetes.io/metadata.name' in object.metadata.labels &&
              (type(object.metadata.labels['kubernetes.io/metadata.name']) != string || object.metadata.labels['kubernetes.io/metadata.name'] != object.metadata.name)
            ) ||
            (
              !(object.metadata.name == 'canine-k8s-builder' && variables.targetNs == 'canine-k8s-builder') &&
              (
                !(
                  has(object.metadata.labels) &&
                  type(object.metadata.labels) == type({}) &&
                  'caninemanaged' in object.metadata.labels &&
                  type(object.metadata.labels['caninemanaged']) == string &&
                  object.metadata.labels['caninemanaged'] == 'true'
                ) ||
                (
                  request.operation == 'UPDATE' &&
                  oldObject != null &&
                  !(
                    type(oldObject) == type({}) &&
                    has(oldObject.metadata) &&
                    type(oldObject.metadata) == type({}) &&
                    has(oldObject.metadata.labels) &&
                    type(oldObject.metadata.labels) == type({}) &&
                    'caninemanaged' in oldObject.metadata.labels &&
                    type(oldObject.metadata.labels['caninemanaged']) == string &&
                    oldObject.metadata.labels['caninemanaged'] == 'true'
                  )
                )
              )
            )
          )
        ) &&
        !(
          request.resource.group == '' &&
          request.resource.resource == 'namespaces' &&
          request.operation == 'DELETE' &&
          variables.targetNs != 'canine-k8s-builder' &&
          !(
            oldObject != null
              ? (type(oldObject) == type({}) && has(oldObject.metadata) && type(oldObject.metadata) == type({}) && has(oldObject.metadata.labels) && type(oldObject.metadata.labels) == type({}) && 'caninemanaged' in oldObject.metadata.labels && type(oldObject.metadata.labels['caninemanaged']) == string && oldObject.metadata.labels['caninemanaged'] == 'true')
              : (object != null && type(object) == type({}) && has(object.metadata) && type(object.metadata) == type({}) && has(object.metadata.labels) && type(object.metadata.labels) == type({}) && 'caninemanaged' in object.metadata.labels && type(object.metadata.labels['caninemanaged']) == string && object.metadata.labels['caninemanaged'] == 'true')
          )
        ) &&
        !(
          request.resource.group == '' &&
          request.resource.resource == 'services' &&
          variables.reqSubResource == '' &&
          request.operation in ['CREATE', 'UPDATE'] &&
          object != null &&
          type(object) == type({}) &&
          has(object.spec) &&
          type(object.spec) == type({}) &&
          has(object.spec.externalIPs) &&
          object.spec.externalIPs != null &&
          (type(object.spec.externalIPs) != list || size(object.spec.externalIPs) > 0)
        ) &&
        !(
          request.resource.group == '' &&
          request.resource.resource == 'persistentvolumeclaims' &&
          request.operation in ['CREATE', 'UPDATE'] &&
          object != null &&
          type(object) == type({}) &&
          has(object.spec) &&
          type(object.spec) == type({}) &&
          (
            (has(object.spec.storageClassName) && object.spec.storageClassName != null && (type(object.spec.storageClassName) != string || object.spec.storageClassName == 'manual')) ||
            (has(object.spec.dataSource) && object.spec.dataSource != null) ||
            (has(object.spec.dataSourceRef) && object.spec.dataSourceRef != null) ||
            (
              has(object.spec.volumeName) &&
              object.spec.volumeName != null &&
              (
                type(object.spec.volumeName) != string ||
                (
                  object.spec.volumeName != '' &&
                  (
                    request.operation == 'CREATE' ||
                    !(
                      oldObject != null &&
                      type(oldObject) == type({}) &&
                      has(oldObject.spec) &&
                      type(oldObject.spec) == type({}) &&
                      has(oldObject.spec.volumeName) &&
                      type(oldObject.spec.volumeName) == string &&
                      oldObject.spec.volumeName == object.spec.volumeName
                    )
                  )
                )
              )
            )
          )
        ) &&
        !(
          request.resource.group == 'apps' &&
          request.resource.resource == 'statefulsets' &&
          request.operation in ['CREATE', 'UPDATE'] &&
          object != null &&
          type(object) == type({}) &&
          has(object.spec) &&
          type(object.spec) == type({}) &&
          has(object.spec.volumeClaimTemplates) &&
          type(object.spec.volumeClaimTemplates) == list &&
          object.spec.volumeClaimTemplates.exists(vct,
            vct != null &&
            type(vct) == type({}) &&
            has(vct.spec) &&
            type(vct.spec) == type({}) &&
            (
              (has(vct.spec.storageClassName) && vct.spec.storageClassName != null && (type(vct.spec.storageClassName) != string || vct.spec.storageClassName == 'manual')) ||
              (has(vct.spec.volumeName) && vct.spec.volumeName != null && (type(vct.spec.volumeName) != string || vct.spec.volumeName != '')) ||
              (has(vct.spec.dataSource) && vct.spec.dataSource != null) ||
              (has(vct.spec.dataSourceRef) && vct.spec.dataSourceRef != null)
            )
          )
        ) &&
        !(
          variables.workloadPodSpec != null &&
          has(variables.workloadPodSpec.volumes) &&
          type(variables.workloadPodSpec.volumes) == list &&
          variables.workloadPodSpec.volumes.exists(vol,
            vol != null &&
            type(vol) == type({}) &&
            (
              (has(vol.gcePersistentDisk) && vol.gcePersistentDisk != null) ||
              (has(vol.csi) && vol.csi != null) ||
              (
                has(vol.ephemeral) &&
                type(vol.ephemeral) == type({}) &&
                has(vol.ephemeral.volumeClaimTemplate) &&
                type(vol.ephemeral.volumeClaimTemplate) == type({}) &&
                has(vol.ephemeral.volumeClaimTemplate.spec) &&
                type(vol.ephemeral.volumeClaimTemplate.spec) == type({}) &&
                (
                  (has(vol.ephemeral.volumeClaimTemplate.spec.storageClassName) && vol.ephemeral.volumeClaimTemplate.spec.storageClassName != null && (type(vol.ephemeral.volumeClaimTemplate.spec.storageClassName) != string || vol.ephemeral.volumeClaimTemplate.spec.storageClassName == 'manual')) ||
                  (has(vol.ephemeral.volumeClaimTemplate.spec.volumeName) && vol.ephemeral.volumeClaimTemplate.spec.volumeName != null && (type(vol.ephemeral.volumeClaimTemplate.spec.volumeName) != string || vol.ephemeral.volumeClaimTemplate.spec.volumeName != '')) ||
                  (has(vol.ephemeral.volumeClaimTemplate.spec.dataSource) && vol.ephemeral.volumeClaimTemplate.spec.dataSource != null) ||
                  (has(vol.ephemeral.volumeClaimTemplate.spec.dataSourceRef) && vol.ephemeral.volumeClaimTemplate.spec.dataSourceRef != null)
                )
              )
            )
          )
        )
      message: >-
        Canine の ServiceAccount から caninemanaged=true ラベル無しの Namespace（canine-k8s-builder を除く）の作成・更新・削除、システムラベルの不正操作、Service の externalIPs 指定、および不正な PVC・ボリューム（manual / volumeName / dataSource / gcePersistentDisk / csi 等）の指定を行うことはできません。

    # 5. dev や canine-system 等の Namespace 内で、ClusterRole を参照する RoleBinding（削除を含む）や、
    #    特権動詞・特権 25 API グループ・Namespace / PVC / PV / Node / NetworkPolicy /（builder・system の）Ingress
    #    変更権限を含む Role を作成・更新して別 ServiceAccount 経由で境界を迂回する経路を拒否する
    - expression: >-
        !(
          request.resource.group == 'rbac.authorization.k8s.io' && (
            (
              request.resource.resource == 'rolebindings' && (
                (
                  request.operation in ['CREATE', 'UPDATE'] && (
                    object == null ||
                    type(object) != type({}) ||
                    !has(object.roleRef) ||
                    type(object.roleRef) != type({}) ||
                    !has(object.roleRef.kind) ||
                    type(object.roleRef.kind) != string ||
                    object.roleRef.kind != 'Role' ||
                    !has(object.roleRef.name) ||
                    type(object.roleRef.name) != string ||
                    object.roleRef.name == ''
                  )
                ) ||
                (
                  request.operation == 'DELETE' && (
                    oldObject != null
                      ? !(type(oldObject) == type({}) && has(oldObject.roleRef) && type(oldObject.roleRef) == type({}) && has(oldObject.roleRef.kind) && type(oldObject.roleRef.kind) == string && oldObject.roleRef.kind == 'Role' && has(oldObject.roleRef.name) && type(oldObject.roleRef.name) == string && oldObject.roleRef.name != '')
                      : !(object != null && type(object) == type({}) && has(object.roleRef) && type(object.roleRef) == type({}) && has(object.roleRef.kind) && type(object.roleRef.kind) == string && object.roleRef.kind == 'Role' && has(object.roleRef.name) && type(object.roleRef.name) == string && object.roleRef.name != '')
                  )
                )
              )
            ) ||
            (
              request.resource.resource == 'roles' &&
              request.operation in ['CREATE', 'UPDATE'] && (
                object == null ||
                type(object) != type({}) ||
                (has(object.rules) && object.rules != null && type(object.rules) != list) ||
                (
                  has(object.rules) &&
                  type(object.rules) == list &&
                  object.rules.exists(r,
                    r == null ||
                    type(r) != type({}) ||
                    (has(r.verbs) && r.verbs != null && type(r.verbs) != list) ||
                    (has(r.apiGroups) && r.apiGroups != null && type(r.apiGroups) != list) ||
                    (has(r.resources) && r.resources != null && type(r.resources) != list) ||
                    (has(r.verbs) && type(r.verbs) == list && r.verbs.exists(v, type(v) == string && v in ['*', 'bind', 'escalate', 'impersonate'])) ||
                    (has(r.apiGroups) && type(r.apiGroups) == list && r.apiGroups.exists(g, type(g) == string && g in [
                      '*',
                      'rbac.authorization.k8s.io',
                      'admissionregistration.k8s.io',
                      'apiextensions.k8s.io',
                      'apiregistration.k8s.io',
                      'certificates.k8s.io',
                      'cilium.io',
                      'cloud.google.com',
                      'configmanagement.gke.io',
                      'configsync.gke.io',
                      'external-secrets.io',
                      'flowcontrol.apiserver.k8s.io',
                      'gateway.networking.k8s.io',
                      'generators.external-secrets.io',
                      'kpt.dev',
                      'kyverno.io',
                      'net.gke.io',
                      'networking.gke.io',
                      'node.k8s.io',
                      'openreports.io',
                      'policies.kyverno.io',
                      'reports.kyverno.io',
                      'resource.k8s.io',
                      'scheduling.k8s.io',
                      'snapshot.storage.k8s.io',
                      'storage.k8s.io',
                      'wgpolicyk8s.io'
                    ])) ||
                    (
                      has(r.apiGroups) && type(r.apiGroups) == list && r.apiGroups.exists(g, type(g) == string && g == '') &&
                      has(r.resources) && type(r.resources) == list && r.resources.exists(res, type(res) == string && (
                        res == '*' || res.startsWith('*/') ||
                        res == 'namespaces' || res.startsWith('namespaces/') ||
                        res == 'persistentvolumeclaims' || res.startsWith('persistentvolumeclaims/') ||
                        res == 'persistentvolumes' || res.startsWith('persistentvolumes/') ||
                        res == 'nodes' || res.startsWith('nodes/')
                      )) &&
                      has(r.verbs) && type(r.verbs) == list && r.verbs.exists(v, type(v) == string && v in ['create', 'update', 'patch', 'delete', 'deletecollection'])
                    ) ||
                    (
                      has(r.apiGroups) && type(r.apiGroups) == list && r.apiGroups.exists(g, type(g) == string && g == 'networking.k8s.io') &&
                      has(r.resources) && type(r.resources) == list && r.resources.exists(res, type(res) == string && (
                        res == '*' || res.startsWith('*/') ||
                        res == 'networkpolicies' || res.startsWith('networkpolicies/') ||
                        (variables.reqNs in ['canine-k8s-builder', 'canine-system'] && (res == 'ingresses' || res.startsWith('ingresses/')))
                      )) &&
                      has(r.verbs) && type(r.verbs) == list && r.verbs.exists(v, type(v) == string && v in ['create', 'update', 'patch', 'delete', 'deletecollection'])
                    )
                  )
                )
              )
            )
          )
        )
      message: >-
        Canine の ServiceAccount から ClusterRole を参照する RoleBinding の操作や、特権 API グループ・特権動詞・保護リソース変更権限を含む Role の作成・更新を行うことはできません。
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: canine-cluster-boundary
spec:
  policyName: canine-cluster-boundary
  validationActions:
    - Deny
