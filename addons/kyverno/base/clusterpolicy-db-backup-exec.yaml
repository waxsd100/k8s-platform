# =============================================================================
# db-backup の exec を DB のコンテナだけに絞る
#
# バックアップの CronJob（infra/db-backup）は、クラスタ内の DB をダンプするために
# pods/exec をクラスタ全体で持つ。RBAC では「DB の Pod だけ」と書けない
# （Canine が Namespace を動的に作るので、Namespace ごとの Role にできない）。
# そこで exec の要求を Admission で見て、exec 先のコンテナが DB のポート
# （containerPort 5432 = PostgreSQL / 3306 = MySQL・MariaDB）を宣言していなければ拒否する。
# これで ServiceAccount のトークンが漏れても、Canine や Config Sync などのコンテナに入ることはできない。
#
# ポートは components/infrastructure/backup/base/scripts/targets.rb の DB_PORTS と揃える
# （ずれると hack/check-backup-consistency.sh が CI で落とす）。
# イメージ名では決めない（派生イメージを足すたびに 2 か所を直すことになるため）。
# プラットフォーム自身のコンテナ（Canine・Config Sync など）はこのポートを宣言していない。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: db-backup-exec-scope
  annotations:
    policies.kyverno.io/title: Restrict db-backup exec to database containers
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      infra/db-backup の ServiceAccount による exec を、DB のポート（containerPort 5432 / 3306）を
      宣言しているコンテナに限る。
spec:
  background: false
  # Fail の Webhook が管理者の kubectl exec を巻き込まないよう、API サーバー側で絞る
  # （理由は clusterpolicy-app-scheduling.yaml の matchConditions を参照）。
  webhookConfiguration:
    matchConditions:
      - name: only-db-backup
        expression: "request.userInfo.username == 'system:serviceaccount:infra:db-backup'"
  rules:
    - name: only-database-containers
      match:
        any:
          - resources:
              kinds:
                - Pod/exec
              operations:
                - CONNECT
            subjects:
              - kind: ServiceAccount
                name: db-backup
                namespace: infra
      context:
        - name: dbPorts
          apiCall:
            urlPath: "/api/v1/namespaces/{{request.namespace}}/pods/{{request.name}}"
            # exec 先のコンテナが宣言している DB のポートの数。-c を付けない exec はコンテナ名が空になり、
            # 0 になって拒否される
            jmesPath: "length(spec.containers[?name=='{{request.object.container}}'] | [0].ports[?containerPort==`5432` || containerPort==`3306`] || `[]`)"
      validate:
        failureAction: Enforce
        message: >-
          db-backup は DB のポート（containerPort 5432 / 3306）を宣言しているコンテナにしか exec できません。
        deny:
          conditions:
            any:
              - key: "{{ dbPorts }}"
                operator: Equals
                value: 0
