# =============================================================================
# db-backup の exec を DB のコンテナだけに絞る
#
# バックアップの CronJob（infra/db-backup）は、クラスタ内の DB をダンプするために
# pods/exec をクラスタ全体で持つ。RBAC では「DB の Pod だけ」と書けない
# （Canine が Namespace を動的に作るので、Namespace ごとの Role にできない）。
# そこで exec の要求を Admission で見て、exec 先のコンテナのイメージが公式の
# postgres / mysql / mariadb でなければ拒否する。これで ServiceAccount のトークンが漏れても、
# Canine や Config Sync などのコンテナに入ることはできない。
#
# イメージは Kyverno の registry-mirror で書き換えた後の値
# （asia-northeast1-docker.pkg.dev/.../docker-hub-cache/postgres:18 など）を見る。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: db-backup-exec-scope
  annotations:
    policies.kyverno.io/title: Restrict db-backup exec to database containers
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      infra/db-backup の ServiceAccount による exec を、公式の postgres / mysql / mariadb
      イメージのコンテナに限る。
spec:
  background: false
  # Fail の Webhook が管理者の kubectl exec を巻き込まないよう、API サーバー側で絞る
  # （理由は clusterpolicy-app-scheduling.yaml の matchConditions を参照）。
  webhookConfiguration:
    matchConditions:
      - name: only-db-backup
        expression: "request.userInfo.username == 'system:serviceaccount:infra:db-backup'"
  rules:
    - name: only-database-containers
      match:
        any:
          - resources:
              kinds:
                - Pod/exec
              operations:
                - CONNECT
            subjects:
              - kind: ServiceAccount
                name: db-backup
                namespace: infra
      context:
        - name: containerImage
          apiCall:
            urlPath: "/api/v1/namespaces/{{request.namespace}}/pods/{{request.name}}"
            # -c を付けない exec はコンテナ名が空になり、一致せず拒否される
            jmesPath: "spec.containers[?name=='{{request.object.container}}'].image | [0] || ''"
      validate:
        failureAction: Enforce
        message: >-
          db-backup は公式の postgres / mysql / mariadb イメージのコンテナにしか exec できません。
        deny:
          conditions:
            any:
              - key: "{{ regex_match('(^|/)(library/)?(postgres|mysql|mariadb)(:|@)', '{{containerImage}}') }}"
                operator: Equals
                value: false
