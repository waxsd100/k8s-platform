# =============================================================================
# dev（Canine が作った Namespace）と本番（prod-<app>）のアプリの通信を分ける
#
# アプリの Namespace（dev = caninemanaged=true / 本番 = prod-*）に NetworkPolicy を配り、Pod への通信を
#   - 同じ Namespace の Pod
#   - ingress-nginx（infra。外からの入口は Cloudflare Tunnel → ingress-nginx だけ）
#   - dev だけ: ほかの dev の Namespace（Canine はアドオンの DB などを別の Namespace に置くため）と、
#     port-forward の中継 Pod（dev-access）
# からに限る。dev のアプリから本番の DB に繋ぐ、本番から dev に繋ぐ、本番の別のアプリの
# Namespace に繋ぐ、はどれも遮断される。本番のアプリ同士を繋ぎたいときは、そのアプリの
# overlay（本番）に NetworkPolicy を足して許可する（NetworkPolicy は足し算で効く）。
#
# 出ていく通信（DNS・外部 API・rest-server へのリストアなど）は制限しない。
# 受ける側の Namespace がそれぞれこのポリシーで守られるので、dev → 本番は本番側で止まる。
#
# 生成物は Git に無いので、Canine も Config Sync も消さない。消されても synchronize で戻す。
# dev は Canine が Namespace に必ず付けるラベル caninemanaged=true で、本番は名前（prod-*）で見分ける。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: environment-isolation
  annotations:
    policies.kyverno.io/title: Isolate dev and prod application namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      Canine が作った Namespace と prod-* に、同じ Namespace と ingress-nginx からの通信だけを
      許す NetworkPolicy を生成する。
spec:
  rules:
    - name: isolate-app-namespaces
      # NOTE: generate ルールの match / exclude は、作った後に変えられない（Kyverno が更新を拒否し、
      # Config Sync が KNV2009 で止まる）。変えるときはルール名も変えて、別のルールとして入れ直す。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - prod-*
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  caninemanaged: "true"
      # ラベルは付け替えられるので、プラットフォームの Namespace は名前で必ず外す
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - canine
                - canine-k8s-builder
                # Canine がクラスタに入れる部品（cert-manager など）の置き場。caninemanaged=true だが dev のアプリではない
                - canine-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: environment-isolation
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - podSelector: {}
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: infra
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: ingress-nginx

    # dev だけ、port-forward の中継 Pod（dev-access。hack/dev-port-forward.sh）からの通信も受ける。
    # gVisor の Pod には port-forward できないので、gVisor の外の中継 Pod を経由する。
    # 本番（prod-*）には付けない
    - name: allow-dev-access-relay
      # NOTE: generate ルールの match / exclude は、作った後に変えられない（上と同じ）。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  caninemanaged: "true"
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - canine
                - canine-k8s-builder
                - canine-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - prod-*
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: dev-access-relay
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: dev-access
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: port-forward-relay

    # dev 同士は通信できる（dev から dev だけ。本番は受けない）。
    # Canine はアドオン（PostgreSQL・Redis などの Helm チャート）を、使うプロジェクトとは別の Namespace に
    # 必ず入れる（同じ Namespace は Canine が拒否する）。dev のアプリから自分の DB に届くよう、dev の
    # Namespace は Canine が作ったほかの Namespace からの通信を受ける。dev はすべて gVisor の中で動く。
    - name: allow-dev-to-dev
      # NOTE: generate ルールの match / exclude は、作った後に変えられない（上と同じ）。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  caninemanaged: "true"
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - canine
                - canine-k8s-builder
                - canine-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - prod-*
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: dev-to-dev
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        caninemanaged: "true"
---
# 上の生成に必要な権限
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:environment-isolation
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
