# =============================================================================
# dev（VelaUX が作った Namespace）と本番（prod-<app>）のアプリの通信を分ける
#
# アプリの Namespace（dev = usage.oam.dev/runtime=target / 本番 = prod-*）に NetworkPolicy を配り、
# Pod への着信を
#   - 同じ Namespace の Pod
#   - ingress-nginx（infra。外からの入口は Cloudflare Tunnel → ingress-nginx だけ）
#   - dev だけ: ほかの dev の Namespace（dev のアプリから別 Namespace の dev DB 等へ繋ぐため。
#     ただし Config Sync 管理下やプラットフォーム系 Namespace は除外）と、
#     port-forward の中継 Pod（dev-access）
# からに限る。dev のアプリから本番の DB に繋ぐ、本番から dev に繋ぐ、本番の別のアプリの
# Namespace に繋ぐ、はどれも遮断される。本番のアプリ同士を繋ぎたいときは、そのアプリの
# overlay（本番）に NetworkPolicy を足して許可する（NetworkPolicy は足し算で効く）。
#
# 外向き通信（Egress）は制限せず、宛先 Namespace 側の Ingress NetworkPolicy によって
# 環境間・プラットフォームへの通信を遮断する。
#
# 生成物は Git に無いので、VelaUX も Config Sync も消さない。消されても synchronize で戻す。
# dev は VelaUX が Target 作成時に付けるラベル usage.oam.dev/runtime=target（かつ Config Sync 管理外）で、
# 本番は名前（prod-*）で見分ける。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: environment-isolation
  annotations:
    policies.kyverno.io/title: Isolate dev and prod application namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      VelaUX が作った Dev Namespace（usage.oam.dev/runtime=target）と prod-* に、
      着信の環境分離を行う NetworkPolicy を生成する。
spec:
  rules:
    - name: isolate-app-namespaces
      # NOTE: synchronize: true の generate ルールの match / exclude は、同じ ClusterPolicy のままでは
      # 変えられない（Kyverno が旧ルール集合の部分集合判定を行い、Config Sync が KNV2009 で止まる）。
      # 構築後に match / exclude を変えるときは ClusterPolicy の metadata.name と generate.name を新しくして入れ直す。
      # generate.data の中身だけの変更はハッシュ対象外なので、そのまま更新できる。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - prod-*
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  usage.oam.dev/runtime: "target"
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: DoesNotExist
      # ラベルは付け替えられるので、プラットフォームの Namespace は名前で必ず外す
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - prod
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - vela-system
                - velaux-store
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: environment-isolation
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - podSelector: {}
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: infra
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: ingress-nginx

    # dev だけ、port-forward の中継 Pod（dev-access。hack/dev-port-forward.sh）からの通信も受ける。
    # gVisor の Pod には port-forward できないので、gVisor の外の中継 Pod を経由する。
    # 本番（prod-*）には付けない
    - name: allow-dev-access-relay
      # NOTE: synchronize: true の generate ルールの match / exclude は同じ ClusterPolicy のままでは変えられない（上と同じ）。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  usage.oam.dev/runtime: "target"
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: DoesNotExist
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - prod
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - vela-system
                - velaux-store
                - prod-*
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: dev-access-relay
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: dev-access
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: port-forward-relay

    # dev 同士は通信できる（dev から dev だけ。本番は受けない）。
    # VelaUX の Dev Namespace 間でアプリと DB 等を分離配置した際に通信できるよう、
    # Dev Namespace は他の Dev Namespace（usage.oam.dev/runtime=target かつ Config Sync 管理外）からの
    # 通信を受ける。プラットフォーム用 Namespace は名前と managed-by DoesNotExist の二重で除外する。
    - name: allow-dev-to-dev
      # NOTE: synchronize: true の generate ルールの match / exclude は同じ ClusterPolicy のままでは変えられない（上と同じ）。
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  usage.oam.dev/runtime: "target"
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: DoesNotExist
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - prod
                - kube-*
                - gke-*
                - gmp-*
                - config-management-*
                - resource-group-system
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - dev-access
                - vela-system
                - velaux-store
                - prod-*
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: dev-to-dev
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        usage.oam.dev/runtime: "target"
                      matchExpressions:
                        - key: app.kubernetes.io/managed-by
                          operator: DoesNotExist
                        - key: kubernetes.io/metadata.name
                          operator: NotIn
                          values:
                            - default
                            - prod
                            - kube-system
                            - kube-public
                            - kube-node-lease
                            - config-management-system
                            - config-management-monitoring
                            - resource-group-system
                            - kyverno
                            - external-secrets
                            - reloader
                            - headlamp
                            - infra
                            - vela-system
                            - velaux-store
                            - dev-access
                            - gmp-system
                            - gmp-public
                            - gke-system
                            - gke-connect
                            - gke-managed-system
---
# 上の生成に必要な権限
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:environment-isolation
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
