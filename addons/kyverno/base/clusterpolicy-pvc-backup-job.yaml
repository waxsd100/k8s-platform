# =============================================================================
# pvc-backup が作る Job を「restic で送るだけ」の形に縛る
#
# PVC のバックアップ（infra/pvc-backup）は、一時ディスクをマウントして restic で送る Job を
# infra に作る。infra には cloudflared のトークンや、exec・削除の権限を持つ ServiceAccount
# （db-backup / restic-maintenance）もあるので、Job を自由に作れると、それらを使う Pod を
# 作れてしまう。そこで pvc-backup による Job の作成を Admission で見て、次以外を拒否する。
#   - ServiceAccount は pvc-backup-mover（権限なし）で、トークンをマウントしない
#   - コンテナは restic のイメージだけ。initContainers は持たない
#   - Secret は restic-client の鍵を env で読むだけ（envFrom・Secret ボリュームは不可）
#   - ボリュームは一時ディスク（pvcb- で始まる PVC）と emptyDir だけ
#   - ホストの名前空間・privileged は不可。足せる capability は DAC_READ_SEARCH だけ
# RBAC で pvc-backup に渡しているのは Job の create だけ（update / patch は無い）。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pvc-backup-job-scope
  annotations:
    policies.kyverno.io/title: Restrict jobs created by pvc-backup
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      infra/pvc-backup の ServiceAccount が作る Job を、pvc-backup-mover で restic を
      動かし一時ディスクを読むだけのものに限る。
spec:
  background: false
  # Fail の Webhook が他の Job の作成を巻き込まないよう、API サーバー側で絞る
  # （clusterpolicy-db-backup-exec.yaml と同じ）
  webhookConfiguration:
    matchConditions:
      - name: only-pvc-backup
        expression: "request.userInfo.username == 'system:serviceaccount:infra:pvc-backup'"
  rules:
    - name: only-restic-mover
      match:
        any:
          - resources:
              kinds:
                - Job
              operations:
                - CREATE
            subjects:
              - kind: ServiceAccount
                name: pvc-backup
                namespace: infra
      validate:
        failureAction: Enforce
        message: >-
          pvc-backup が作れる Job は、pvc-backup-mover で restic を動かし、
          一時ディスク（pvcb-*）と restic-client の鍵だけを使うものに限られます。
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.template.spec.serviceAccountName || '' }}"
                operator: NotEquals
                value: pvc-backup-mover
              - key: "{{ to_string(request.object.spec.template.spec.automountServiceAccountToken) }}"
                operator: NotEquals
                value: "false"
              - key: "{{ length(request.object.spec.template.spec.initContainers || `[]`) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.template.spec.containers[?!contains(image, 'restic/restic')]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.template.spec.containers[].envFrom[]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.template.spec.containers[].env[].valueFrom.secretKeyRef.name | [?@ != 'restic-client']) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length((request.object.spec.template.spec.volumes || `[]`)[?!(persistentVolumeClaim || emptyDir)]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length((request.object.spec.template.spec.volumes || `[]`)[].persistentVolumeClaim.claimName | [?!starts_with(@, 'pvcb-')]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.template.spec.[hostNetwork, hostPID, hostIPC][?@]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.template.spec.containers[].securityContext.privileged | [?@]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.template.spec.containers[].securityContext.capabilities.add[] | [?@ != 'DAC_READ_SEARCH']) }}"
                operator: GreaterThan
                value: 0
