# =============================================================================
# Ingress のホスト名を dev と本番で厳密に分ける
#
# 入口の ingress-nginx は dev と本番で共通なので、Ingress を作れれば、どの Namespace からでも
# 任意のホスト名を名乗れる。dev（Canine の画面でドメインを足すだけで作れる）が本番の
# ホスト名（<app>.wax100.io）を名乗ると、本番への通信の一部が dev のアプリに流れる。
# NetworkPolicy（environment-isolation）は ingress-nginx からの通信を通すので、これは防げない。
# また Cloudflare Universal SSL は *.wax100.io の 1 階層下にしか効かないため、多段サブドメインや
# ワイルドカード（*.wax100.io）も拒否する。
#
#   prod-*        1 階層の <host>.wax100.io のみ（dev-* とプラットフォーム予約ホスト
#                 canine / dashboard / backup.wax100.io は不可）
#   それ以外      1 階層の dev-<app>.wax100.io だけ（Canine が作った dev の Namespace）
# どちらも、空ルール・ホスト名の無いルール（全ホストを受ける）・defaultBackend（どのルールにも当たらない
# 通信の行き先）・不一致の spec.tls[].hosts（SNI 横取り）は使えない。
#
# プラットフォームの Namespace には Ingress が無い（Cloudflare Tunnel が Service に直接流す）。
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ingress-hosts-by-environment
  annotations:
    policies.kyverno.io/title: Keep dev and prod ingress hosts apart
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      prod-* の Ingress は 1 階層の <host>.wax100.io（dev-* と予約ホストを除く）に、
      それ以外のアプリの Namespace の Ingress は 1 階層の dev-<app>.wax100.io に限る。
      空ルール・ホスト名の無いルール・defaultBackend・不正な spec.tls[].hosts も拒否する。
spec:
  background: false
  # Fail の Webhook がプラットフォームの操作を巻き込まないよう、API サーバー側で絞る
  webhookConfiguration:
    failurePolicy: Fail
    matchConditions:
      - name: only-app-namespaces
        expression: >-
          !(request.namespace in [
            'kube-system', 'kube-node-lease', 'kube-public',
            'gmp-system', 'gmp-public',
            'config-management-system', 'config-management-monitoring', 'resource-group-system',
            'canine', 'infra', 'external-secrets', 'kyverno', 'reloader', 'headlamp',
            'canine-k8s-builder', 'canine-system', 'dev-access'
          ] || request.namespace.startsWith('gke-managed-'))
  rules:
    - name: prod-hosts
      match:
        any:
          - resources:
              kinds:
                - Ingress
              namespaces:
                - prod-*
              operations:
                - CREATE
                - UPDATE
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          本番（prod-*）の Ingress で使えるホスト名は 1 階層の <host>.wax100.io だけです
          （dev-*・プラットフォーム予約ホスト・多段サブドメイン・ワイルドカード・ホスト省略・空ルール・defaultBackend は使えません）。
        deny:
          conditions:
            any:
              - key: "{{ contains(keys(request.object.spec || `{}`), 'defaultBackend') }}"
                operator: Equals
                value: true
              - key: "{{ length(request.object.spec.rules || `[]`) }}"
                operator: Equals
                value: 0
              - key: "{{ length((request.object.spec.rules || `[]`)[?!host]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(((request.object.spec.rules || `[]`)[].host)[?type(@) != 'string' || !regex_match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.wax100\\.io$', @)]) }}"
                operator: GreaterThan
                value: 0
              - key: '{{ length(((request.object.spec.rules || `[]`)[].host)[?type(@) == ''string'' && (starts_with(@, ''dev-'') || contains(`["canine.wax100.io", "dashboard.wax100.io", "backup.wax100.io"]`, @))]) }}'
                operator: GreaterThan
                value: 0
              - key: "{{ length(((request.object.spec.tls || `[]`)[].hosts[])[?type(@) != 'string' || !regex_match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.wax100\\.io$', @) || starts_with(@, 'dev-') || contains(`[\"canine.wax100.io\", \"dashboard.wax100.io\", \"backup.wax100.io\"]`, @)]) }}"
                operator: GreaterThan
                value: 0

    - name: dev-hosts
      match:
        any:
          - resources:
              kinds:
                - Ingress
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - gke-managed-*
                - gmp-system
                - gmp-public
                - config-management-system
                - config-management-monitoring
                - resource-group-system
                - canine
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                - canine-k8s-builder
                - canine-system
                - dev-access
                - prod-*
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          dev の Ingress のホスト名は 1 階層の dev-<app>.wax100.io にしてください
          （本番の <app>.wax100.io・多段サブドメイン・ワイルドカード・ホスト省略・空ルール・defaultBackend は使えません）。
        deny:
          conditions:
            any:
              - key: "{{ contains(keys(request.object.spec || `{}`), 'defaultBackend') }}"
                operator: Equals
                value: true
              - key: "{{ length(request.object.spec.rules || `[]`) }}"
                operator: Equals
                value: 0
              - key: "{{ length((request.object.spec.rules || `[]`)[?!host]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(((request.object.spec.rules || `[]`)[].host)[?type(@) != 'string' || !regex_match('^dev-[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.wax100\\.io$', @)]) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(((request.object.spec.tls || `[]`)[].hosts[])[?type(@) != 'string' || !regex_match('^dev-[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.wax100\\.io$', @)]) }}"
                operator: GreaterThan
                value: 0
