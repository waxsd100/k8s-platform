apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-app-host-access
  annotations:
    policies.kyverno.io/title: Deny host access from application pods
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: >-
      アプリ用 Namespace の Pod から、ノードのネットワーク・PID・IPC・
      ファイルシステム・特権への到達を拒否する。apps-pool には Canine 経由で
      利用者が投入した任意のコンテナが載るため、ここを開けるとノードの
      メタデータサーバに届き、ノードの ServiceAccount のトークンが取れてしまう。
spec:
  background: false
  # Kyverno が止まっていても、対象外の Namespace の Pod 作成を巻き込まないための条件。
  # Kyverno の Webhook は既定で kube-system と kyverno 以外の**全 Namespace**で呼ばれ、
  # 下の exclude は Kyverno の中でしか効かない。Fail のまま Kyverno が落ちると、
  # infra (cloudflared / ingress-nginx) や Config Sync の Pod まで作れなくなる。
  # matchConditions を付けると Kyverno はこのポリシー専用の Webhook を作り、
  # 条件は API サーバーが評価する（Kyverno が落ちていても対象外は素通しになる）。
  # NOTE: 下の exclude と同じ一覧を保つこと。
  webhookConfiguration:
    matchConditions:
      - name: only-app-namespaces
        expression: >-
          !(request.namespace in [
            'kube-system', 'kube-node-lease', 'kube-public',
            'gmp-system', 'gmp-public',
            'config-management-system', 'config-management-monitoring', 'resource-group-system',
            'canine', 'infra', 'external-secrets', 'kyverno', 'reloader',
            'canine-k8s-builder'
          ] || request.namespace.startsWith('gke-managed-'))
  rules:
    - name: deny-host-namespaces-and-privilege
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                # GKE / Kubernetes のシステム
                - kube-system
                - kube-node-lease
                - kube-public
                - gke-managed-*
                - gmp-system
                - gmp-public
                # Config Sync
                - config-management-system
                - config-management-monitoring
                - resource-group-system
                # 本リポジトリが管理するプラットフォーム構成要素
                - canine
                - infra
                - external-secrets
                - kyverno
                - reloader
                - headlamp
                # Canine のビルダー (BuildKit) は privileged が必須で、ここで拒否すると
                # アプリを 1 つもビルドできない。hostPath 等だけ禁止しても privileged は
                # ノードの root と等価なので意味が無い。代わりに専用の build-pool に
                # 隔離し (clusterpolicy-build-scheduling.yaml)、本番アプリと同じノードに
                # 載せないことで守る。
                - canine-k8s-builder
      validate:
        failureAction: Enforce
        message: >-
          アプリの Pod ではホストのネットワーク / PID / IPC / hostPath /
          特権コンテナを使用できません。
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
            =(volumes):
              - X(hostPath): "null"
            containers:
              - =(securityContext):
                  =(privileged): "false"
                  =(allowPrivilegeEscalation): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
                  =(allowPrivilegeEscalation): "false"
