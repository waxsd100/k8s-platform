              type(object.subjects) == list &&
              size(object.subjects) > 0 &&
              object.subjects.all(s,
                s != null &&
                type(s) == type({}) &&
                has(s.kind) &&
                type(s.kind) == string &&
                s.kind == 'Group' &&
                has(s.apiGroup) &&
                type(s.apiGroup) == string &&
                s.apiGroup == 'rbac.authorization.k8s.io' &&
                has(s.name) &&
                type(s.name) == string &&
                s.name.startsWith('kubevela:project:') &&
                size(s.name) > size('kubevela:project:') &&
                (!has(s.namespace) || s.namespace == null || (type(s.namespace) == string && s.namespace == ''))
              )
            ) ||
            (
              request.operation == 'DELETE' &&
              (
                oldObject != null
                  ? (
                      variables.oldObjName in ['kubevela:writer:binding', 'kubevela:writer:application:binding'] &&
                      (variables.reqName == '' || variables.reqName == variables.oldObjName) &&
                      has(oldObject.roleRef) &&
                      type(oldObject.roleRef) == type({}) &&
                      has(oldObject.roleRef.apiGroup) &&
                      type(oldObject.roleRef.apiGroup) == string &&
                      oldObject.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
                      has(oldObject.roleRef.kind) &&
                      type(oldObject.roleRef.kind) == string &&
                      oldObject.roleRef.kind == 'ClusterRole' &&
                      has(oldObject.roleRef.name) &&
                      type(oldObject.roleRef.name) == string &&
                      (
                        (variables.oldObjName == 'kubevela:writer:binding' && oldObject.roleRef.name == 'kubevela:writer') ||
                        (variables.oldObjName == 'kubevela:writer:application:binding' && oldObject.roleRef.name == 'kubevela:writer:application')
                      )
                    )
                  : (
                      variables.reqName in ['kubevela:writer:binding', 'kubevela:writer:application:binding']
                    )
              )
            )
          )
        )
      message: >-
        VelaUX の ServiceAccount による RBAC 操作は Dev Namespace (usage.oam.dev/runtime=target) 内の
        kubevela:writer:binding / kubevela:writer:application:binding (roleRef: ClusterRole/kubevela:writer*,
        subjects: Group rbac.authorization.k8s.io kubevela:project:*) のみ許可されます。
