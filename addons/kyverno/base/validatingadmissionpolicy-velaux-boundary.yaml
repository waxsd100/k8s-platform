    # 5. RBAC 書込制限（rbac.yaml:158-168 の必須 4 不変条件による bind 自己昇格防止）:
    #    - Role / ClusterRole / ClusterRoleBinding は全面禁止
    #    - RoleBinding は Dev Namespace (usage.oam.dev/runtime=target) 内の
