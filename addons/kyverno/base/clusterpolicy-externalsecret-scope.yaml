# =============================================================================
# SecretStore / PushSecret を禁止し、本番（prod-<app>）の ExternalSecret の鍵をそのアプリだけに絞る
#
# 背景:
#   ESO の GCP IAM 権限はプロジェクト全体の secretAccessor（cloudflare-api-token を除く）で、
#   ClusterSecretStore gcp-secret-store は infra・^prod- の全 Namespace に開いている。
#   そのため:
#     1. 任意の Namespace に auth 無指定の SecretStore を作られると、Pod の ADC（eso-sa）経由で
#        gcp-secret-store の Namespace 制限そのものを迂回できてしまう（ESO 側の processSecretStore: false と二重防御）
#     2. prod-foo に任意のキーを指す ExternalSecret が入ると、prod-bar の秘密や
#        vela-promote-github-token・restic-repository-password を
#        prod-foo の Secret として引き出せてしまう。dataFrom.find なら正規表現で一括取得もできる
#
#   昇格ジョブ（promote.rb の secret_id_for）が生成する本番のシークレット ID は必ず
#   「prod-<app>_<名前>」（=「<Namespace 名>_<1文字以上>」）の形になる。区切りを Namespace 名に
#   使えない「_」にしているのは、「-」だと prod-api の ExternalSecret が prod-api-admin の
#   秘密（prod-api-admin-...）まで前方一致で引き出せてしまうため。そこで基盤用の
#   infra を除く全 Namespace に対して次を強制する:
#     - SecretStore と PushSecret の作成・更新は全面禁止、prod-<app> 以外の ExternalSecret も禁止
#     - prod-<app> の ExternalSecret では spec.secretStoreRef を ClusterSecretStore/gcp-secret-store 固定とし、空も拒否
#     - spec.dataFrom[].find と spec.data[] / spec.dataFrom[] の sourceRef（generatorRef・storeRef）は全面禁止
#     - spec.data[].remoteRef.key と spec.dataFrom[].extract.key は必ず
#       「<Namespace 名>_<1文字以上>」で、Secret Manager の許容文字 [A-Za-z0-9_-] のみ
#       （../ 等の経路探索も遮断。version 指定時も同様）
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: externalsecret-scope-by-namespace
  annotations:
    policies.kyverno.io/title: Scope ExternalSecret usage and prod keys to their own namespace
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      infra 以外の全 Namespace で SecretStore と PushSecret を禁止し、
      ExternalSecret を prod-<app> のみに限定した上で ClusterSecretStore/gcp-secret-store 固定・
      dataFrom.find と sourceRef 禁止・remoteRef.key / extract.key の「<Namespace 名>_<1文字以上>」制限を強制する。
spec:
  background: true
  # infra の基盤用 ExternalSecret は対象外（Stage 1 で skip）とし、
  # それ以外の全 Namespace（dev・prod-* 等）で Fail モードで検査する。
  webhookConfiguration:
    failurePolicy: Fail
    matchConditions:
      - name: exclude-platform-secret-namespaces
        expression: "!(request.namespace in ['infra'])"
  rules:
    - name: deny-secretstore-and-non-prod-externalsecrets
      match:
        any:
          - resources:
              kinds:
                - SecretStore
                - PushSecret
                - ExternalSecret
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - infra
      context:
        - name: ns
          variable:
            jmesPath: "request.namespace || request.object.metadata.namespace || ''"
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          SecretStore と PushSecret の作成・更新は禁止されており、ExternalSecret は基盤用（infra）および
          本番アプリ用（prod-<アプリ名>）の Namespace 以外では作成・更新できません。
        deny:
          conditions:
            any:
              - key: "{{ contains(['SecretStore', 'PushSecret'], request.object.kind || request.kind.kind || '') }}"
                operator: Equals
                value: true
              - key: "{{ regex_match('^prod-[a-z0-9]([-a-z0-9]*[a-z0-9])?$', ns) }}"
                operator: Equals
                value: false
              - key: "{{ (request.namespace || '') != '' && (request.object.metadata.namespace || '') != '' && request.namespace != request.object.metadata.namespace }}"
                operator: Equals
                value: true

    - name: require-app-name-in-prod-namespace
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaces:
                - prod-*
              operations:
                - CREATE
                - UPDATE
      context:
        - name: ns
          variable:
            jmesPath: "request.namespace || request.object.metadata.namespace || ''"
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          本番の ExternalSecret は prod-<アプリ名> の Namespace で ClusterSecretStore/gcp-secret-store を指定し、
          1 件以上の spec.data または spec.dataFrom を持つ必要があります。
        deny:
          conditions:
            any:
              - key: "{{ regex_match('^prod-[a-z0-9]([-a-z0-9]*[a-z0-9])?$', ns) }}"
                operator: Equals
                value: false
              - key: "{{ (request.namespace || '') != '' && (request.object.metadata.namespace || '') != '' && request.namespace != request.object.metadata.namespace }}"
                operator: Equals
                value: true
              - key: "{{ (request.object.spec.secretStoreRef.name || '') != 'gcp-secret-store' }}"
                operator: Equals
                value: true
              - key: "{{ (request.object.spec.secretStoreRef.kind || '') != 'ClusterSecretStore' }}"
                operator: Equals
                value: true
              - key: "{{ length([request.object.spec.data || `[]`, request.object.spec.dataFrom || `[]`][]) }}"
                operator: Equals
                value: 0

    - name: restrict-data-remote-refs
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaces:
                - prod-*
              operations:
                - CREATE
                - UPDATE
      context:
        - name: ns
          variable:
            jmesPath: "request.namespace || request.object.metadata.namespace || ''"
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          本番（prod-<アプリ名>）の ExternalSecret の spec.data では sourceRef（generatorRef・storeRef）は使えず、
          remoteRef.key は '<Namespace 名>_<名前>'（Secret Manager で使える英数字・ハイフン・アンダースコア）に
          限られます。他アプリやプラットフォームのシークレットは参照できません。
        foreach:
          - list: "request.object.spec.data || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ contains(keys(element || `{}`), 'sourceRef') }}"
                    operator: Equals
                    value: true
                  - key: "{{ starts_with(element.remoteRef.key || '', join('', [ns, '_'])) }}"
                    operator: Equals
                    value: false
                  - key: "{{ length(element.remoteRef.key || '') <= length(join('', [ns, '_'])) }}"
                    operator: Equals
                    value: true
                  - key: "{{ regex_match('^[A-Za-z0-9_-]+$', element.remoteRef.key || '') }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match('^[A-Za-z0-9_-]*$', element.remoteRef.version || '') }}"
                    operator: Equals
                    value: false

    - name: restrict-datafrom-extract
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaces:
                - prod-*
              operations:
                - CREATE
                - UPDATE
      context:
        - name: ns
          variable:
            jmesPath: "request.namespace || request.object.metadata.namespace || ''"
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          本番（prod-<アプリ名>）の ExternalSecret の spec.dataFrom では find および sourceRef（generatorRef・storeRef）は使えず、
          extract.key は '<Namespace 名>_<名前>'（Secret Manager で使える英数字・ハイフン・アンダースコア）に
          限られます。
        foreach:
          - list: "request.object.spec.dataFrom || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ contains(keys(element || `{}`), 'find') || contains(keys(element || `{}`), 'sourceRef') }}"
                    operator: Equals
                    value: true
                  - key: "{{ starts_with(element.extract.key || '', join('', [ns, '_'])) }}"
                    operator: Equals
                    value: false
                  - key: "{{ length(element.extract.key || '') <= length(join('', [ns, '_'])) }}"
                    operator: Equals
                    value: true
                  - key: "{{ regex_match('^[A-Za-z0-9_-]+$', element.extract.key || '') }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match('^[A-Za-z0-9_-]*$', element.extract.version || '') }}"
                    operator: Equals
                    value: false
---
# background: true で既存の ExternalSecret / SecretStore / PushSecret を検査するための読み取り権限。
# ESO 側で rbac.aggregateToView: false にしているため view には含まれない。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:reports-controller:externalsecrets
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "pushsecrets"]
    verbs: ["get", "list", "watch"]
