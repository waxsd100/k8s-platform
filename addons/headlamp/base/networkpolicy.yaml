# Headlamp の UI（Service 80 -> Pod 4466）にクラスタ内から直接届く経路を塞ぐ。
#
# 外からは Cloudflare Access（dashboard.wax100.io）で守っているが、NetworkPolicy が無いと
# apps-pool のコンテナ等から headlamp.headlamp.svc:80 に直接届いてしまう。
# 許可するのは infra の cloudflared からの着信（DNAT 後のコンテナポート 4466）だけ。
# kubelet のヘルスチェックはノードからの通信で NetworkPolicy の対象外。
# 外向き（Kubernetes API への通信など）は制限しない。
# NOTE: kustomization.yaml にトップレベルの namespace を置いていないため（ClusterRole を含むため）、
#       metadata.namespace を明示する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-ingress-from-tunnel-only
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 4466
