apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - user.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    releaseName: headlamp
    namespace: headlamp
    version: 0.45.0
    valuesInline:
      # 既定では Pod の SA に cluster-admin が付く。権限はログイン用の headlamp-user に分ける
      clusterRoleBinding:
        create: false
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      nodeSelector:
        workload-type: platform
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      resources:
        requests:
          cpu: "10m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
