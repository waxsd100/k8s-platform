apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - user.yaml
  - rbac.yaml
  - networkpolicy.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    releaseName: headlamp
    namespace: headlamp
    version: 0.45.0
    valuesInline:
      # 既定では Pod の SA に cluster-admin が付く。権限はログイン用の headlamp-user に分ける
      clusterRoleBinding:
        create: false
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      nodeSelector:
        workload-type: platform
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      resources:
        requests:
          cpu: "10m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"

# イメージは digest で固定する。タグは上流で付け替えられるが、digest は変わらない。
# helmCharts の version を上げるときは、この images も同じ変更で更新する。
# 更新しないと古いタグと digest が新しいチャートに載るため、
# hack/check-backup-consistency.sh がチャートの描画するタグとの不一致で失敗する。
images:
  - name: ghcr.io/headlamp-k8s/headlamp
    newTag: v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49
