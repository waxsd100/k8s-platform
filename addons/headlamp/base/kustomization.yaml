apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - token-secret.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    releaseName: headlamp
    namespace: headlamp
    version: 0.45.0
    valuesInline:
      # 既定は cluster-admin。操作用に組み込みの edit に絞る（RBAC・Namespace・ノード等は触れない）
      clusterRoleBinding:
        clusterRoleName: edit
      nodeSelector:
        workload-type: platform
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      resources:
        requests:
          cpu: "10m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
