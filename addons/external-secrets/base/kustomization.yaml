apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets

commonAnnotations:
  config.kubernetes.io/depends-on: apps/namespaces/kyverno/Deployment/kyverno-admission-controller

# HelmチャートリポジトリのKustomize宣言的レンダリング
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 0.9.11
    releaseName: external-secrets
    namespace: external-secrets
    valuesInline:
      nodeSelector:
        workload-type: platform
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-pool
                operator: In
                values:
                - platform-xs
                - platform-sm
                - platform-md
                - platform-lg
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      webhook:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      certController:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
