apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets

commonAnnotations:
  config.kubernetes.io/depends-on: apps/namespaces/kyverno/Deployment/kyverno-admission-controller


# HelmチャートリポジトリのKustomize宣言的レンダリング
resources:
  - namespace.yaml

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.10.0
    releaseName: external-secrets
    namespace: external-secrets
    valuesInline:
      nodeSelector:
        workload-type: platform
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      webhook:
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      certController:
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
