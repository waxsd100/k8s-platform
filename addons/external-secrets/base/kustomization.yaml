apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets

# HelmチャートリポジトリのKustomize宣言的レンダリング
# NOTE: Kyverno への依存（config.kubernetes.io/depends-on）は commonAnnotations ではなく
#       下の Deployment 向けパッチだけに付ける。commonAnnotations に置くと 25 個の CRD にまで
#       伝播し、Kyverno 起動時に ExternalSecret CRD が未作成で Webhook ルール登録が遅れる。
resources:
  - namespace.yaml
  - networkpolicy.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
        annotations:
          config.kubernetes.io/depends-on: apps/namespaces/kyverno/Deployment/kyverno-admission-controller

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.10.0
    releaseName: external-secrets
    namespace: external-secrets
    valuesInline:
      # requests が無い (BestEffort) と、スケジューラもオートスケーラも 0 として数える。
      # 単一 4 GiB Spot ノードでの OOM 巻き添えを防ぐため、limits.memory も明示する。
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      nodeSelector:
        workload-type: platform
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      certController:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        nodeSelector:
          workload-type: platform
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      # プラットフォームでは ClusterSecretStore（gcp-secret-store）と ExternalSecret だけを使う。
      # Namespace 単位の SecretStore を有効のまま残すと、任意の Namespace に auth 無指定の
      # SecretStore（Pod の ADC = eso-sa にフォールバック）を作られた際に gcp-secret-store の
      # Namespace 制限を迂回できてしまうため、未使用の Reconciler はすべて無効化する。
      processSecretStore: false
      processPushSecret: false
      processClusterExternalSecret: false
      processClusterPushSecret: false
      processClusterGenerator: false
      # edit / view / admin の集計 ClusterRole に ExternalSecret や SecretStore の
      # 読み書き権限を混ぜない。混ぜたままにすると、prod-* 等で edit や view を持つ主体が
      # 任意のキーを指す ExternalSecret を作って Secret Manager の他アプリ・基盤の秘密を
      # 引き出せてしまう（本番の ExternalSecret は Config Sync だけが作る）。
      # また gcp-secret-store は Pod の Workload Identity (ADC) のみを使うため、
      # 全 Namespace の serviceaccounts/token 作成権限（既定 true）を無効化する。
      rbac:
        serviceAccountTokenCreate: false
        aggregateToView: false
        aggregateToEdit: false
        aggregateToAdmin: false

# イメージは digest で固定する。タグは上流で付け替えられるが、digest は変わらない。
# helmCharts の version を上げるときは、この images も同じ変更で更新する。
# 更新しないと古いタグと digest が新しいチャートに載るため、
# hack/check-backup-consistency.sh がチャートの描画するタグとの不一致で失敗する。
images:
  - name: ghcr.io/external-secrets/external-secrets
    newTag: v2.10.0@sha256:814117b0fd6d121b03e8ba3b6db1cecbe7449a354fc0fc9c4faf73a37aa221b1
