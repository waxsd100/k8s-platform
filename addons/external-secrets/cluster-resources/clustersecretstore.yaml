apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
  annotations:
    # ValidatingWebhookConfiguration (secretstore-validate, failurePolicy: Fail) と CA 注入が
    # 立ち上がってから適用させるため、Config Sync の順序制御で 3 つの Deployment に依存させる。
    config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets,apps/namespaces/external-secrets/Deployment/external-secrets-webhook,apps/namespaces/external-secrets/Deployment/external-secrets-cert-controller
spec:
  provider:
    gcpsm:
      projectID: wax100
  # この Store を使える Namespace を絞る。無指定だと全 Namespace から使え、
  # VelaUX / KubeVela が作る dev アプリの Namespace からもプロジェクトの Secret を取り出せる。
  #   - infra  : cloudflared・バックアップ（restic / rest-server / backrest）・昇格（vela-promote）の CronJob
  #   - prod-* : 昇格した本番アプリ（vela-promote が生成する ExternalSecret）
  # NOTE: cloudflare-api-token は IAM 条件で ESO 自体から見えないようにしている
  #       (terraform/secrets.tf)。
  conditions:
    - namespaces:
        - infra
    - namespaceRegexes:
        - "^prod-"
