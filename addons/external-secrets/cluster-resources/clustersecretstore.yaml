apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
spec:
  provider:
    gcpsm:
      projectID: wax100
  # この Store を使える Namespace を絞る。無指定だと全 Namespace から使え、
  # Canine が作るアプリの Namespace からもプロジェクトの Secret を取り出せる。
  #   - canine : Canine 本体、昇格・スナップショットの CronJob
  #   - infra  : cloudflared
  #   - prod-* : 昇格した本番アプリ（canine-promote が生成する ExternalSecret）
  # NOTE: cloudflare-api-token は IAM 条件で ESO 自体から見えないようにしている
  #       (terraform/secrets.tf)。
  conditions:
    - namespaces:
        - canine
        - infra
    - namespaceRegexes:
        - "^prod-"
