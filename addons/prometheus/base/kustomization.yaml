apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: prometheus
    namespace: monitoring
    includeCRDs: true
    valuesInline:
      prometheus:
        prometheusSpec:
          retention: 24h
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 200m
              memory: 1Gi
      grafana:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
      alertmanager:
        alertmanagerSpec:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 128Mi
      prometheus-node-exporter:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      kube-state-metrics:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi

images:
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    newName: asia-northeast1-docker.pkg.dev/wax100/k8s-cache/kube-state-metrics/kube-state-metrics
  - name: quay.io/prometheus/prometheus
    newName: asia-northeast1-docker.pkg.dev/wax100/quay-cache/prometheus/prometheus
  - name: quay.io/prometheus/alertmanager
    newName: asia-northeast1-docker.pkg.dev/wax100/quay-cache/prometheus/alertmanager
