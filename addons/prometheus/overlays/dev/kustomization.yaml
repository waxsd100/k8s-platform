apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ../../base

images:
  # K8s Registry -> k8s-cache
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    newName: asia-northeast1-docker.pkg.dev/YOUR_PROJECT_ID/k8s-cache/kube-state-metrics/kube-state-metrics
  
  # Quay.io -> quay-cache
  - name: quay.io/prometheus/prometheus
    newName: asia-northeast1-docker.pkg.dev/YOUR_PROJECT_ID/quay-cache/prometheus/prometheus
  - name: quay.io/prometheus/alertmanager
    newName: asia-northeast1-docker.pkg.dev/YOUR_PROJECT_ID/quay-cache/prometheus/alertmanager
  
  # Docker Hub -> docker-hub-cache (kube-rbac-proxy等の場合)
  # - name: bitnami/kube-rbac-proxy
  #   newName: asia-northeast1-docker.pkg.dev/YOUR_PROJECT_ID/docker-hub-cache/bitnami/kube-rbac-proxy
