steps:
  # 1. kustomize build を実行し、GitやHelm等の外部リソースをすべて解決済みのYAMLに生成（Server-Side Hydration）
  - name: "alpine/helm:3.14.0"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache git curl tar

        # kustomize v5.4.3 を固定インストール (再現性のあるビルドのため)
        curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
        tar xzf kustomize_v5.4.3_linux_amd64.tar.gz
        mv kustomize /usr/local/bin/

        # Hydrate 先ディレクトリを作成
        mkdir -p /workspace/hydrated/clusters/platform
        mkdir -p /workspace/hydrated/clusters/development-cluster
        mkdir -p /workspace/hydrated/clusters/staging-cluster
        mkdir -p /workspace/hydrated/clusters/production-cluster

        # 共有インフラ（Platform）のビルド
        kustomize build --enable-helm clusters/platform > /workspace/hydrated/clusters/platform/manifest.yaml

        # 各クラスタ環境ごとにビルド（アプリのみ）
        kustomize build --enable-helm clusters/development-cluster > /workspace/hydrated/clusters/development-cluster/manifest.yaml
        kustomize build --enable-helm clusters/staging-cluster > /workspace/hydrated/clusters/staging-cluster/manifest.yaml
        kustomize build --enable-helm clusters/production-cluster > /workspace/hydrated/clusters/production-cluster/manifest.yaml

        # それぞれ独立したtarボールに固める
        cd /workspace/hydrated
        tar -cf /workspace/platform.tar clusters/platform
        tar -cf /workspace/dev.tar clusters/development-cluster
        tar -cf /workspace/stg.tar clusters/staging-cluster
        tar -cf /workspace/prod.tar clusters/production-cluster

  # 2. Platform（共有インフラ）のPushとTagging
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "append"
      - "-f"
      - "/workspace/platform.tar"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:platform-$COMMIT_SHA"
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "tag"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:platform-$COMMIT_SHA"
      - "platform"

  # 3. Dev環境のPushとTagging
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "append"
      - "-f"
      - "/workspace/dev.tar"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:latest-$COMMIT_SHA"
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "tag"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:latest-$COMMIT_SHA"
      - "latest"

  # 4. Staging環境のPushとTagging
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "append"
      - "-f"
      - "/workspace/stg.tar"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:stg-$COMMIT_SHA"
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "tag"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:stg-$COMMIT_SHA"
      - "stg"

  # 5. Production環境のPushとTagging
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "append"
      - "-f"
      - "/workspace/prod.tar"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:prod-$COMMIT_SHA"
  - name: "gcr.io/go-containerregistry/crane"
    args:
      - "tag"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/config-sync-repo/manifests:prod-$COMMIT_SHA"
      - "prod"

options:
  logging: CLOUD_LOGGING_ONLY
