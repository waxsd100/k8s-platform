steps:
  # 1. リポジトリ全体をtarボールに固める
  - name: 'ubuntu'
    script: |
      tar -cf /workspace/config-sync-image.tar -C /workspace .

  # 2. tarボールをOCIフォーマットとしてArtifact Registryにプッシュする
  - name: 'gcr.io/go-containerregistry/crane'
    args:
      - 'append'
      - '-f'
      - '/workspace/config-sync-image.tar'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/wax100/config-sync-repo/manifests:$COMMIT_SHA'

  # 3. Config Syncが追従できるように 'main' タグを付ける
  - name: 'gcr.io/go-containerregistry/crane'
    args:
      - 'tag'
      - 'asia-northeast1-docker.pkg.dev/wax100/config-sync-repo/manifests:$COMMIT_SHA'
      - 'main'

options:
  logging: CLOUD_LOGGING_ONLY
