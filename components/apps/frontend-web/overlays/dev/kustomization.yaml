apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frontend-dev

resources:
  - ../../base

configMapGenerator:
  - name: frontend-env-config
    behavior: merge
    literals:
      - APP_THEME=dark       # dev環境だけダークテーマにする例
      - LOG_LEVEL=debug      # ログ出力を詳細にする

namePrefix: dev-

images:
  - name: nginx
    newName: asia-northeast1-docker.pkg.dev/YOUR_ACTUAL_GCP_PROJECT_ID/docker-hub-cache/library/nginx
    newTag: "1.25.0-alpine"

replicas:
  - name: frontend-web
    count: 2
