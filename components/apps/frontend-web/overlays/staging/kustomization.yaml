apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stag-frontend

resources:
  - ../../base
  - pdb.yaml

namePrefix: stag-

images:
  - name: nginx
    newTag: "1.25.0-alpine"

replicas:
  - name: frontend-web
    count: 3

patches:
  - path: spot-patch.yaml
  - path: toleration-patch.yaml
