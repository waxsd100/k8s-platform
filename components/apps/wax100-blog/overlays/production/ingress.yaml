apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wax100-blog
  annotations:
    # Edge VM(Caddy)がTLSを終端するため、Nginx IngressレベルではHTTPSリダイレクトを無効化
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Edge VMからのリクエストにX-Forwarded-Proto: httpsを強制（Ghostのリダイレクトループ防止）
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Proto https;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wax100.io
      secretName: wax100-tls-secret
  rules:
    - host: wax100.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wax100-blog
                port:
                  number: 80
