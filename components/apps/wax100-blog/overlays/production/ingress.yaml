apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wax100-blog
  annotations:
    # GCPグローバル静的IP (Terraform: google_compute_global_address.prod_static_ip)
    kubernetes.io/ingress.global-static-ip-name: "prod-wax100-blog-ip"
    # HTTP→HTTPSリダイレクト
    networking.gke.io/v1beta1.FrontendConfig: "prod-wax100-blog-frontend-config"
spec:
  ingressClassName: gce
  tls:
    - hosts:
        - wax100.io
      secretName: wax100-tls-secret
  rules:
    - host: wax100.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wax100-blog
                port:
                  number: 80
