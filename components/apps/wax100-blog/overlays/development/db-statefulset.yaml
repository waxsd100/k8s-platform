apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wax100-blog-db
spec:
  selector:
    matchLabels:
      app: wax100-blog-db
  serviceName: "wax100-blog-db"
  replicas: 1
  template:
    metadata:
      labels:
        app: wax100-blog-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: mysql
        image: mysql:8.4
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
          - name: MYSQL_DATABASE
            value: "ghost"
          - name: MYSQL_USER
            value: "ghost"
        envFrom:
          - secretRef:
              name: wax100-blog-secret
        ports:
        - containerPort: 3306
          name: mysql
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
