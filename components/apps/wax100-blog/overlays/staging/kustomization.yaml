apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stg-wax100-blog

resources:
  - ../../base
  - db-statefulset.yaml
  - db-service.yaml
  - keda-http-scaledobject.yaml

namePrefix: stg-

patches:
  - target:
      kind: ConfigMap
      name: wax100-blog-config
    patch: |-
      - op: replace
        path: /data/url
        value: "https://stg-blog.wax100.com"
      - op: replace
        path: /data/database__connection__host
        value: "stg-wax100-blog-db"
