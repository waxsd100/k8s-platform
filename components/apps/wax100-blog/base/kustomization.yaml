apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - external-secret.yaml

configMapGenerator:
  - name: wax100-blog-config
    literals:
      - url="https://blog.wax100.com" # 仮のURL、Overlayで上書き
      - database__client="mysql"
      - database__connection__host="wax100-blog-db"
      - database__connection__user="ghost"
      - database__connection__database="ghost"

images:
  # ベースとして公式のalpineを宣言しておき、Overlayでビルド済イメージ名へ書き換え
  - name: wax100-blog-custom:latest
    newName: ghost
    newTag: 6-alpine
