apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wax100-tls-external-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: wax100-tls-secret
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: cloudflare-origin-cert
    - secretKey: tls.key
      remoteRef:
        key: cloudflare-origin-key
