apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wax100-blog-external-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: wax100-blog-secret
    creationPolicy: Owner
  data:
    # データベースの接続用パスワード
    - secretKey: database__connection__password
      remoteRef:
        key: wax100-blog-db-password
