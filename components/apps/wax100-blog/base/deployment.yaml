apiVersion: apps/v1
kind: Deployment
metadata:
  name: wax100-blog
spec:
  selector:
    matchLabels:
      app: wax100-blog
  template:
    metadata:
      labels:
        app: wax100-blog
      annotations:
        # パスワード変更時にSecretが更新されたら自動的にPodを再起動する (Reloader等が必要)
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # The image will be replaced by Kustomize in each environment
          image: wax100-blog:latest
          ports:
            - containerPort: 2368
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: wax100-blog-config
            - secretRef:
                name: wax100-blog-secret
                optional: true # Staging/Dev等でSecretがなくても起動エラーを回避する
          volumeMounts:
            - name: ghost-storage
              mountPath: /var/lib/ghost/content/images
              subPath: images
            - name: ghost-storage
              mountPath: /var/lib/ghost/content/media
              subPath: media
            - name: ghost-storage
              mountPath: /var/lib/ghost/content/files
              subPath: files
            - name: ghost-storage
              mountPath: /var/lib/ghost/content/data
              subPath: data
          readinessProbe:
            httpGet:
              path: /ghost/api/admin/site/
              port: 2368
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: ghost-storage
          persistentVolumeClaim:
            claimName: wax100-blog-pvc
