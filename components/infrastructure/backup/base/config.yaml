# restic のクライアント（db-backup・manifest-backup・pvc-backup-mover・Backrest）が共通で読む設定。
# 鍵は Secret restic-client（external-secret.yaml）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-config
data:
  # rest-server のルート = リポジトリ（gs://wax100/restic/ の直下）
  RESTIC_REPOSITORY: rest:http://rest-server.infra.svc.cluster.local:8000/
  RESTIC_REST_USERNAME: backup
  # pvc-backup が作る送り出し用 Job のイメージ。kustomization の replacements が
  # restic-maintenance のイメージ（images で固定した restic/restic）をここへ写す
  MOVER_IMAGE: restic/restic
