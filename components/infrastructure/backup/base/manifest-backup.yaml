# =============================================================================
# dev のアプリ定義および VelaUX データストア（velaux-store）の定期バックアップ（毎日 JST 03:30）
#
# dev のアプリ定義（KubeVela Application と補助リソース）は Git に無いため、
# Config Sync 管理外かつ EXCLUDED_NAMESPACES 以外の Namespace から KINDS を取り出し、
# status と更新のたびに変わるメタデータを落として restic で送る（Secret は含まない）。
# あわせて VelaUX データストア（velaux-store の ConfigMap 群）を暗号化スナップショット
# （--tag velaux-store）として取得する。velaux-store の読取 Role / RoleBinding は
# ../cluster-resources/velaux-store-rbac.yaml で付与する。
# 中身は scripts/manifest-backup.sh と scripts/clean-manifests.rb。
#
# ServiceAccount は KINDS の読み取りだけを持つ（exec も Secret も無い）。
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manifest-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manifest-backup
rules:
  - apiGroups: [""]
    resources:
      [
        namespaces,
        services,
        configmaps,
        persistentvolumeclaims,
        serviceaccounts,
      ]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [core.oam.dev]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manifest-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manifest-backup
subjects:
  - kind: ServiceAccount
    name: manifest-backup
    namespace: infra
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: manifest-backup
spec:
  # 毎日 JST 03:30 (UTC 18:30)。db-backup と同時でよい（別々のスナップショットになる）
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            # rest-server の NetworkPolicy がこのラベルで通す
            app: manifest-backup
        spec:
          restartPolicy: Never
          serviceAccountName: manifest-backup
          nodeSelector:
            workload-type: platform
          tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # restic / kubectl の本体（静的リンク）を ruby イメージに持ち込む
            - name: restic
              image: restic/restic
              command: ["cp", "/usr/bin/restic", "/tools/restic"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tools
                  mountPath: /tools
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  memory: "64Mi"
            - name: kubectl
              image: alpine/kubectl
              command: ["cp", "/usr/local/bin/kubectl", "/tools/kubectl"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tools
                  mountPath: /tools
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  memory: "64Mi"
          containers:
            - name: backup
              # backup CronJob 4 本と vela-promote で共通の ruby イメージ（版は kustomization の images）
              image: ruby
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/manifest-backup.sh"]
              envFrom:
                - configMapRef:
                    name: restic-config
                - secretRef:
                    name: restic-client
              env:
                - name: HOME
                  value: /work
                - name: RESTIC_CACHE_DIR
                  value: /work/.cache
                - name: KINDS
                  value: applications.core.oam.dev,deployment,statefulset,daemonset,cronjob,service,ingress,configmap,pvc,hpa,serviceaccount,networkpolicy
                - name: EXCLUDED_NAMESPACES
                  value: >-
                    kube-system kube-public kube-node-lease default
                    vela-system velaux-store
                    infra external-secrets kyverno reloader headlamp dev-access
                    config-management-system config-management-monitoring
                    resource-group-system
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  memory: "512Mi"
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Gi
            - name: tools
              emptyDir:
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: scripts
              configMap:
                name: backup-scripts
