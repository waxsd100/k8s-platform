apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

# バックアップ一式（restic）。バケット・鍵・権限は terraform/backup.tf、手順は docs/BACKUP.md。
#
#   取る側（rest-server に追記するだけ。既存のスナップショットは消せない）
#     db-backup         クラスタ内の DB の論理ダンプ            毎日 JST 03:30
#     manifest-backup   dev のアプリ定義・VelaUX データストア（velaux-store）  毎日 JST 03:30
#     pvc-backup        本番の PVC のファイル                  毎日 JST 04:30
#   置き場所
#     rest-server       追記専用の入口。restic 専用の gs://wax100-platform を GCS FUSE でマウント
#   見る・戻す
#     backrest          Web UI（backup.wax100.io）。参照・リストア・check だけ
#   消す（これだけが消せる。UI も exec も持たない）
#     restic-maintenance 週次の forget / prune / check          毎週日曜 JST 12:00
#   見張る（取らない・消さない。上の CronJob が止まっていないかを見る）
#     backup-watchdog   一時停止・作られていない・長く成功していないのを見つけて失敗させる   6 時間ごと
resources:
  - config.yaml
  - external-secret.yaml
  - rest-server.yaml
  - backrest.yaml
  - maintenance.yaml
  - networkpolicy.yaml
  - db-backup.yaml
  - manifest-backup.yaml
  - pvc-backup.yaml
  - headlamp.yaml
  - watchdog.yaml

# スクリプトはファイルのまま置き、ConfigMap にして /scripts にマウントする
configMapGenerator:
  - name: backup-scripts
    files:
      - scripts/lib.sh
      - scripts/targets.rb
      - scripts/db-backup.sh
      - scripts/manifest-backup.sh
      - scripts/clean-manifests.rb
      - scripts/pvc-backup.sh
      - scripts/pvc-objects.rb
      - scripts/watchdog.sh
      - scripts/watchdog.rb

# 版を上げるときはここだけを直す（docs/ARCHITECTURE.md の「固定しているバージョン」も）
images:
  - name: restic/rest-server
    newTag: 0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
  - name: garethgeorge/backrest
    newTag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
  - name: restic/restic
    newTag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
  - name: ruby
    # backup CronJob 4 本と vela-promote で共通の utility イメージ。vela-promote/base と揃える
    newTag: 3.4.13-bookworm@sha256:a3d6cdfcefbf681f482be2ad848207f42193745d35695abe3a56327f45bdb515
  - name: alpine/kubectl
    # initContainer で静的リンクの kubectl を /tools へ持ち込む。vela-promote/base と揃える
    newTag: 1.35.4@sha256:9ccd823647622b620dce092d0f1406b8b41d152ce08ac963e3d4683770b14dfd

# pvc-backup が実行時に作る Job は images の対象外なので、固定した restic の版を ConfigMap に写す
replacements:
  - source:
      kind: CronJob
      name: restic-maintenance
      fieldPath: spec.jobTemplate.spec.template.spec.containers.[name=restic].image
    targets:
      - select:
          kind: ConfigMap
          name: restic-config
        fieldPaths:
          - data.MOVER_IMAGE
