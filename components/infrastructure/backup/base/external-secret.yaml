# restic のクライアント（取る側の Job・Backrest・restic-maintenance）が使う鍵。
#   RESTIC_PASSWORD      : リポジトリの暗号鍵
#   RESTIC_REST_PASSWORD : rest-server の Basic 認証（ユーザー名 backup）
# どちらも Terraform が生成して Secret Manager に置く（terraform/backup.tf）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-client
  annotations:
    config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets,apps/namespaces/external-secrets/Deployment/external-secrets-webhook,apps/namespaces/external-secrets/Deployment/external-secrets-cert-controller
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: restic-client
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-repository-password
    - secretKey: RESTIC_REST_PASSWORD
      remoteRef:
        key: restic-rest-server-password
---
# rest-server が読む htpasswd。同じパスワード（32 文字のランダム文字列）から sha で作る。
# bcrypt は refreshInterval ごとに salt が変わって毎時 Secret が書き換わるため、決定的な
# sha にして鍵が変わったときだけ更新させる（平文も上の restic-client で同じ Namespace にある）。
# rest-server はファイルの変更を 30 秒以内に検知して読み直す。
# ESO（v2.10.0）の htpasswd はハッシュ方式が必須の 3 引数（"bcrypt" / "sha"）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rest-server-htpasswd
  annotations:
    config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets,apps/namespaces/external-secrets/Deployment/external-secrets-webhook,apps/namespaces/external-secrets/Deployment/external-secrets-cert-controller
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: rest-server-htpasswd
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: '{{ htpasswd "backup" .password "sha" }}'
  data:
    - secretKey: password
      remoteRef:
        key: restic-rest-server-password
