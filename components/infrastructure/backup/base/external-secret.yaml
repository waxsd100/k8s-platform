# restic のクライアント（取る側の Job・Backrest・restic-maintenance）が使う鍵。
#   RESTIC_PASSWORD      : リポジトリの暗号鍵
#   RESTIC_REST_PASSWORD : rest-server の Basic 認証（ユーザー名 backup）
# どちらも Terraform が生成して Secret Manager に置く（terraform/backup.tf）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-client
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: restic-client
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-repository-password
    - secretKey: RESTIC_REST_PASSWORD
      remoteRef:
        key: restic-rest-server-password
---
# rest-server が読む htpasswd。同じパスワードから bcrypt で作る。
# 更新のたびに salt が変わって中身も変わるが、rest-server はファイルの変更を
# 検知して読み直すので、再起動は要らない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rest-server-htpasswd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: rest-server-htpasswd
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: '{{ htpasswd "backup" .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: restic-rest-server-password
