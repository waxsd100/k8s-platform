# manifest-backup CronJob が VelaUX のデータストア（velaux-store Namespace の ConfigMap）を
# 読み取るための最小権限 Role / RoleBinding（get / list のみ、書込み・Secret 権限なし）。
#
# NOTE: backup/base/kustomization.yaml は namespace: infra を指定しているため、
#       velaux-store 宛ての Role / RoleBinding を base に置くと namespace が infra に
#       上書きされてしまう。namespace 未指定の cluster-resources に配置する。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manifest-backup-velaux-store
  namespace: velaux-store
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manifest-backup-velaux-store
  namespace: velaux-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manifest-backup-velaux-store
subjects:
  - kind: ServiceAccount
    name: manifest-backup
    namespace: infra
