apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.10.1
    releaseName: ingress-nginx
    namespace: infra
    valuesInline:
      controller:
        admissionWebhooks:
          enabled: false
        nodeSelector:
          workload-type: system
        service:
          type: NodePort
          nodePorts:
            http: 30080
            https: 30443
