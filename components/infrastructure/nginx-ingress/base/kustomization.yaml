apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

# cloudflared が *.<domain> をまとめてここへ流す。
# アプリは Ingress リソースを持つだけで公開され、Cloudflare 側の設定も
# DNS レコードの追加も不要になる。

resources:
  - networkpolicy.yaml

helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.15.1
    releaseName: ingress-nginx
    namespace: infra
    valuesInline:
      controller:
        config:
          use-forwarded-headers: "true"
          compute-full-forwarded-for: "true"
          forwarded-for-header: "CF-Connecting-IP"
          # cloudflared が動く Pod CIDR (terraform/variables.tf の pods_cidr)。
          # 同じ CIDR 内の他 Pod からのヘッダ偽装は networkpolicy.yaml で遮断する。
          proxy-real-ip-cidr: "10.4.0.0/14"
          # High / Critical アノテーション（auth-url や mirror-target による SSRF 等）を拒否する
          annotations-risk-level: "Medium"
        admissionWebhooks:
          enabled: false
        # cloudflared の直後に居る唯一の振り分け役。止まるとアプリが全部見えなくなるので
        # system-pool (通常 VM) に置く。system-pool を 1 台に抑えるため 1 レプリカにする
        # （replicaCount: 1 のときチャートは PDB を作らないため、ノード縮退や更新も妨げない）。
        replicaCount: 1
        # メモリ不足時に先に追い出されないよう優先度を上げる（namespaces/priorityclass.yaml）
        priorityClassName: platform-ingress
        nodeSelector:
          workload-type: system
        # インターネットに面した部品が、同じノードの kube-dns 等を圧迫しないよう上限を付ける
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # cloudflared からクラスタ内で到達するだけなので ClusterIP。
        # LoadBalancer にすると転送ルールの固定費が発生する。
        service:
          type: ClusterIP
