apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.10.1
    releaseName: ingress-nginx
    namespace: infra
    valuesInline:
      controller:
        config:
          use-forwarded-headers: "true"
        admissionWebhooks:
          enabled: false
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        service:
          type: NodePort
          nodePorts:
            http: 30080
            https: 30443
