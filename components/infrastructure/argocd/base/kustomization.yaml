apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

resources:
  # アップストリーム（公式配布版）リソースの参照
  - github.com/argoproj/argo-cd//manifests/ha/cluster-install?ref=v2.10.1

images:
  - name: quay.io/argoproj/argocd
    newName: asia-northeast1-docker.pkg.dev/wax100/quay-cache/argoproj/argocd
  - name: ghcr.io/dexidp/dex
    newName: asia-northeast1-docker.pkg.dev/wax100/ghcr-cache/dexidp/dex
  - name: redis
    newName: asia-northeast1-docker.pkg.dev/wax100/docker-hub-cache/library/redis

patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ".*"
      spec:
        template:
          spec:
            tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
  - target:
      kind: StatefulSet
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ".*"
      spec:
        template:
          spec:
            tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
