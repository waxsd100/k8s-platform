# =============================================================================
# rest-server（追記専用）
#
# restic のリポジトリへの入口。--append-only なので、クライアントはスナップショットを
# 足せても、既存のデータ・スナップショットは消せない・上書きできない（ロックファイルだけは消せる）。
# 保存先は gs://wax100 の restic/ を GCS FUSE CSI でマウントした /data。
# URL のルート（rest:http://rest-server...:8000/）で /data そのものをリポジトリにする
# （= gs://wax100/restic/ の直下に config・data/・snapshots/ などが並ぶ）。
#
# 通信は HTTP（クラスタ内だけ）。restic はデータを手元で暗号化してから送るので、
# 経路で見えるのは Basic 認証のパスワードだけ。届くのは NetworkPolicy で
# db-backup と Backrest に絞っている。
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restic-rest-server
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  labels:
    app: rest-server
spec:
  replicas: 1
  # 同じリポジトリを 2 つの rest-server が同時にマウントしないように
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
      annotations:
        # GCS FUSE のサイドカーを注入させる。既定の要求（250m / 256Mi）は
        # platform-pool には大きいので下げる
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-request: "50m"
        gke-gcsfuse/memory-request: "128Mi"
        gke-gcsfuse/ephemeral-storage-request: "1Gi"
    spec:
      serviceAccountName: restic-rest-server
      nodeSelector:
        workload-type: platform
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: rest-server
          image: restic/rest-server
          # イメージの entrypoint.sh は /data/.htpasswd を作ろうとするので使わない
          command: ["rest-server"]
          args:
            - --path=/data
            - --listen=:8000
            - --append-only
            - --htpasswd-file=/etc/rest-server/htpasswd
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: repo
              mountPath: /data
            - name: htpasswd
              mountPath: /etc/rest-server
              readOnly: true
      volumes:
        - name: repo
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: wax100
              # 権限はマネージドフォルダ restic/ にしか無いので、バケット全体の確認は飛ばす
              skipCSIBucketAccessCheck: "true"
              # rest-server は MkdirAll でディレクトリを作るが、restic-maintenance が
              # 作ったものも見えるよう implicit-dirs を付ける
              mountOptions: "only-dir=restic,implicit-dirs,uid=65532,gid=65532"
        - name: htpasswd
          secret:
            secretName: rest-server-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: rest-server
spec:
  selector:
    app: rest-server
  ports:
    - name: http
      port: 8000
      targetPort: http
