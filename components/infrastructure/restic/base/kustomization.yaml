apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

# restic のリポジトリ（GCS の <project>-restic）まわり。
#   rest-server        : 追記専用の入口。バケットを GCS FUSE でマウントする
#   backrest           : Web UI（backup.wax100.io）。参照・リストア・check だけ
#   restic-maintenance : 週次の forget / prune / check。消せるのはこれだけ
# バックアップを取るのは components/infrastructure/db-backup の CronJob。
# バケット・権限・鍵は terraform/db-backup.tf。
resources:
  - external-secret.yaml
  - rest-server.yaml
  - backrest.yaml
  - maintenance.yaml
  - networkpolicy.yaml

images:
  - name: restic/rest-server
    newTag: 0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
  - name: garethgeorge/backrest
    newTag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
  - name: restic/restic
    newTag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
