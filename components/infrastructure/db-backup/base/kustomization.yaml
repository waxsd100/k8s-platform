apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

# クラスタ内の PostgreSQL / MySQL のダンプと、Canine のアプリ定義を毎日 restic で
# rest-server（追記専用）に送る。送り先は components/infrastructure/restic、
# バケットと鍵は terraform/db-backup.tf。
resources:
  - rbac.yaml
  - cronjob.yaml

images:
  - name: ghcr.io/caninehq/canine
    # Canine 本体のイメージを流用する（kubectl・ruby を同梱。restic は initContainer で持ち込む）
    newTag: latest@sha256:68b19aee1c646e7620e388876cc8c9ff0334bafbc4b0374c26c7a8c9ddba04ff
  - name: restic/restic
    newTag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
