# バックアップ専用の ServiceAccount。
# 読み取りと DB コンテナへの exec だけを持つ。Secret は読めない（DB のパスワードは
# DB コンテナの中の環境変数を、コンテナの中で使うだけ）。
#
# exec はクラスタ全体に効く強い権限なので、Kyverno の db-backup-exec-scope で
# 「postgres / mysql の公式イメージのコンテナ」以外への exec を拒否している。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: db-backup
rules:
  - apiGroups: [""]
    resources:
      [
        pods,
        namespaces,
        services,
        configmaps,
        persistentvolumeclaims,
        serviceaccounts,
      ]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  # WebSocket の exec は GET、SPDY は POST（create）で来るので両方要る
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: db-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: db-backup
subjects:
  - kind: ServiceAccount
    name: db-backup
    namespace: infra
