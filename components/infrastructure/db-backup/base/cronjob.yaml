# =============================================================================
# クラスタ内 DB とアプリ定義の定期バックアップ
#
# DB: 実行中の Pod のうち、コンテナのイメージが公式の postgres / mysql のもの
#     （Namespace は問わない）。Pod に wax100.io/backup: "false" があれば対象外。
#     kubectl exec で DB コンテナの中のツールを使い論理ダンプを取る。
#       postgres: pg_dumpall --clean --if-exists
#       mysql   : mysqldump --all-databases --single-transaction
#     ダンプ末尾の完了の印を確かめてから、DB ごとに 1 スナップショットとして送る。
#     → restic スナップショット  パス /work/db/<Namespace>/<Pod>.sql  タグ db,<Namespace>
#
# アプリ定義: Canine が管理する Namespace（Config Sync 管理下と EXCLUDED_NAMESPACES を除く）
#     の KINDS を、status と更新のたびに変わるメタデータを落として書き出す。Secret は含まない。
#     → restic スナップショット  パス /work/manifests/<Namespace>.yaml  タグ manifests
#
# 送り先は rest-server（--append-only）の restic リポジトリ（components/infrastructure/restic）。
# 追記しかできないので、この Job を乗っ取られても既存のスナップショットは消せない。
# 圧縮と重複排除は restic がするので、ダンプは gzip せずに置く（前日との差分だけが増える）。
# 保持期間は restic-maintenance の forget。
# 1 つでも失敗したら Job を失敗にする（残りは続ける）。
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  # 毎日 JST 03:30 (UTC 18:30)
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 失敗した DB だけでなく全部を取り直すので、再試行は 1 回まで
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            # rest-server の NetworkPolicy がこのラベルで通す
            app: db-backup
        spec:
          restartPolicy: Never
          serviceAccountName: db-backup
          nodeSelector:
            workload-type: platform
          tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          initContainers:
            # restic の本体（静的リンク）を Canine のイメージに持ち込む
            - name: restic
              image: restic/restic
              command: ["cp", "/usr/bin/restic", "/tools/restic"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: ghcr.io/caninehq/canine:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail

                  restic=/tools/restic
                  work=/work
                  failed=0
                  done_count=0

                  # リポジトリが無ければ作る（初回だけ）。有るのに読めないときは init も
                  # 「既に有る」で失敗するので、上書きの心配は無い
                  if ! "${restic}" cat config > /dev/null 2>&1; then
                    "${restic}" init || { echo "ERROR: restic のリポジトリに届きません"; exit 1; }
                  fi

                  # スナップショットのホスト名を固定し、DB ごと（パスごと）に前回を親にさせる
                  snapshot() {
                    "${restic}" backup --host db-backup "$@"
                  }

                  # ---- DB ----
                  # 対象の一覧: "<ns> <pod> <container> <engine>"
                  targets=$(kubectl get pods -A -o json | ruby -rjson -e '
                    JSON.parse(STDIN.read)["items"].each do |pod|
                      meta = pod["metadata"]
                      next if meta.dig("annotations", "wax100.io/backup") == "false"
                      next unless pod.dig("status", "phase") == "Running"
                      ready = (pod.dig("status", "containerStatuses") || []).to_h { |s| [s["name"], s["ready"]] }
                      (pod.dig("spec", "containers") || []).each do |c|
                        m = c["image"].to_s.match(%r{(?:\A|/)(?:library/)?(postgres|mysql)[:@]})
                        next unless m && ready[c["name"]]
                        puts [meta["namespace"], meta["name"], c["name"], m[1]].join(" ")
                      end
                    end
                  ') || { echo "ERROR: Pod の一覧を取れませんでした"; targets=""; failed=1; }

                  while read -r ns pod container engine; do
                    [ -n "${ns}" ] || continue
                    mkdir -p "${work}/db/${ns}"
                    out="${work}/db/${ns}/${pod}.sql"
                    echo "== ${ns}/${pod} (${engine})"

                    case "${engine}" in
                      postgres)
                        # 変数は DB コンテナの中で展開させる。stdin は while read の入力を食わないよう塞ぐ
                        # shellcheck disable=SC2016
                        kubectl exec -n "${ns}" "${pod}" -c "${container}" -- sh -c \
                          'PGPASSWORD="${POSTGRES_PASSWORD:-}" pg_dumpall --clean --if-exists -U "${POSTGRES_USER:-postgres}"' \
                          < /dev/null > "${out}"
                        rc=$?
                        trailer='-- PostgreSQL database cluster dump complete'
                        ;;
                      mysql)
                        # shellcheck disable=SC2016
                        kubectl exec -n "${ns}" "${pod}" -c "${container}" -- sh -c \
                          'mysqldump -uroot -p"${MYSQL_ROOT_PASSWORD}" --all-databases --single-transaction --routines --events --triggers' \
                          < /dev/null > "${out}"
                        rc=$?
                        trailer='-- Dump completed'
                        ;;
                    esac

                    if [ "${rc}" != "0" ] || ! tail -n 5 "${out}" | grep -q -- "${trailer}"; then
                      echo "ERROR: ${ns}/${pod} のダンプに失敗しました"
                      failed=1
                    elif snapshot --tag db --tag "${ns}" "${out}" < /dev/null; then
                      echo "ok: ${out} ($(stat -c %s "${out}") bytes)"
                      done_count=$((done_count + 1))
                    else
                      echo "ERROR: ${ns}/${pod} を restic に送れませんでした"
                      failed=1
                    fi
                    rm -f "${out}"
                  done <<< "${targets}"

                  # ---- アプリ定義 ----
                  namespaces=$(kubectl get ns -l 'app.kubernetes.io/managed-by!=configmanagement.gke.io' \
                    -o jsonpath='{.items[*].metadata.name}') || { echo "ERROR: Namespace の一覧を取れませんでした"; namespaces=""; failed=1; }

                  mkdir -p "${work}/manifests"
                  for ns in ${namespaces}; do
                    case " ${EXCLUDED_NAMESPACES} " in *" ${ns} "*) continue ;; esac
                    case "${ns}" in gke-managed-*|gmp-*) continue ;; esac

                    out="${work}/manifests/${ns}.yaml"
                    kubectl get "${KINDS}" -n "${ns}" -o json --show-managed-fields=false \
                      | ruby -rjson -ryaml -e '
                          list = JSON.parse(STDIN.read)
                          exit 3 if list["items"].empty?
                          list["items"].each do |o|
                            o.delete("status")
                            m = o["metadata"]
                            %w[resourceVersion uid creationTimestamp generation selfLink managedFields].each { |k| m.delete(k) }
                            if (a = m["annotations"])
                              %w[deployment.kubernetes.io/revision kubectl.kubernetes.io/last-applied-configuration
                                 kubectl.kubernetes.io/restartedAt].each { |k| a.delete(k) }
                              m.delete("annotations") if a.empty?
                            end
                          end
                          print list.to_yaml
                        ' > "${out}"
                    rcs=("${PIPESTATUS[@]}")

                    if [ "${rcs[1]}" = "3" ]; then
                      rm -f "${out}"
                      continue
                    fi
                    if [ "${rcs[0]}" != "0" ] || [ "${rcs[1]}" != "0" ]; then
                      echo "ERROR: ${ns} の定義を取り出せませんでした"
                      rm -f "${out}"
                      failed=1
                    else
                      echo "ok: ${out}"
                    fi
                  done

                  # アプリ定義はまとめて 1 スナップショットにする（小さいので）
                  if compgen -G "${work}/manifests/*.yaml" > /dev/null; then
                    if snapshot --tag manifests "${work}/manifests"; then
                      done_count=$((done_count + 1))
                    else
                      echo "ERROR: アプリ定義を restic に送れませんでした"
                      failed=1
                    fi
                  fi

                  echo "完了: ${done_count} 件"
                  exit "${failed}"
              env:
                - name: RESTIC_REPOSITORY
                  value: rest:http://rest-server.infra.svc.cluster.local:8000/
                - name: RESTIC_REST_USERNAME
                  value: backup
                - name: RESTIC_REST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-client
                      key: RESTIC_REST_PASSWORD
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-client
                      key: RESTIC_PASSWORD
                - name: RESTIC_CACHE_DIR
                  value: /work/.cache
                - name: KINDS
                  value: deployment,statefulset,daemonset,cronjob,service,ingress,configmap,pvc,hpa,serviceaccount,networkpolicy
                - name: EXCLUDED_NAMESPACES
                  value: >-
                    kube-system kube-public kube-node-lease default
                    canine canine-k8s-builder infra external-secrets kyverno reloader
                    config-management-system config-management-monitoring
                    resource-group-system
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tools
                  mountPath: /tools
                  readOnly: true
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
          volumes:
            # DB は 1 つずつ置いては消すので、いちばん大きい DB のダンプ（非圧縮）と
            # restic のキャッシュが入れば足りる
            - name: work
              emptyDir:
                sizeLimit: 20Gi
            - name: tools
              emptyDir:
                sizeLimit: 256Mi
