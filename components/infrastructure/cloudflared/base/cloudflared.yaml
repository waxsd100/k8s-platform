apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: infra
  annotations:
    # Secret "cloudflared-credentials" (TUNNEL_TOKEN) の更新で自動再起動する
    reloader.stakater.com/auto: "true"
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # 外部からの唯一の入口なので、停止を許容しない system-pool (通常 VM) に置く。
      # Spot に置くと、回収 1 回でアプリも Canine UI も外から見えなくなる。
      # メモリ不足時に先に追い出されないよう優先度を上げる（namespaces/priorityclass.yaml）。
      # system-pool を 1 台に抑えるため 1 レプリカで動かす（ローリング更新で同一ノードに
      # 新 Pod を先に立てられるよう Anti-Affinity は付けない）。
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      priorityClassName: platform-ingress
      nodeSelector:
        workload-type: system
      containers:
        - name: cloudflared
          # latest のままだと再起動のたびに別バージョンを引き、意図しない更新で止まりうる。
          # 外部からの唯一の入口なのでバージョンを固定する。
          image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # 公式 distroless イメージ (cloudflare/cloudflared) の nonroot UID/GID を明示
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - --grace-period
            - 15s
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-credentials
                  key: TUNNEL_TOKEN
          # kubelet はノードから Pod IP:2000 宛にプローブを送るため --metrics は 0.0.0.0:2000 のままにし、
          # クラスタ内 Pod からの :2000 アクセスは NetworkPolicy で遮断する。
          startupProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          # liveness に /ready を使うと、Cloudflare エッジ側の一時障害で全レプリカが
          # CrashLoopBackOff に入り復旧を遅らせる。ローカルプロセスの生存確認には /metrics を使う。
          livenessProbe:
            httpGet:
              path: /metrics
              port: 2000
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 5
