apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: infra
  annotations:
    # Secret "cloudflared-credentials" (TUNNEL_TOKEN) の更新で自動再起動する
    reloader.stakater.com/auto: "true"
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # 外部からの唯一の入口なので、停止を許容しない system-pool (通常 VM) に置く。
      # Spot に置くと、回収 1 回でアプリも Canine UI も外から見えなくなる。
      nodeSelector:
        workload-type: system
      affinity:
        podAntiAffinity:
          # 2 本を別ノードに分ける。同じノードに並ぶとレプリカを 2 本にした意味が消える
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-credentials
                  key: TUNNEL_TOKEN
          livenessProbe:
            httpGet:
              # Cloudflared has a /ready endpoint on port 2000
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
