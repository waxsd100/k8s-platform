# cloudflared はリモート管理トンネル（トークン方式）で動作する。
# トークンは Secret Manager の cloudflared-tunnel-token に登録し、ここで同期する。
# ルーティング（Public hostname）は Cloudflare ダッシュボード側で設定する。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    # Deployment が secretKeyRef で参照する名前と揃える
    name: cloudflared-credentials
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: cloudflared-tunnel-token
