# cloudflared はリモート管理トンネル（トークン方式）で動作する。
# トンネルの作成・Secret Manager (cloudflared-tunnel-token) への登録・
# ルーティング（Public hostname）はすべて terraform/cloudflare-tunnel.tf で管理する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  annotations:
    config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets,apps/namespaces/external-secrets/Deployment/external-secrets-webhook,apps/namespaces/external-secrets/Deployment/external-secrets-cert-controller
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    # Deployment が secretKeyRef で参照する名前と揃える
    name: cloudflared-credentials
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: cloudflared-tunnel-token
