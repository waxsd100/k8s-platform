apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

# NOTE: ESO への依存 (config.kubernetes.io/depends-on) は ExternalSecret のみに直接付与する
#       （commonAnnotations だと Deployment や NetworkPolicy にまで波及して不要な順序制約が付く）。
# NOTE: Namespace (infra) は ingress-nginx や backup と共用するため
#       components/infrastructure/namespaces が宣言する。
resources:
  - cloudflared.yaml
  - external-secret.yaml
  - networkpolicy.yaml
