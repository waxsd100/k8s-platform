apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev のアプリへ port-forward するための中継 Pod の置き場（hack/dev-port-forward.sh）。
#
# dev の Pod は gVisor（GKE Sandbox）で動き、gVisor の Pod には port-forward できない。
# そこで dev の外のこの Namespace に gVisor 無しの中継 Pod（socat）を一時的に作り、その Pod に
# port-forward する。dev の Namespace は、ここの中継 Pod からの通信だけを追加で受ける
# （addons/kyverno/base/clusterpolicy-environment-isolation.yaml の allow-dev-access-relay）。
# 本番（prod-*）はここからの通信を受けない。
#
# この Namespace は Config Sync の管理下で、Canine は Pod を作れない（Canine の境界を決める
# VAP の保護 Namespace 一覧に入っている）。Pod を作れるのは管理者と wax100-dev。
# wax100-dev の権限（rbac.yaml）はこの Namespace の Pod の作成・port-forward に限るが、Pod の中身
# （イメージ・コマンド・ラベル）は RBAC では縛れない。アプリ向けの hardening（clusterpolicy-app-hardening.yaml）は
# dev-access にも効く。外向き通信は networkpolicy-egress.yaml で中継先と DNS だけに絞る。
namespace: dev-access

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - networkpolicy-egress.yaml
  - rbac.yaml
