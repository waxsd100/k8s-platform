apiVersion: v1
kind: Namespace
metadata:
  name: dev-access
  labels:
    # 非 gVisor の apps-pool で本番 Pod と同居するため、特権・root・hostPath 等を
    # API サーバ組み込みの Pod Security Admission (restricted) でも強制的に拒否する
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
