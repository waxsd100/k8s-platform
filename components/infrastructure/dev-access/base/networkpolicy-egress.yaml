# dev-access の Pod（中継 Pod）の外向き通信を、次の 2 つだけに絞る。
#   1. usage.oam.dev/runtime=target の Namespace（KubeVela / VelaUX の dev）の Pod へ、全ポート。
#      中継 Pod は hack/dev-port-forward.sh の socat で「<TARGET>.<NAMESPACE>.svc.cluster.local」
#      （Service）へ繋ぐ。Service の ClusterIP は Dataplane V2 で Pod の宛先に変換されてから
#      NetworkPolicy が評価されるので、dev の Namespace を選べばよい（相手側の着信は dev の
#      Namespace の Ingress が縛る）。多層防御として Config Sync 管理下およびシステム・プラットフォーム
#      Namespace を明示的に除外する（clusterpolicy-environment-isolation.yaml と同じ除外一覧）。
#   2. DNS（UDP / TCP 53）。上の名前解決に使う。クラスタの DNS は Cloud DNS for GKE（terraform/gke.tf の
#      cluster_dns = CLOUD_DNS）で、宛先は 169.254.169.254。移行中は kube-dns（kube-system）も動くので両方を開ける。
#      NodeLocal DNSCache は無効（terraform/gke.tf に dns_cache_config が無い）なので 169.254.20.10 は開けない。
#
# これで、dev-access の Pod から本番（prod-*）の Pod、メタデータサーバの DNS 以外のポート、
# インターネットには出られなくなる。dev-access の着信は networkpolicy.yaml（deny-ingress）のまま。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-restrict
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              usage.oam.dev/runtime: "target"
            matchExpressions:
              - key: app.kubernetes.io/managed-by
                operator: NotIn
                values:
                  - configmanagement.gke.io
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - default
                  - vela-system
                  - velaux-store
                  - infra
                  - external-secrets
                  - kyverno
                  - reloader
                  - headlamp
                  - dev-access
                  - resource-group-system
                  - kube-system
                  - kube-public
                  - kube-node-lease
                  - config-management-system
                  - config-management-monitoring
                  - gmp-system
                  - gmp-public
                  - gke-system
                  - gke-connect
                  - gke-managed-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
