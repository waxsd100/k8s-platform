# 複数のコンポーネントが相乗りする Namespace。
#
# infra には cloudflared・ingress-nginx・backup が入る。どれか 1 つの
# ディレクトリに Namespace を置くと、そのコンポーネントを外したときに
# ほかが着地先を失う。共有するものは持ち主を分けてここに置く。
#
# Config Sync は Namespace を明示的に宣言することを推奨している
# (宣言しておくとメタデータ管理と削除が可能になる)。
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    # ingress-nginx (NET_BIND_SERVICE) を許容するため enforce は baseline とし、
    # restricted 違反は warn / audit で可視化する。
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
