apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

helmCharts:
  - name: kubernetes-dashboard
    repo: https://kubernetes.github.io/dashboard/
    version: 7.0.0
    releaseName: kubernetes-dashboard
    namespace: infra
    valuesInline:
      app:
        nodeSelector:
          workload-type: app
        tolerations:
          - key: cloud.google.com/gke-spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      api:
        nodeSelector:
          workload-type: app
        tolerations:
          - key: cloud.google.com/gke-spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      web:
        nodeSelector:
          workload-type: app
        tolerations:
          - key: cloud.google.com/gke-spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      metricsScraper:
        nodeSelector:
          workload-type: app
        tolerations:
          - key: cloud.google.com/gke-spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      kong:
        nodeSelector:
          workload-type: app
        tolerations:
          - key: cloud.google.com/gke-spot
            operator: Equal
            value: "true"
            effect: NoSchedule

resources:
  - admin-service-account.yaml
