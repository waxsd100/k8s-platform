apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

helmCharts:
  - name: kubernetes-dashboard
    repo: https://kubernetes-retired.github.io/dashboard/
    version: 7.0.0
    releaseName: kubernetes-dashboard
    namespace: infra
    valuesInline:
      app:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - operator: Exists
      api:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - operator: Exists
        extraEnv:
          - name: CSRF_KEY
            valueFrom:
              secretKeyRef:
                name: kubernetes-dashboard-csrf-key
                key: private.key
      auth:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - operator: Exists
        extraEnv:
          - name: CSRF_KEY
            valueFrom:
              secretKeyRef:
                name: kubernetes-dashboard-csrf-key
                key: private.key
      web:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - operator: Exists
      metricsScraper:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - operator: Exists
      kong:
        nodeSelector:
          workload-type: platform
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-xs
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-sm
              - weight: 40
                preference:
                  matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - platform-md
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-pool
                  operator: In
                  values:
                  - platform-xs
                  - platform-sm
                  - platform-md
                  - platform-lg
        tolerations:
          - operator: Exists

resources:
  - admin-service-account.yaml

patches:
  - target:
      kind: Secret
      name: kubernetes-dashboard-csrf
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: kubernetes-dashboard-csrf
