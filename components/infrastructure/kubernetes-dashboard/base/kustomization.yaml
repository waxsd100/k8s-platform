apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

helmCharts:
  - name: kubernetes-dashboard
    repo: https://kubernetes-retired.github.io/dashboard/
    version: 7.0.0
    releaseName: kubernetes-dashboard
    namespace: infra
    valuesInline:
      app:
        nodeSelector:
          workload-type: system
        tolerations:
          - operator: Exists
      api:
        nodeSelector:
          workload-type: system
        tolerations:
          - operator: Exists
        extraEnv:
          - name: CSRF_KEY
            valueFrom:
              secretKeyRef:
                name: kubernetes-dashboard-csrf-key
                key: private.key
      auth:
        nodeSelector:
          workload-type: system
        tolerations:
          - operator: Exists
        extraEnv:
          - name: CSRF_KEY
            valueFrom:
              secretKeyRef:
                name: kubernetes-dashboard-csrf-key
                key: private.key
      web:
        nodeSelector:
          workload-type: system
        tolerations:
          - operator: Exists
      metricsScraper:
        nodeSelector:
          workload-type: system
        tolerations:
          - operator: Exists
      kong:
        nodeSelector:
          workload-type: system
        tolerations:
          - operator: Exists

resources:
  - admin-service-account.yaml

patches:
  - target:
      kind: Secret
      name: kubernetes-dashboard-csrf
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: kubernetes-dashboard-csrf
