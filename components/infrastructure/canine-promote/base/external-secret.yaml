# platform リポジトリへブランチを push し、Pull Request を立てるためのトークン。
# GitHub の Fine-grained PAT（k8s-platform の Contents / Pull requests: Read and write）を
# Secret Manager の canine-promote-github-token に登録しておく。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canine-promote
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: canine-promote
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: canine-promote-github-token
