apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canine

commonAnnotations:
  config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets

resources:
  - rbac.yaml
  - external-secret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: canine-promote-scripts
    files:
      - promote.rb

images:
  - name: ghcr.io/caninehq/canine
    newTag: latest@sha256:7497df7b08a0e7a67857a3b306681dedf90b5168c2f024f6283f976eeed1213d
