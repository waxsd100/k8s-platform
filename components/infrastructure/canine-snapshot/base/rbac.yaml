# スナップショット専用の読み取り専用 ServiceAccount。
# Canine 本体の cluster-admin とは分離する。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canine-snapshot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canine-snapshot-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, services, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  # NOTE: Secret は意図的に含めない。スナップショットに機密を書き出さないため。
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canine-snapshot-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canine-snapshot-reader
subjects:
  - kind: ServiceAccount
    name: canine-snapshot
    namespace: canine
