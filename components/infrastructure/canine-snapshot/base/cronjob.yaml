# =============================================================================
# Canine がデプロイしたアプリの定義を Git にスナップショットする
#
# Canine は真実の源をこのリポジトリではなく自身の PostgreSQL に持つ。
# それだけでは差分レビューも「いつ何が変わったか」の追跡もできないため、
# クラスタ上の実体を日次で取り出して専用リポジトリへコミットする。
#
# これは一方向のスナップショットであり、GitOps ではない。
#   - 真実の源は依然として Canine (canine-db)
#   - このリポジトリを編集してもクラスタには反映されない
#   - 用途は「変更履歴の可視化」と「Canine を失ったときの復旧材料」
#
# イメージは Canine 本体を再利用する（kubectl と git を同梱しているため）。
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: canine-snapshot
spec:
  # 毎日 JST 04:00 (UTC 19:00)
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # ハングしたまま Forbid で次回以降が止まらないよう打ち切る
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: canine-snapshot
          nodeSelector:
            workload-type: platform
          tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          containers:
            - name: snapshot
              image: ghcr.io/caninehq/canine:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail

                  WORK=$(mktemp -d)
                  git config --global user.email "canine-snapshot@wax100.io"
                  git config --global user.name "canine-snapshot"
                  # トークンを remote URL に埋めない（git の失敗時にログへ出るため）
                  git config --global credential.helper store
                  printf 'https://x-access-token:%s@github.com\n' "${GITHUB_TOKEN}" > ~/.git-credentials
                  chmod 600 ~/.git-credentials
                  git clone --depth 1 "https://github.com/${SNAPSHOT_REPO}.git" "${WORK}/repo"

                  cd "${WORK}/repo"
                  rm -rf namespaces
                  mkdir -p namespaces

                  KINDS="deployment,statefulset,daemonset,cronjob,service,ingress,configmap,pvc,hpa,serviceaccount,networkpolicy"

                  # Config Sync 管理下 (昇格済み) の Namespace は Git が正なので対象外
                  for ns in $(kubectl get ns \
                        -l 'app.kubernetes.io/managed-by!=configmanagement.gke.io' \
                        -o jsonpath='{.items[*].metadata.name}'); do
                    case " ${EXCLUDED_NAMESPACES} " in
                      *" ${ns} "*) continue ;;
                    esac
                    case "${ns}" in
                      gke-managed-*|gmp-*) continue ;;
                    esac

                    out="namespaces/${ns}.yaml"
                    mkdir -p "$(dirname "${out}")"

                    # status と、更新のたびに変わるメタデータを落として差分を安定させる。
                    # Secret は RBAC 上も取得できないため、機密は書き出されない。
                    kubectl get ${KINDS} -n "${ns}" -o yaml --show-managed-fields=false \
                      | ruby -ryaml -e '
                          docs = YAML.load_stream(STDIN.read)
                          volatile_meta = %w[resourceVersion uid creationTimestamp generation selfLink managedFields]
                          volatile_anno = %w[
                            deployment.kubernetes.io/revision
                            kubectl.kubernetes.io/last-applied-configuration
                            kubectl.kubernetes.io/restartedAt
                          ]
                          clean = lambda do |o|
                            return unless o.is_a?(Hash)
                            o.delete("status")
                            if (m = o["metadata"]).is_a?(Hash)
                              volatile_meta.each { |k| m.delete(k) }
                              if (a = m["annotations"]).is_a?(Hash)
                                volatile_anno.each { |k| a.delete(k) }
                                m.delete("annotations") if a.empty?
                              end
                            end
                            (o["items"] || []).each { |i| clean.call(i) }
                          end
                          docs.each { |d| clean.call(d) }
                          puts docs.compact.map(&:to_yaml).join
                        ' > "${out}"
                  done

                  git add -A
                  if git diff --cached --quiet; then
                    echo "no changes"
                    exit 0
                  fi
                  git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  git push origin HEAD
              env:
                - name: SNAPSHOT_REPO
                  value: "waxsd100/canine-apps-snapshot"
                - name: EXCLUDED_NAMESPACES
                  value: >-
                    kube-system kube-public kube-node-lease default
                    canine infra external-secrets kyverno reloader
                    config-management-system config-management-monitoring
                    resource-group-system
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: canine-snapshot
                      key: GITHUB_TOKEN
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
