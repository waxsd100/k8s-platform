apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canine

# Canine 本体と同じ Namespace に置くが、ServiceAccount は分離している
# （スナップショットは読み取り専用、Secret へのアクセス権も持たない）。
commonAnnotations:
  config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets

resources:
  - rbac.yaml
  - external-secret.yaml
  - cronjob.yaml

images:
  - name: ghcr.io/caninehq/canine
    # Canine 本体と同じダイジェストを使う（kubectl と git を含むため流用）
    newTag: latest@sha256:7497df7b08a0e7a67857a3b306681dedf90b5168c2f024f6283f976eeed1213d
