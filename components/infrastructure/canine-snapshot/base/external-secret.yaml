# スナップショット先リポジトリへ push するためのトークン。
# GitHub の Fine-grained PAT（対象リポジトリの Contents: Read and write）を
# Secret Manager の canine-snapshot-github-token に登録しておく。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canine-snapshot
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: canine-snapshot
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: canine-snapshot-github-token
