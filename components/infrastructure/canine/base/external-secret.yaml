apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canine
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    # チャートの Deployment が secretKeyRef で参照する名前と揃える必要がある
    # (templates/deployment.yaml: name: canine / key: secret-key-base)
    name: canine
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret-key-base: "{{ .secretKeyBase }}"
        # Cloud SQL Auth Proxy 経由。DB 名/ユーザー名は Canine の
        # config/database.yml の production 設定に合わせる
        DATABASE_URL: "postgres://canine:{{ .dbPassword }}@127.0.0.1:5432/canine_production"
  data:
    - secretKey: secretKeyBase
      remoteRef:
        key: canine-secret-key-base
    - secretKey: dbPassword
      remoteRef:
        key: canine-db-password
