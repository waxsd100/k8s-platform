apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canine
  annotations:
    # ESO の Webhook 証明書注入と ClusterSecretStore 作成が完了してから同期する
    config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets,apps/namespaces/external-secrets/Deployment/external-secrets-webhook,apps/namespaces/external-secrets/Deployment/external-secrets-cert-controller,external-secrets.io/ClusterSecretStore/gcp-secret-store
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    # チャートの Deployment が secretKeyRef で参照する名前と揃える必要がある
    # (templates/deployment.yaml: name: canine / key: secret-key-base)
    name: canine
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret-key-base: "{{ .secretKeyBase }}"
        # Cloud SQL Auth Proxy 経由。DB 名/ユーザー名は Canine の
        # config/database.yml の production 設定に合わせる。記号を含むパスワードでも壊れないよう urlquery する
        DATABASE_URL: "postgres://canine:{{ .dbPassword | urlquery }}@127.0.0.1:5432/canine_production"
  data:
    - secretKey: secretKeyBase
      remoteRef:
        key: canine-secret-key-base
    - secretKey: dbPassword
      remoteRef:
        key: canine-db-password
