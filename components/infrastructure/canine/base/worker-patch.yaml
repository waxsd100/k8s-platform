# worker (GoodJob) も同じ Cloud SQL 接続を使う。
# こちらは Active Storage を使わないので PVC はマウントしない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canine-worker
spec:
  template:
    spec:
      containers:
        - name: canine-worker
          env:
            - name: DB_POOL_SIZE
              value: "10"
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.10.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "wax100:asia-northeast1:canine-db"
            - "--private-ip"
          securityContext:
            runAsNonRoot: true
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
