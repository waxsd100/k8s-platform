# worker (GoodJob) も同じ Cloud SQL 接続を使う。
# こちらは Active Storage を使わないので PVC はマウントしない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canine-worker
  annotations:
    # Secret "canine" (SECRET_KEY_BASE / DATABASE_URL) が ESO 経由で更新されたら
    # Reloader が自動で rollout restart する
    reloader.stakater.com/auto: "true"
spec:
  template:
    spec:
      # GoodJob の shutdown_timeout (25s) の後に native sidecar の cloud-sql-proxy が
      # --max-sigterm-delay=10s 分だけ接続クローズを待てるよう余裕を持たせる
      terminationGracePeriodSeconds: 45
      # web-patch.yaml と同様に seccomp・権限昇格禁止・最小 capability だけを残す
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canine-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          env:
            # maxThreads=5 + cron 1 = プール 6 接続 + GoodJob Notifier (LISTEN) 1 接続 = 1 Pod あたり最大 7 接続。
            # RollingUpdate 時の 2 Pod 同時稼働でも 14 + web 6 = 最大 20 接続に収まる。
            - name: DB_POOL_SIZE
              value: "6"
            # GoodJob 組み込みの HTTP プローブサーバ（Pod からの着信は canine-deny-all-ingress で全面遮断済み。
            # kubelet のノードからのプローブだけが到達できる）
            - name: GOOD_JOB_PROBE_PORT
              value: "7001"
          startupProbe:
            httpGet:
              path: /status/started
              port: 7001
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 7001
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
      # Cloud SQL Auth Proxy を native sidecar (initContainer + restartPolicy: Always) として動かす。
      # startupProbe (:9090/startup) が通るまで GoodJob の起動を待たせ、
      # 終了時は GoodJob 停止後に --max-sigterm-delay=10s で残存接続を閉じてから終了する。
      # NOTE: distroless イメージには /bin/sh が無いため exec preStop は使わない。
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4@sha256:88501f0a695a586988add1b8a206fdf3f29f9a1a3deeb9b45ef2b1481ea6be83
          args:
            - "--structured-logs"
            - "--port=5432"
            - "--private-ip"
            - "--max-sigterm-delay=10s"
            - "--health-check"
            # kubelet はノードから Pod IP:9090 へプローブを送るため 0.0.0.0 で待受する
            # （他 Pod からの到達は canine/base/networkpolicy.yaml で遮断済み）
            - "--http-address=0.0.0.0"
            - "--http-port=9090"
            - "wax100:asia-northeast1:wax100-db"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: 9090
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
