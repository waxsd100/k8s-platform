apiVersion: v1
kind: Namespace
metadata:
  name: canine
  labels:
    # Canine 本体（公式イメージは root 稼働）との互換性を保ちつつ、特権・hostPath・hostNetwork 等を
    # API サーバ組み込みの Pod Security Admission (baseline) でも強制的に拒否する
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
