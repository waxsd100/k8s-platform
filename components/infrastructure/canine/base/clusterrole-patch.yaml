# Canine の ClusterRole（チャートが作る "*" の全権限）を必要最小限の権限に置き換えるパッチ。
# JSON 6902 の replace で rules 全体を差し替える（RBAC は足し算だけで "*" を縮められないため）。
#
# 背景:
#   境界 VAP（addons/kyverno/base/validatingadmissionpolicy-canine-boundary.yaml）は
#   admissionregistration.k8s.io のオブジェクト（ValidatingAdmissionPolicy / Binding）には効かないため、
#   Canine は自分の境界を削除・書き換えできてしまう。この穴を塞げるのは RBAC だけ。
#   "*" のままだと、ほかにも次が可能だった: impersonate（任意のユーザーへの成り代わり）、
#   CSR の作成・承認（cluster-admin 相当の証明書の発行）、nodes/proxy（kubelet API 経由の任意の Pod 実行）。
#
# 方針:
#   1. 読み取り（get/list/watch）はクラスタ全体に許可する。Canine の UI が全 Namespace を一覧するため。
#      ワイルドカードは core グループと nodes/proxy も読めてしまうので、core は資源を列挙する。
#   2. 書き込みは Canine のソースと同梱チャートが実際に行う操作だけに限る。
#      以下は書き込みを付与していない（境界 VAP が拒否するものも含む）:
#        - admissionregistration / apiextensions / apiregistration / flowcontrol / scheduling / node /
#          storage / resource の書き込み、Kyverno・External Secrets・Config Sync・Cilium・GKE の各グループ
#        - authentication / authorization（レビュー API）、certificates（CSR・signers）
#        - clusterroles / clusterrolebindings、rbac の escalate・bind・impersonate
#        - nodes（全サブリソース）、serviceaccounts/token、pods/attach
#        - networkpolicies（境界 VAP が拒否する。このため NetworkPolicy を作る Add-on
#          （bitnami の postgresql・redis の既定値）は失敗する。Agent Computer のプロビジョニングも同じ理由で失敗する見込み）
#        - cluster 単位のアドオン（ClusterIssuer・cluster package）も付与しない（境界 VAP が拒否する）
#      「念のため」で入れたもの（ソースで確認できていない、または既定値では使われない）:
#        - replicasets・daemonsets・replicationcontrollers・horizontalpodautoscalers の delete
#          （kubectl delete all が category "all" に含まれるこれらを削除対象にするため）
#        - roles・rolebindings の作成・更新・削除（チャートの rbac.create を有効にした場合に必要）
#   3. Canine のアップグレード時や、新しい機能・Add-on が別の API グループを使う場合は、ここに追加する。
#      気付き方: Canine のログや画面に "forbidden" / "cannot ... in the namespace" が出る。
#      その場合は必要な最小の動詞だけを、このファイルに追記し、hydrate で _result.json を更新する。
- op: test
  path: /rules
  value:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["*"]
- op: replace
  path: /rules
  value:
    # 1. 読み取り専用: core 以外のグループ（組み込み + 本リポジトリの CRD + GKE の CRD）
    - apiGroups:
        - admissionregistration.k8s.io
        - apiextensions.k8s.io
        - apiregistration.k8s.io
        - apps
        - autoscaling
        - batch
        - certificates.k8s.io
        - coordination.k8s.io
        - discovery.k8s.io
        - events.k8s.io
        - flowcontrol.apiserver.k8s.io
        - networking.k8s.io
        - node.k8s.io
        - policy
        - rbac.authorization.k8s.io
        - resource.k8s.io
        - scheduling.k8s.io
        - storage.k8s.io
        - metrics.k8s.io
        - autoscaling.k8s.io
        - cert-manager.io
        - kubevirt.io
        - cdi.kubevirt.io
        - subresources.kubevirt.io
        - external-secrets.io
        - generators.external-secrets.io
        - kyverno.io
        - policies.kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        - cilium.io
        - cloud.google.com
        - configmanagement.gke.io
        - configsync.gke.io
        - kpt.dev
        - net.gke.io
        - networking.gke.io
        - gateway.networking.k8s.io
        - snapshot.storage.k8s.io
      resources: ["*"]
      verbs: ["get", "list", "watch"]
    # 2. 読み取り専用: core（nodes/proxy・pods/exec・pods/portforward・serviceaccounts/token は含めない）
    - apiGroups: [""]
      resources:
        - pods
        - pods/log
        - pods/status
        - services
        - services/status
        - endpoints
        - configmaps
        - secrets
        - persistentvolumeclaims
        - persistentvolumeclaims/status
        - persistentvolumes
        - serviceaccounts
        - namespaces
        - namespaces/status
        - events
        - limitranges
        - resourcequotas
        - resourcequotas/status
        - replicationcontrollers
        - replicationcontrollers/status
        - nodes
        - nodes/status
      verbs: ["get", "list", "watch"]
    # 3. 書き込み: core（Pod・Service・ConfigMap・Secret・PVC・ServiceAccount）
    - apiGroups: [""]
      resources:
        - pods
        - services
        - configmaps
        - secrets
        - persistentvolumeclaims
        - serviceaccounts
      verbs: ["create", "update", "patch", "delete"]
    # 4. 実行系: kubectl exec（ファイル操作・シェル）と kubectl port-forward（Agent Computer）
    - apiGroups: [""]
      resources: ["pods/exec", "pods/portforward"]
      verbs: ["create"]
    # 5. 書き込み: Namespace（caninemanaged=true のみ。境界 VAP が制限する）と dummy PV（hostPath のみ。VAP が制限する）
    - apiGroups: [""]
      resources: ["namespaces", "persistentvolumes"]
      verbs: ["create", "update", "patch", "delete"]
    # 6. delete all の対象（ソースでは直接の作成はしない）
    - apiGroups: [""]
      resources: ["replicationcontrollers"]
      verbs: ["delete"]
    # 7. Deployment・StatefulSet（アプリとアドオンの Helm チャート）
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets"]
      verbs: ["create", "update", "patch", "delete"]
    - apiGroups: ["apps"]
      resources: ["replicasets", "daemonsets"]
      verbs: ["delete"]
    # 8. Job・CronJob（ビルド・コマンド実行・定期実行）
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["create", "update", "patch", "delete"]
    # 9. Ingress（ドメイン追加。canine-k8s-builder / canine-system は境界 VAP が拒否する）
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["create", "update", "patch", "delete"]
    # 10. PodDisruptionBudget（bitnami の postgresql・redis・elasticsearch の既定値）
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]
      verbs: ["create", "update", "patch", "delete"]
    # 11. HPA は delete のみ（delete all の対象。作成はしない）
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["delete"]
    # 12. Role・RoleBinding（チャートの rbac.create が有効な場合に必要）。
    #     RBAC の権限包含チェックにより、Canine が持たない権限を含む Role は作れない。
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings"]
      verbs: ["create", "update", "patch", "delete"]
    # 13. Agent Computer の VirtualMachine（作成と起動・停止のための patch。削除は Namespace の削除で行う）
    - apiGroups: ["kubevirt.io"]
      resources: ["virtualmachines"]
      verbs: ["create", "update", "patch"]
