apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canine

# NOTE: ESO への依存（config.kubernetes.io/depends-on）は external-secret.yaml だけに付ける。
#       commonAnnotations に置くと Namespace / PVC / NetworkPolicy / Deployment まで
#       Spot の ESO Deployment 更新に引きずられ、初回同期で vpa.yaml 等が Namespace 未作成エラーを起こす。
resources:
  - namespace.yaml
  - external-secret.yaml
  - pvc.yaml
  - networkpolicy.yaml

helmCharts:
  - name: canine
    repo: https://caninehq.github.io/canine
    version: 0.1.10
    releaseName: canine
    namespace: canine
    valuesInline:
      image:
        repository: ghcr.io/caninehq/canine
        # NOTE: 公式は latest 運用だが、Spot ノードの再作成のたびに別バージョンを
        #       引くと web と worker で版がずれ、マイグレーション済みスキーマと
        #       食い違う。ダイジェストで固定する。
        #       更新手順: crane digest ghcr.io/caninehq/canine:latest
        tag: latest@sha256:68b19aee1c646e7620e388876cc8c9ff0334bafbc4b0374c26c7a8c9ddba04ff
        pullPolicy: IfNotPresent

      canine:
        port: 3000
        # クラスタ内モード: KUBERNETES_SERVICE_HOST と SA トークンから
        # in-cluster kubeconfig を自動生成する (app/services/k8/connection.rb)
        bootMode: cluster
        onboardingMethod: normal
        # 仮の値。Overlay の env パッチで上書きする
        allowedHostname: "*"
        appHost: "http://localhost:3000"

      worker:
        enabled: true
        replicaCount: 1
        maxThreads: 5
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

      # アドオン作成時に Helm リポジトリの index.yaml（groundhog2k は 1.3MB）を
      # web プロセスが丸ごと YAML として読むため、limits は 2Gi を維持し、
      # 平常時のスケジューリング要求（requests）だけ 256Mi に絞る
      resources:
        requests:
          cpu: "50m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "2Gi"

      # --- サブチャートはすべて無効化 ---
      # DB は Cloud SQL、Ingress は cloudflared、証明書は Cloudflare 側で終端するため
      postgresql:
        enabled: false
      cert-manager:
        enabled: false
      traefik:
        enabled: false
      ingress:
        enabled: false

      nodeSelector:
        workload-type: platform
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
patches:
  # 1. チャートの Secret を削除する。
  #    templates/secret.yaml は `lookup` で既存 Secret を探し、見つからなければ
  #    randAlphaNum 64 を生成する。`lookup` はクラスタに接続しない
  #    `kustomize build --enable-helm` では常に空を返すため、Hydrate のたびに
  #    SECRET_KEY_BASE が変わってしまう。代わりに ESO が同名・同キーの
  #    Secret (canine / secret-key-base) を供給する。
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: canine

  # 2. DATABASE_URL をチャート内 PostgreSQL 固定値から Secret 参照に差し替える。
  #    チャートは value をテンプレートで直書きしており、Strategic Merge では
  #    value と valueFrom が共存して不正な env になるため JSON Patch で要素ごと置換する。
  #    `op: test` は index がずれたら build を失敗させるためのガード
  #    (チャート 0.1.10 では DATABASE_URL が env[0])。
  - target:
      kind: Deployment
      name: canine
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: DATABASE_URL
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: canine
              key: DATABASE_URL
  - target:
      kind: Deployment
      name: canine-worker
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: DATABASE_URL
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: canine
              key: DATABASE_URL

  # 3. Probe / ストレージ / Cloud SQL Auth Proxy (チャートには Probe も PVC も無い)
  - path: web-patch.yaml
  - path: worker-patch.yaml

  # 3'. チャートの ClusterRole（"*" の全権限）を必要最小限の権限に置き換える（RBAC の境界）。
  #     理由・除外した権限・追加の手順は clusterrole-patch.yaml の先頭を参照
  - path: clusterrole-patch.yaml
    target:
      kind: ClusterRole
      name: canine

  # 4. チャート由来のリソースに namespace を明示する。
  #    canine のチャートは metadata.namespace を書かないため、従来は kustomize の
  #    namespace トランスフォーマが補っていた。kustomize 5.8.0 以降は helm が
  #    生成したリソースがトランスフォーマの対象から外れ、namespace が付かなくなる。
  #    どちらのバージョンでも同じ結果になるよう、ここで明示する。
  - target:
      kind: ServiceAccount
      name: canine
    patch: |-
      - op: add
        path: /metadata/namespace
        value: canine
  - target:
      kind: Service
      name: canine
    patch: |-
      - op: add
        path: /metadata/namespace
        value: canine
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/namespace
        value: canine

  # 5. ServiceAccount に Workload Identity を紐付け (Cloud SQL Auth Proxy 用)
  #    Strategic Merge Patch にすることで、将来チャート側が他のアノテーションを追加しても消さない。
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: canine
        namespace: canine
        annotations:
          iam.gke.io/gcp-service-account: canine-sa@wax100.iam.gserviceaccount.com
