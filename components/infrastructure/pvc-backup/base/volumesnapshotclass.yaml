# PVC のバックアップで一時的に取る Persistent Disk のスナップショット。
# restic に送り終えたら消す（deletionPolicy: Delete）。保存場所は東京リージョンに固定する。
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: pvc-backup
driver: pd.csi.storage.gke.io
deletionPolicy: Delete
parameters:
  storage-locations: asia-northeast1
