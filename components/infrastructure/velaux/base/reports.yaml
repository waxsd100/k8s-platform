# VelaUX 用ビルトインレポート ConfigMap (全 12 件、namespace: vela-system)。
# 取得元: waxsd100/velaux@feat/kubevela-1.12 (pkg/server/domain/report/builtin/*.cue)
#
# セキュリティ設計:
#   - velaux-server 起動時の reportServiceImpl.Init() は vela-system に未作成の
#     ビルトインレポート ConfigMap (data.template) を自動作成しようとするが、
#     VelaQL ビュー改ざん (template キー注入) を防ぐため kubevela-ux SA による
#     vela-system の任意 ConfigMap 書込は VAP/Kyverno で引き続き禁止する。
#   - 代わりに本ファイルで 12 件を GitOps (Config Sync) により宣言的に事前配置する。
#     velaux.oam.dev/builtin-hash アノテーションを付けないことで、report_builtin.go の
#     decideBuiltin() が初回は builtinRecordOnly (velaux-store のみ記録・vela-system 書込ゼロ)、
#     以降は builtinLeave を返し、403 警告ログや Config Sync ドリフトなしで全レポートが機能する。
#   - 12 件すべてが "vela/report" を import しており、VelaQL コンパイラ (pkg/server/domain/query)
#     の checkImports() が "vela/report" を拒否するため、/api/v1/query 経由での悪用も不可。
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscaler-saturation
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Autoscaler saturation
    // +description=Autoscalers at their maximum, with no room to grow, or running above their CPU target
    // +chart=bar
    // +chart:x=name
    // +chart:y=replicas
    // +chart:title=Replicas now
    import "vela/report"

    template: {
    	parameter: {
    		// +usage=Show every autoscaler, not only the saturated ones
    		// +ui:label=Include those with headroom
    		all: *false | bool
    	}
    	autoscalers: report.#List & {$params: {apiVersion: "autoscaling/v1", kind: "HorizontalPodAutoscaler"}}

    	all: [for h in autoscalers.$returns
    		let spec = h.object.spec
    		let status = [if h.object.status != _|_ {h.object.status}, {}][0]
    		let replicas = [if status.currentReplicas != _|_ {status.currentReplicas}, 0][0]
    		let cpu = [if status.currentCPUUtilizationPercentage != _|_ {status.currentCPUUtilizationPercentage}, null][0]
    		let target = [if spec.targetCPUUtilizationPercentage != _|_ {spec.targetCPUUtilizationPercentage}, null][0] {
    			name:      h.object.metadata.name
    			app:       [if h.object.metadata.labels["app.oam.dev/name"] != _|_ {h.object.metadata.labels["app.oam.dev/name"]}, ""][0]
    			namespace: "\(h.cluster)/\(h.namespace)"
    			"replicas": replicas
    			bounds:    "\([if spec.minReplicas != _|_ {spec.minReplicas}, 1][0])-\(spec.maxReplicas)"
    			"cpu":     cpu
    			"target":  target
    			state: [
    				if replicas >= spec.maxReplicas {"At maximum"},
    				if cpu != null if target != null if cpu > target {"Above CPU target"},
    				"Has headroom",
    			][0]
    		}]

    	stats: [
    		{label: "Autoscalers", value: len(all)},
    		{label: "At maximum", value: len([for a in all if a.state == "At maximum" {a}]), tone: [if len([for a in all if a.state == "At maximum" {a}]) > 0 {"unhealthy"}, "healthy"][0]},
    		{label: "Above CPU target", value: len([for a in all if a.state == "Above CPU target" {a}])},
    	]

    	rows: [...{
    		// +title=Autoscaler
    		name: string
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=State
    		state: string
    		// +title=Replicas
    		replicas: int
    		// +title=Min-max
    		bounds: string
    		// +title=CPU now
    		// +format=percent
    		cpu: number | null
    		// +title=CPU target
    		// +format=percent
    		target: number | null
    		// +title=Namespace
    		namespace: string
    	}]
    	rows: [for a in all if parameter.all || a.state != "Has headroom" {a}]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Delivery
    // +description=Workflow runs per day by how they ended, the success rate, how long a deploy takes, and where runs fail
    // +chart=bar
    // +chart:x=day
    // +chart:group=status
    // +chart:title=Runs per day
    import (
    	"list"
    	"math"
    	"strings"
    	"vela/report"
    )

    template: {
    	parameter: {
    		// +usage=Only failed and terminated runs in the table
    		// +ui:label=Failures only
    		failuresOnly: *false | bool
    	}
    	runs: report.#Runs

    	all: [for r in runs.$returns
    		let at = [if r.started != _|_ {r.started}, ""][0]
    		let failed = [for s in *r.steps | [] if s.phase == "failed" {s}] {
    			app:      r.app
    			run:      r.name
    			env:      [if r.env != _|_ {r.env}, ""][0]
    			status:   r.status
    			step:     [if len(failed) > 0 {failed[0].name}, ""][0]
    			message:  [if len(failed) > 0 if failed[0].message != _|_ {failed[0].message}, ""][0]
    			started:  at
    			seconds:  r.seconds
    			user:     [if r.user != _|_ {r.user}, ""][0]
    			day:      [if len(at) >= 10 {strings.SliceRunes(at, 0, 10)}, "-"][0]
    		}]
    	finished: [for r in all if list.Contains(["succeeded", "failed", "terminated"], r.status) {r}]
    	succeeded: [for r in finished if r.status == "succeeded" {r.seconds}]

    	stats: [
    		{label: "Runs", value: len(all)},
    		{label: "Success rate", format: "percent", value: [if len(finished) > 0 {math.Round(100 * len(succeeded) / len(finished))}, null][0]},
    		{label: "Failed", value: len(finished) - len(succeeded), tone: [if len(finished) > len(succeeded) {"unhealthy"}, "healthy"][0]},
    		{label: "Average deploy", format: "duration", value: [if len(succeeded) > 0 {math.Round(list.Avg(succeeded))}, null][0]},
    	]

    	rows: [...{
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Run
    		// +link=/applications/{app}/envbinding/{env}/workflow/records/{run}
    		run: string
    		// +title=Status
    		// +format=badge
    		status: string
    		// +title=Failed step
    		step: string
    		// +title=Message
    		message: string
    		// +title=Started
    		// +format=time
    		started: string
    		// +title=Took
    		// +format=duration
    		seconds: int
    		// +title=By
    		user: string
    		env:  string
    		day:  string
    	}]
    	rows: list.Sort([for r in all if !parameter.failuresOnly || list.Contains(["failed", "terminated"], r.status) {r}],
    		{x: {}, y: {}, less: x.started > y.started})
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-drift
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Environment drift
    // +description=Environments whose last deploy failed, running an older deploy than another, or not running the application as it is now
    // +chart=pie
    // +chart:x=state
    // +chart:title=Environments by state
    import (
    	"list"
    	"vela/report"
    )

    template: {
    	parameter: {
    		// +usage=Show environments that are up to date as well
    		// +ui:label=Include those up to date
    		all: *false | bool
    	}
    	environments: report.#Environments
    	latestOf: {
    		for e in environments.$returns if e.deployedAt != _|_ {
    			"\(e.app)": list.SortStrings([for o in environments.$returns if o.app == e.app if o.deployedAt != _|_ {o.deployedAt}])
    		}
    	}

    	all: [for e in environments.$returns
    		let at = [if e.deployedAt != _|_ {e.deployedAt}, ""][0]
    		let latest = [if latestOf[e.app] != _|_ {latestOf[e.app][len(latestOf[e.app])-1]}, ""][0] {
    			app:        e.app
    			env:        e.env
    			revision:   [if e.revision != _|_ {e.revision}, ""][0]
    			deployedAt: at
    			user:       [if e.user != _|_ {e.user}, ""][0]
    			state: [
    				if at == "" {"Never deployed"},
    				if e.status != _|_ if e.status == "failure" {"Last deploy failed"},
    				if e.edited {"Changed since deployed"},
    				if at < latest {"Behind another environment"},
    				"Up to date",
    			][0]
    		}]

    	stats: [
    		{label: "Environments", value: len(all)},
    		{label: "Drifted", value: len([for e in all if e.state != "Up to date" {e}]), tone: [if len([for e in all if e.state != "Up to date" {e}]) > 0 {"progressing"}, "healthy"][0]},
    	]

    	rows: [...{
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Environment
    		// +link=/applications/{app}/envbinding/{env}/status
    		env: string
    		// +title=State
    		state: string
    		// +title=Deployed revision
    		revision: string
    		// +title=Deployed
    		// +format=time
    		deployedAt: string
    		// +title=By
    		user: string
    	}]
    	rows: [for e in all if parameter.all || e.state != "Up to date" {e}]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quota-usage
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Quota usage
    // +description=How much of each ResourceQuota in the project's namespaces is used
    // +chart=bar
    // +chart:x=label
    // +chart:y=percent
    // +chart:title=Used, percent of the quota
    import (
    	"list"
    	"math"
    	"strconv"
    	"strings"
    	"vela/report"
    )

    template: {
    	quotas: report.#List & {$params: {apiVersion: "v1", kind: "ResourceQuota"}}

    	// #Amount reads a quota quantity for its resource: CPU in cores, memory and
    	// storage in MiB, anything else as a count.
    	#Amount: {
    		resource: string
    		in:       string | number
    		out: [
    			if resource == "cpu" || strings.HasSuffix(resource, ".cpu") {(report.#CPU & {"in": in}).out},
    			if resource == "memory" || strings.HasSuffix(resource, ".memory") || strings.HasSuffix(resource, "storage") {(report.#Memory & {"in": in}).out},
    			if (in & number) != _|_ {in},
    			if (in & string) != _|_ {strconv.ParseFloat(in, 64)},
    		][0]
    	}

    	rows: [...{
    		// +title=Quota
    		quota: string
    		// +title=Resource
    		resource: string
    		// +title=Used
    		used: string
    		// +title=Of
    		hard: string
    		// +title=Used (percent)
    		// +format=percent
    		percent: number
    		// +title=Namespace
    		namespace: string
    		label:     string
    	}]
    	rows: list.Sort([for q in quotas.$returns
    		let status = [if q.object.status != _|_ {q.object.status}, {}][0]
    		let hard = [if status.hard != _|_ {status.hard}, {}][0]
    		let used = [if status.used != _|_ {status.used}, {}][0]
    		for r, h in hard
    		let u = [if used[r] != _|_ {used[r]}, "0"][0]
    		let hv = (#Amount & {resource: r, in: h}).out
    		let uv = (#Amount & {resource: r, in: u}).out {
    			quota:     q.object.metadata.name
    			resource:  r
    			"used":    "\(u)"
    			"hard":    "\(h)"
    			percent:   [if hv > 0 {math.Round(100 * uv / hv)}, 0][0]
    			namespace: "\(q.cluster)/\(q.namespace)"
    			label:     "\(q.object.metadata.name) \(r)"
    		}], {x: {}, y: {}, less: x.percent > y.percent})

    	stats: [
    		{label: "Highest use", format: "percent", value: [if len(rows) > 0 {rows[0].percent}, null][0], tone: [if len(rows) > 0 if rows[0].percent >= 90 {"unhealthy"}, if len(rows) > 0 if rows[0].percent >= 75 {"progressing"}, "healthy"][0]},
    		{label: "Near the limit (75% or more)", value: len([for r in rows if r.percent >= 75 {r}])},
    	]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recent-changes
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Recent changes
    // +description=Who deployed what, and when, with the note and what triggered it
    import (
    	"list"
    	"vela/report"
    )

    template: {
    	parameter: {
    		// +usage=How many of the latest deploys to show
    		// +ui:label=How many
    		count: *50 | int & >=1 & <=500
    	}
    	runs: report.#Runs

    	sorted: list.Sort([for r in runs.$returns {
    		started:  [if r.started != _|_ {r.started}, ""][0]
    		app:      r.app
    		env:      [if r.env != _|_ {r.env}, ""][0]
    		run:      r.name
    		revision: [if r.revision != _|_ {r.revision}, ""][0]
    		user:     [if r.user != _|_ {r.user}, ""][0]
    		trigger:  [if r.trigger != _|_ {r.trigger}, ""][0]
    		note:     [if r.note != _|_ {r.note}, ""][0]
    		status:   r.status
    	}], {x: {}, y: {}, less: x.started > y.started})

    	rows: [...{
    		// +title=When
    		// +format=time
    		started: string
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Environment
    		env: string
    		// +title=Revision
    		// +link=/applications/{app}/envbinding/{env}/workflow/records/{run}
    		revision: string
    		// +title=By
    		user: string
    		// +title=Trigger
    		trigger: string
    		// +title=Note
    		note: string
    		// +title=Status
    		// +format=badge
    		status: string
    		run:    string
    	}]
    	rows: list.Take(sorted, parameter.count)
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: requests-and-limits
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Requests and limits
    // +description=CPU and memory each workload requests across its replicas, and workloads that set no requests or limits
    // +chart=bar
    // +chart:x=app
    // +chart:y=cpu
    // +chart:title=CPU requested (cores) by application
    import (
    	"list"
    	"math"
    	"strings"
    	"vela/report"
    )

    template: {
    	deployments:  report.#List & {$params: {apiVersion: "apps/v1", kind: "Deployment"}}
    	statefulsets: report.#List & {$params: {apiVersion: "apps/v1", kind: "StatefulSet"}}

    	rows: [...{
    		// +title=Workload
    		workload: string
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Replicas
    		replicas: int
    		// +title=CPU requested (cores)
    		cpu: number
    		// +title=Memory requested (MiB)
    		memory: number
    		// +title=CPU limit (cores)
    		cpuLimit: number
    		// +title=Memory limit (MiB)
    		memoryLimit: number
    		// +title=Not set
    		missing: string
    		// +title=Namespace
    		namespace: string
    		kind:      string
    	}]
    	workloads: list.Concat([
    		[for d in deployments.$returns {k: "Deployment", item: d}],
    		[for x in statefulsets.$returns {k: "StatefulSet", item: x}],
    	])
    	rows: list.Sort([for w in workloads
    		let spec = w.item.object.spec
    		let containers = [if spec.template.spec.containers != _|_ {spec.template.spec.containers}, []][0]
    		let replicas = [if spec.replicas != _|_ {spec.replicas}, 1][0]
    		let res = [for c in containers {[if c.resources != _|_ {c.resources}, {}][0]}]
    		let req = [for r in res {[if r.requests != _|_ {r.requests}, {}][0]}]
    		let lim = [for r in res {[if r.limits != _|_ {r.limits}, {}][0]}]
    		let missing = list.Concat([
    			[if len([for r in req if r.cpu == _|_ {r}]) > 0 {"CPU request"}],
    			[if len([for r in req if r.memory == _|_ {r}]) > 0 {"memory request"}],
    			[if len([for l in lim if l.memory == _|_ {l}]) > 0 {"memory limit"}],
    		]) {
    			workload:    w.item.object.metadata.name
    			kind:        w.k
    			app:         [if w.item.object.metadata.labels["app.oam.dev/name"] != _|_ {w.item.object.metadata.labels["app.oam.dev/name"]}, ""][0]
    			namespace:   "\(w.item.cluster)/\(w.item.namespace)"
    			"replicas":  replicas
    			cpu:         math.Round(1000*replicas*list.Sum([for r in req if r.cpu != _|_ {(report.#CPU & {in: r.cpu}).out}])) / 1000
    			memory:      math.Round(replicas * list.Sum([for r in req if r.memory != _|_ {(report.#Memory & {in: r.memory}).out}]))
    			cpuLimit:    math.Round(1000*replicas*list.Sum([for l in lim if l.cpu != _|_ {(report.#CPU & {in: l.cpu}).out}])) / 1000
    			memoryLimit: math.Round(replicas * list.Sum([for l in lim if l.memory != _|_ {(report.#Memory & {in: l.memory}).out}]))
    			"missing":   strings.Join(missing, ", ")
    		}], {x: {}, y: {}, less: x.cpu > y.cpu})

    	stats: [
    		{label: "CPU requested (cores)", value: math.Round(1000 * list.Sum([for r in rows {r.cpu}])) / 1000},
    		{label: "Memory requested (MiB)", value: math.Round(list.Sum([for r in rows {r.memory}]))},
    		{label: "Workloads missing requests or limits", value: len([for r in rows if r.missing != "" {r}]), tone: [if len([for r in rows if r.missing != "" {r}]) > 0 {"progressing"}, "healthy"][0]},
    	]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restarting-pods
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Restarting pods
    // +description=Containers crash looping, failing to pull or start, or restarting often
    // +chart=bar
    // +chart:x=app
    // +chart:y=restarts
    // +chart:title=Restarts by application
    import (
    	"list"
    	"vela/report"
    )

    template: {
    	parameter: {
    		// +usage=Restarts at which a container is listed even when it is running now
    		// +ui:label=Restarts to list
    		restarts: *3 | int & >=1
    	}
    	pods: report.#List & {$params: {apiVersion: "v1", kind: "Pod"}}

    	stuck: ["CrashLoopBackOff", "ImagePullBackOff", "ErrImagePull", "CreateContainerConfigError", "CreateContainerError", "RunContainerError"]

    	rows: [...{
    		// +title=Pod
    		pod: string
    		// +title=Container
    		container: string
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Restarts
    		restarts: int
    		// +title=Now
    		reason: string
    		// +title=Last exit
    		lastExit: string
    		// +title=Namespace
    		namespace: string
    	}]
    	rows: list.Sort([for p in pods.$returns
    		let statuses = [if p.object.status.containerStatuses != _|_ {p.object.status.containerStatuses}, []][0]
    		for c in statuses
    		let reason = [if c.state.waiting != _|_ if c.state.waiting.reason != _|_ {c.state.waiting.reason}, ""][0]
    		if c.restartCount >= parameter.restarts || list.Contains(stuck, reason) {
    			pod:       p.object.metadata.name
    			container: c.name
    			app:       [if p.object.metadata.labels["app.oam.dev/name"] != _|_ {p.object.metadata.labels["app.oam.dev/name"]}, ""][0]
    			restarts:  c.restartCount
    			"reason":  [if reason != "" {reason}, "Running"][0]
    			lastExit:  [if c.lastState.terminated != _|_ if c.lastState.terminated.reason != _|_ {c.lastState.terminated.reason}, ""][0]
    			namespace: "\(p.cluster)/\(p.namespace)"
    		}], {x: {}, y: {}, less: x.restarts > y.restarts})

    	stats: [
    		{label: "Containers listed", value: len(rows), tone: [if len(rows) > 0 {"unhealthy"}, "healthy"][0]},
    		{label: "Stuck now", value: len([for r in rows if list.Contains(stuck, r.reason) {r}])},
    	]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: running-images
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Running images
    // +description=The images and tags running in the project, flagging latest tags and images running at more than one tag
    // +chart=pie
    // +chart:x=tag
    // +chart:title=Containers by tag
    import (
    	"list"
    	"strings"
    	"vela/report"
    )

    template: {
    	pods: report.#List & {$params: {apiVersion: "v1", kind: "Pod"}}

    	// #Image splits an image reference into its repository and its tag or digest.
    	#Image: {
    		ref: string
    		let at = strings.Index(ref, "@")
    		let slash = strings.LastIndex(ref, "/")
    		let colon = strings.LastIndex(ref, ":")
    		repository: [
    			if at >= 0 {strings.SliceRunes(ref, 0, at)},
    			if colon > slash {strings.SliceRunes(ref, 0, colon)},
    			ref,
    		][0]
    		tag: [
    			if at >= 0 {"digest"},
    			if colon > slash {strings.SliceRunes(ref, colon+1, len(ref))},
    			"latest (implied)",
    		][0]
    	}

    	containers: {
    		for p in pods.$returns if p.object.spec.containers != _|_ for c in p.object.spec.containers {
    			let app = [if p.object.metadata.labels["app.oam.dev/name"] != _|_ {p.object.metadata.labels["app.oam.dev/name"]}, ""][0]
    			"\(app)/\(c.name)/\(c.image)": {
    				"app":     app
    				container: c.name
    				image:     c.image
    			}
    		}
    	}
    	all: [for _, c in containers
    		let img = #Image & {ref: c.image} {
    			app:        c.app
    			container:  c.container
    			repository: img.repository
    			tag:        img.tag
    		}]
    	tagsOf: {for c in all {"\(c.repository)": "\(c.tag)": true}}

    	rows: [...{
    		// +title=Repository
    		repository: string
    		// +title=Tag
    		tag: string
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Container
    		container: string
    		// +title=Flag
    		flag: string
    	}]
    	rows: list.Sort([for c in all {
    		c
    		flag: [
    			if strings.HasPrefix(c.tag, "latest") {"Uses latest"},
    			if len([for t, _ in tagsOf[c.repository] {t}]) > 1 {"Several tags in use"},
    			"",
    		][0]
    	}], {x: {}, y: {}, less: x.repository+x.tag < y.repository+y.tag})

    	stats: [
    		{label: "Images", value: len([for r, _ in tagsOf {r}])},
    		{label: "Using latest", value: len([for r in rows if r.flag == "Uses latest" {r}]), tone: [if len([for r in rows if r.flag == "Uses latest" {r}]) > 0 {"progressing"}, "healthy"][0]},
    		{label: "Several tags in use", value: len([for r, tags in tagsOf if len([for t, _ in tags {t}]) > 1 {r}])},
    	]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: type-versions
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Type versions
    // +description=Components and traits pinned to a definition version that no longer exists, which cannot render, or behind the latest
    // +chart=pie
    // +chart:x=state
    // +chart:title=Components and traits by version state
    import (
    	"list"
    	"strings"
    	"vela/report"
    )

    template: {
    	parameter: {
    		// +usage=Show those on the latest version as well
    		// +ui:label=Include those on the latest
    		all: *false | bool
    	}
    	components:  report.#Components
    	definitions: report.#Definitions
    	defs: {for d in definitions.$returns {"\(d.kind)/\(d.name)": d}}

    	all: [for c in components.$returns
    		let parts = strings.Split(c.type, "@")
    		let def = [if defs["\(c.kind)/\(parts[0])"] != _|_ {defs["\(c.kind)/\(parts[0])"]}, {versions: []}][0]
    		let latest = [if def.latest != _|_ {def.latest}, ""][0]
    		let pinned = [if len(parts) == 2 {parts[1]}, ""][0] {
    			app:       c.app
    			component: c.component
    			kind:      c.kind
    			type:      parts[0]
    			"pinned":  [if pinned != "" {pinned}, "-"][0]
    			"latest":  [if latest != "" {latest}, "-"][0]
    			state: [
    				if pinned == "" {"Follows the latest"},
    				if !list.Contains(def.versions, pinned) {"Pinned to a missing version"},
    				if pinned != latest {"Pinned behind the latest"},
    				"Pinned to the latest",
    			][0]
    		}]

    	stats: [
    		{label: "Cannot render", value: len([for c in all if c.state == "Pinned to a missing version" {c}]), tone: [if len([for c in all if c.state == "Pinned to a missing version" {c}]) > 0 {"unhealthy"}, "healthy"][0]},
    		{label: "Behind the latest", value: len([for c in all if c.state == "Pinned behind the latest" {c}])},
    		{label: "Components and traits", value: len(all)},
    	]

    	rows: [...{
    		// +title=Application
    		// +link=/applications/{app}/config/components
    		app: string
    		// +title=Component
    		component: string
    		// +title=Kind
    		kind: string
    		// +title=Type
    		type: string
    		// +title=Pinned
    		pinned: string
    		// +title=Latest
    		latest: string
    		// +title=State
    		state: string
    	}]
    	rows: [for c in all if parameter.all || list.Contains(["Pinned to a missing version", "Pinned behind the latest"], c.state) {c}]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unhealthy-applications
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Unhealthy applications
    // +description=Applications with a component or trait that is not healthy, or a workflow that failed, and why
    // +chart=bar
    // +chart:x=app
    // +chart:group=part
    // +chart:title=Unhealthy parts by application
    import (
    	"list"
    	"vela/report"
    )

    template: {
    	applications: report.#List & {$params: {apiVersion: "core.oam.dev/v1beta1", kind: "Application"}}

    	apps: [for a in applications.$returns
    		let st = [if a.object.status != _|_ {a.object.status}, {}][0] {
    			name:      a.object.metadata.name
    			namespace: a.namespace
    			phase:     [if st.status != _|_ {st.status}, "unknown"][0]
    			services:  [if st.services != _|_ {st.services}, []][0]
    		}]

    	rows: [...{
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Part
    		part: string
    		// +title=Name
    		name: string
    		// +title=Application phase
    		// +format=badge
    		phase: string
    		// +title=Why
    		message: string
    	}]
    	rows: list.Concat([
    		[for a in apps if list.Contains(["workflowFailed", "workflowTerminated"], a.phase) {
    			app:     a.name
    			part:    "workflow"
    			name:    a.name
    			phase:   a.phase
    			message: "The workflow stopped at \(a.phase)"
    		}],
    		[for a in apps for s in a.services if !s.healthy {
    			app:     a.name
    			part:    "component"
    			name:    s.name
    			phase:   a.phase
    			message: [if s.message != _|_ {s.message}, ""][0]
    		}],
    		[for a in apps for s in a.services if s.traits != _|_ for tr in s.traits if !tr.healthy {
    			app:     a.name
    			part:    "trait"
    			name:    "\(s.name) / \(tr.type)"
    			phase:   a.phase
    			message: [if tr.message != _|_ {tr.message}, ""][0]
    		}],
    	])

    	unhealthy: {for r in rows {"\(r.app)": true}}
    	stats: [
    		{label: "Applications", value: len(apps)},
    		{label: "Unhealthy", value: len([for k, _ in unhealthy {k}]), tone: [if len(rows) > 0 {"unhealthy"}, "healthy"][0]},
    		{label: "Unhealthy parts", value: len(rows)},
    	]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waiting
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Waiting on someone
    // +description=Workflows suspended for an approval or input, and how long they have waited
    // +chart=bar
    // +chart:x=app
    // +chart:y=minutes
    // +chart:title=Minutes waiting
    import (
    	"list"
    	"vela/report"
    )

    template: {
    	runs: report.#Runs

    	rows: [...{
    		// +title=Application
    		// +link=/applications/{app}/config
    		app: string
    		// +title=Run
    		// +link=/applications/{app}/envbinding/{env}/workflow/records/{run}
    		run: string
    		// +title=Waiting at
    		step: string
    		// +title=Waiting for
    		// +format=duration
    		waited: int
    		// +title=Started by
    		user: string
    		env:     string
    		minutes: int
    	}]
    	rows: list.Sort([for r in runs.$returns if r.status == "suspending"
    		let waiting = [for s in *r.steps | [] if s.phase == "suspending" {s}]
    		if len(waiting) > 0
    		let s = waiting[0] {
    			app:     r.app
    			run:     r.name
    			step:    [if s.alias != _|_ {s.alias}, s.name][0]
    			waited:  s.seconds
    			user:    [if r.user != _|_ {r.user}, ""][0]
    			env:     [if r.env != _|_ {r.env}, ""][0]
    			minutes: div(s.seconds, 60)
    		}], {x: {}, y: {}, less: x.waited > y.waited})

    	stats: [
    		{label: "Waiting", value: len(rows), tone: [if len(rows) > 0 {"progressing"}, "healthy"][0]},
    		{label: "Longest wait", format: "duration", value: [if len(rows) > 0 {rows[0].waited}, null][0]},
    	]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warning-events
  namespace: vela-system
  labels:
    app.kubernetes.io/part-of: velaux
    app.kubernetes.io/component: report
    velaux.oam.dev/report: "true"
data:
  template: |
    // +title=Warning events
    // +description=Warnings Kubernetes recorded in the project's namespaces, latest first; Kubernetes keeps events for about an hour
    // +chart=bar
    // +chart:x=reason
    // +chart:y=count
    // +chart:title=Warnings by reason
    import (
    	"list"
    	"vela/report"
    )

    template: {
    	events: report.#List & {$params: {apiVersion: "v1", kind: "Event"}}

    	rows: [...{
    		// +title=Last seen
    		// +format=time
    		seen: string
    		// +title=Reason
    		reason: string
    		// +title=Object
    		object: string
    		// +title=Message
    		message: string
    		// +title=Count
    		count: int
    		// +title=Namespace
    		namespace: string
    	}]
    	rows: list.Sort([for e in events.$returns if e.object.type == "Warning"
    		let o = e.object {
    			seen: [
    				if (o.lastTimestamp & string) != _|_ {o.lastTimestamp},
    				if (o.eventTime & string) != _|_ {o.eventTime},
    				o.metadata.creationTimestamp,
    			][0]
    			reason:    [if o.reason != _|_ {o.reason}, ""][0]
    			object:    "\(o.involvedObject.kind)/\(o.involvedObject.name)"
    			message:   [if o.message != _|_ {o.message}, ""][0]
    			count:     [if o.count != _|_ {o.count}, 1][0]
    			namespace: "\(e.cluster)/\(e.namespace)"
    		}], {x: {}, y: {}, less: x.seen > y.seen})

    	stats: [
    		{label: "Warnings", value: list.Sum([for r in rows {r.count}]), tone: [if len(rows) > 0 {"progressing"}, "healthy"][0]},
    		{label: "Objects affected", value: len([for k, _ in {for r in rows {"\(r.namespace)/\(r.object)": true}} {k}])},
    	]
    }
