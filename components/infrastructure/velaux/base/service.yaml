# VelaUX Web UI / API 用 ClusterIP Service。
# cloudflared (infra Namespace) から http://velaux-server.vela-system.svc.cluster.local:8000 へ転送される。
apiVersion: v1
kind: Service
metadata:
  name: velaux-server
  namespace: vela-system
  labels:
    app.kubernetes.io/name: velaux
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: velaux
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
