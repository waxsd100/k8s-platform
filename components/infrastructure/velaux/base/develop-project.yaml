# VelaUX に "Develop" プロジェクトを事前登録する ConfigMap。
# Dev 環境のアプリ・Configs (Secret)・Pipeline・Target (dev-*)・Environment を
# VelaUX UI から作成・管理するための標準プロジェクトとして利用する。
#
# NOTE:
#   1. "namespace": "develop" を指定する理由:
#      VelaUX のプロジェクト配下 Configs (Secret) や Pipeline は project.GetNamespace()
#      内のリソースとして読み書きされる。読取専用の pj-production と異なり、Develop では
#      UI から Configs / Secret を操作するため、保護対象である "default" ではなく
#      Dev 専用 Namespace "develop" (usage.oam.dev/runtime: target ラベル付き、
#      Config Sync 管理外) を割り当てる。これにより Kyverno の velaux-dev-secrets-access
#      ポリシーが自動で RoleBinding/velaux-dev-secrets を生成し、default / infra / prod-*
#      の隔離を維持したまま Develop プロジェクトの Configs 操作が可能になる。
#   2. client.lifecycle.config.k8s.io/mutation: ignore を付与する理由:
#      InitAdmin や運用中の owner / alias / description 更新を Config Sync が
#      差し戻さない（ドリフトさせない）ようにするため。
apiVersion: v1
kind: ConfigMap
metadata:
  name: pj-develop
  namespace: velaux-store
  annotations:
    client.lifecycle.config.k8s.io/mutation: ignore
  labels:
    table: vela_project
    primaryKey: develop
    name: develop
    owner: admin
