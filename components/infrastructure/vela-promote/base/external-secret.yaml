# platform リポジトリへブランチを push し、Pull Request を立てるためのトークン。
# GitHub の Fine-grained PAT（k8s-platform の Contents / Pull requests: Read and write）を
# Secret Manager の vela-promote-github-token に登録しておく。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vela-promote
  annotations:
    config.kubernetes.io/depends-on: apps/namespaces/external-secrets/Deployment/external-secrets,apps/namespaces/external-secrets/Deployment/external-secrets-webhook,apps/namespaces/external-secrets/Deployment/external-secrets-cert-controller,external-secrets.io/ClusterSecretStore/gcp-secret-store
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: vela-promote
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: vela-promote-github-token
