# プラットフォーム構成要素の requests を、実際の使用量から見直すための VPA。
#
# updateMode: "Off" = **推奨値を出すだけ**で、Pod を書き換えも再起動もしない。
# requests の変更は、推奨値を見て各コンポーネントのマニフェストに人が反映する
# （Git が真実の源のまま。VPA が勝手に Pod を作り直すと Config Sync の宣言とずれる）。
#
# 推奨値の見方: docs/GKE_SETUP_GUIDE.md の「8.7 プラットフォームの requests を見直す」
#
# 対象はプラットフォームの Deployment だけ。アプリは HPA で CPU を見て台数を変えるので、
# 同じ指標で VPA を重ねない（GKE は CPU / メモリで HPA と VPA を併用しないよう求めている）。
# 対象を増やすときは、kubectl get deploy -A でプラットフォームの Deployment 名を確認する。
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: canine
  namespace: canine
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canine
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: canine-worker
  namespace: canine
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canine-worker
  updatePolicy:
    updateMode: "Off"
---
