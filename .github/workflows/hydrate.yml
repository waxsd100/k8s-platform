name: Hydrate Manifests

on:
  pull_request:
    branches:
      - main
    paths:
      - "addons/**"
      - "components/**"
      - "Makefile.toml"
      - ".github/workflows/hydrate.yml"

permissions:
  contents: read

jobs:
  # PR のコード（Makefile.toml・kustomize・Helm の実行）は、書き込み権限のないこのジョブで動かす
  render:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: hydrate-render-pr-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Checkout PR Head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 検証対象のコミットを固定する。commit ジョブでブランチ先頭と照合する
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          # Cloud Build (cloudbuild.yaml) と同じ版に固定する。既定の "*" だと
          # その時点の最新が入り、ハイドレート結果が CI と Cloud Build で食い違いうる
          kustomize-version: "5.8.1"

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Cloud Build (cloudbuild.yaml) と同じ Helm 4.3.0 に固定する
          version: "v4.3.0"

      - name: Cache yq Binary
        id: cache-yq
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.local/bin/yq
          key: ${{ runner.os }}-yq-v4.53.6-local

      - name: Install yq (if cache missed)
        if: steps.cache-yq.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          tmp_yq="$(mktemp)"
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o "${tmp_yq}"
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  ${tmp_yq}" | sha256sum -c -
          install -m 0755 "${tmp_yq}" ~/.local/bin/yq
          rm -f "${tmp_yq}"

      - name: Cache cargo-make
        id: cache-cargo-make
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-make
          key: ${{ runner.os }}-cargo-make-0.37.24

      - name: Install cargo-make (if cache missed)
        if: steps.cache-cargo-make.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo/bin
          tmp_dir="$(mktemp -d)"
          curl -fsSL https://github.com/sagiegurari/cargo-make/releases/download/0.37.24/cargo-make-v0.37.24-x86_64-unknown-linux-musl.zip -o "${tmp_dir}/cargo-make.zip"
          echo "ff76969f0caab39c56d168b94b2540fde34609aa6562d555081818ece387b005  ${tmp_dir}/cargo-make.zip" | sha256sum -c -
          unzip -q "${tmp_dir}/cargo-make.zip" -d "${tmp_dir}"
          install -m 0755 "${tmp_dir}/cargo-make-v0.37.24-x86_64-unknown-linux-musl/cargo-make" ~/.cargo/bin/cargo-make
          rm -rf "${tmp_dir}"

      - name: Add Local Binaries to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run Hydration
        run: |
          set -euo pipefail
          # 削除済み・リネーム済みコンポーネントの _result.json が成果物に残らないよう先に削除する
          find addons components -path "*/charts/*" -prune -o -type f -name "_result.json" -print0 | xargs -0 -r rm -f --
          cargo make hydrate

      - name: Collect Hydrated Manifests
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/hydrated"
          rm -rf -- "${stage}"
          mkdir -p -- "${stage}"
          # hydrate の書き出し先（charts/ の展開キャッシュを除く）にある _result.json だけを集める。
          # 通常ファイルのみ対象にし、相対パスは cp --parents で保つ
          while IFS= read -r -d "" f; do
            cp --parents -- "${f}" "${stage}/"
          done < <(find addons components -path "*/charts/*" -prune -o -type f -name "_result.json" -print0)
          count="$(find "${stage}" -type f | wc -l)"
          echo "Collected ${count} file(s)"

      - name: Upload Hydrated Manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hydrated-manifests
          path: ${{ runner.temp }}/hydrated
          retention-days: 1
          if-no-files-found: error

  # 書き込み権限を持つこのジョブでは、PR のコードを一切実行しない。
  # render の成果物（_result.json のみ）を検証してから取り込む
  commit:
    needs: render
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: hydrate-commit-pr-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      # 自動コミット後の HEAD に対して必須チェック用ワークフローを workflow_dispatch で起動するため
      actions: write

    steps:
      - name: Validate Head Ref
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REF}" ] || [[ "${HEAD_REF}" == -* ]]; then
            echo "Invalid HEAD_REF: ${HEAD_REF}" >&2
            exit 1
          fi
          git check-ref-format --branch "${HEAD_REF}" >/dev/null

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.pull_request.head.ref }}

      - name: Download Hydrated Manifests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hydrated-manifests
          # チェックアウトの外に展開する
          path: ${{ runner.temp }}/hydrated

      - name: Verify and Apply Hydrated Manifests
        id: apply
        env:
          HYDRATED_DIR: ${{ runner.temp }}/hydrated
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          src="${HYDRATED_DIR}"
          if [ ! -d "${src}" ]; then
            echo "Hydrated artifact not found: ${src}" >&2
            exit 1
          fi

          # 成果物は PR 由来で信用できないので、種類・パス・厳格な RFC 8259 JSON 配列形式を 1 つずつ検証する
          files=()
          while IFS= read -r -d "" f; do
            rel="${f#"${src}"/}"
            # シンボリックリンクや通常ファイル以外（FIFO など）は拒否する
            if [ -L "${f}" ] || [ ! -f "${f}" ]; then
              echo "::error::Refusing non-regular file: ${rel}" >&2
              exit 1
            fi
            if ! [[ "${rel}" =~ ^(addons|components)/[A-Za-z0-9._/-]+/_result\.json$ ]]; then
              echo "::error::Unexpected path in artifact: ${rel}" >&2
              exit 1
            fi
            case "/${rel}" in
              */../*|*/./*|*//*|*/charts/*)
                echo "::error::Unsafe path in artifact: ${rel}" >&2
                exit 1
                ;;
            esac
            if [ "${rel}" = "components/apps/_result.json" ]; then
              echo "::error::Refusing aggregator _result.json: ${rel}" >&2
              exit 1
            fi
            # -I でカレントディレクトリ（PR のチェックアウト）から import させない
            if ! python3 -I -c '
          import json, sys
          def reject(val):
              raise ValueError(f"non-standard JSON constant: {val}")
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh, parse_constant=reject)
          if not isinstance(data, list):
              raise ValueError("top-level JSON value must be an array")
          ' "${f}"; then
              echo "::error::Invalid RFC 8259 JSON array in artifact: ${rel}" >&2
              exit 1
            fi
            files+=("${rel}")
          done < <(find "${src}" ! -type d -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No _result.json files in artifact." >&2
            exit 1
          fi

          # render 後にブランチが進んでいたら、古い結果では上書きせず新しいランに任せる
          tip="$(git rev-parse HEAD)"
          if [ "${tip}" != "${HEAD_SHA}" ]; then
            echo "::notice::Branch head is ${tip}, not ${HEAD_SHA}. A newer run will handle it; skipping commit."
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # 書き込み先の途中にシンボリックリンクがあれば拒否し、兄弟の kustomization ファイル存在も確認する
          for rel in "${files[@]}"; do
            dir="$(dirname -- "${rel}")"
            p=""
            IFS=/ read -r -a parts <<< "${dir}"
            for part in "${parts[@]}"; do
              p="${p:+${p}/}${part}"
              if [ -L "${p}" ]; then
                echo "::error::Symlink in destination path: ${p}" >&2
                exit 1
              fi
            done
            if [ -L "${rel}" ] || [ -d "${rel}" ]; then
              echo "::error::Destination is a symlink or directory: ${rel}" >&2
              exit 1
            fi
            if [ ! -f "${dir}/kustomization.yaml" ] && [ ! -f "${dir}/kustomization.yml" ] && [ ! -f "${dir}/Kustomization" ]; then
              echo "::error::Missing sibling kustomization file for artifact: ${rel}" >&2
              exit 1
            fi
          done

          declare -A expected_files=()
          for rel in "${files[@]}"; do
            install -D -m 0644 -- "${src}/${rel}" "${rel}"
            expected_files["${rel}"]=1
          done
          # 検証済みの _result.json のパスだけをステージする
          git add -- "${files[@]}"

          # 削除・リネーム済みコンポーネントの追跡中 _result.json を削除する
          stale_tracked=()
          while IFS= read -r -d "" tracked; do
            case "/${tracked}" in
              */charts/*) continue ;;
            esac
            if [ -z "${expected_files["${tracked}"]+x}" ]; then
              stale_tracked+=("${tracked}")
            fi
          done < <(git ls-files -z -- ':(glob)addons/**/_result.json' ':(glob)components/**/_result.json')
          if [ "${#stale_tracked[@]}" -gt 0 ]; then
            echo "Removing stale _result.json file(s): ${stale_tracked[*]}"
            git rm -- "${stale_tracked[@]}"
          fi
          echo "stale=false" >> "${GITHUB_OUTPUT}"

      - name: Commit and Push Hydrated Manifests
        if: steps.apply.outputs.stale != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REF}" ] || [[ "${HEAD_REF}" == -* ]]; then
            echo "Invalid HEAD_REF: ${HEAD_REF}" >&2
            exit 1
          fi
          git check-ref-format --branch "${HEAD_REF}" >/dev/null
          if git diff --cached --quiet; then
            echo "No _result.json changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): auto-update kustomize hydration _result.json files"
          git push origin -- "HEAD:refs/heads/${HEAD_REF}"
          # GITHUB_TOKEN による push では pull_request / push のワークフローが起動せず、
          # 自動コミット後の HEAD で必須チェックがデッドロックする。
          # workflow_dispatch は GITHUB_TOKEN からでも起動できるので、必須チェック対象の
          # 3 ワークフローすべてを新しい HEAD に対して明示的に走らせる。
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_REF}"
          gh workflow run format-and-lint.yml --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_REF}"
          gh workflow run secret-scanning.yml --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_REF}"
