name: Hydrate Manifests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hydrate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install cargo-make
        run: cargo install cargo-make

      - name: Run Hydration
        run: cargo make hydrate

      - name: Auto Commit to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-update kustomize hydration _result.json files"
          file_pattern: "components/apps/frontend-web/overlays/*/_result.json"
