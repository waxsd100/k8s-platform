name: Hydrate Manifests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hydrate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          # Cloud Build (cloudbuild.yaml) と同じ版に固定する。既定の "*" だと
          # その時点の最新が入り、ハイドレート結果が CI と Cloud Build で食い違いうる
          kustomize-version: "5.8.1"
      - name: Cache yq Binary
        id: cache-yq
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/yq
          key: ${{ runner.os }}-yq-v4.53.6

      - name: Install yq (if cache missed)
        if: steps.cache-yq.outputs.cache-hit != 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Cache cargo-make
        id: cache-cargo-make
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-make
          key: ${{ runner.os }}-cargo-make-0.37.24

      - name: Install cargo-make (if cache missed)
        if: steps.cache-cargo-make.outputs.cache-hit != 'true'
        run: cargo install cargo-make

      - name: Run Hydration
        run: cargo make hydrate

      - name: Auto Commit to Repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(ci): auto-update kustomize hydration _result.json files"
          file_pattern: "**/_result.json"
