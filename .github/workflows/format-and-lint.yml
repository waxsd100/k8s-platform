name: Format and Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
      - develop

jobs:
  format-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run Prettier
        run: npx prettier --ignore-path .github/linters/.prettierignore --write "**/*.{yml,yaml,json,md}"

      - name: Run Super-Linter
        uses: github/super-linter/slim@v7
        env:
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_GITLEAKS: true
          # Only validate the new/changed files in pull requests
          VALIDATE_ALL_CODEBASE: false
          # restrict to repo root
          DEFAULT_BRANCH: main

      - name: Commit formatted changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: auto-format files (prettier + super-linter)"
          add: "."
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
