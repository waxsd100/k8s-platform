name: Mark Production Deployment
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  prod-deploy-success:
    # promote-to-prod というプレフィックスのブランチがマージされた時のみ発火
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'promote-to-prod')
    runs-on: ubuntu-latest
    environment:
      name: "production"
    permissions:
      contents: write
      deployments: write

    env:
      APP_REPO: "wax100/wax100-blog"
      GITHUB_TOKEN: ${{ secrets.APP_REPO_PAT }}

    steps:
      - name: Extract Tag Name from PR Title
        id: extract_tag
        run: |
          # The PR title contains the tag (e.g. Promote to Production: v1.0.0)
          PR_TITLE="${{ github.event.pull_request.title }}"
          TAG_NAME=$(echo "$PR_TITLE" | sed -n 's/.*: \(v[0-9.]*\).*/\1/p')
          
          if [ -z "$TAG_NAME" ]; then
            # fallback if sed extraction fails
            TAG_NAME=$(echo "$PR_TITLE" | awk -F': ' '{print $2}')
          fi
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "DEBUG: Extracted TAG_NAME is '${TAG_NAME}'"

      - name: Mark GitHub Deployment (Production) as Success on App Repo
        run: |
          echo "Updating deployment status for $APP_REPO..."
          # 1. Get the latest Deployment ID
          DEPLOYMENT_ID=$(gh api "repos/$APP_REPO/deployments?environment=production" --jq '.[0].id')

          if [ "$DEPLOYMENT_ID" != "null" ] && [ -n "$DEPLOYMENT_ID" ]; then
            # 2. Update status to success
            gh api --method POST "repos/$APP_REPO/deployments/$DEPLOYMENT_ID/statuses" \
              -f state="success" \
              -f description="Production rollout complete via GitOps."
            echo "Successfully updated deployment $DEPLOYMENT_ID to success."
          else
            echo "No deployment found to update for $APP_REPO."
          fi

      - name: Promote Draft/Prerelease to Published
        if: steps.extract_tag.outputs.TAG_NAME != ''
        run: |
          echo "Promoting release $TAG_NAME for $APP_REPO..."
          # Get release ID by tag
          RELEASE_ID=$(gh api "repos/$APP_REPO/releases/tags/$TAG_NAME" --jq '.id' || echo "null")

          if [ "$RELEASE_ID" != "null" ]; then
            gh api --method PATCH "repos/$APP_REPO/releases/$RELEASE_ID" \
              -F draft=false \
              -F prerelease=false
            echo "Successfully published release $TAG_NAME."
          else
            echo "Release for tag $TAG_NAME not found."
          fi
