name: CI (Lint & Validate)

on:
  push:
    branches:
      - main
    paths:
      - "addons/**"
      - "bootstrap/**"
      - "clusters/**"
      - "components/**"
      - "hack/**"
      - "Makefile.toml"
      - "cloudbuild.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "addons/**"
      - "bootstrap/**"
      - "clusters/**"
      - "components/**"
      - "hack/**"
      - "Makefile.toml"
      - "cloudbuild.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Kustomize & Schema Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          # Cloud Build (cloudbuild.yaml) と同じ版に固定する。既定の "*" だと
          # その時点の最新が入り、ハイドレート結果が CI と Cloud Build で食い違いうる
          kustomize-version: "5.8.1"

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Cloud Build (cloudbuild.yaml) と同じ Helm 4.3.0 に固定する
          version: "v4.3.0"

      - name: Cache yq Binary
        id: cache-yq
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /usr/local/bin/yq
          key: ${{ runner.os }}-yq-v4.53.6

      - name: Install yq (if cache missed)
        if: steps.cache-yq.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tmp_yq="$(mktemp)"
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o "${tmp_yq}"
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  ${tmp_yq}" | sha256sum -c -
          sudo install -m 0755 "${tmp_yq}" /usr/local/bin/yq
          rm -f "${tmp_yq}"

      - name: Cache Kubeconform Binary
        id: cache-kubeconform
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.local/bin/kubeconform
          key: ${{ runner.os }}-kubeconform-v0.8.0

      - name: Install Kubeconform (if cache missed)
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          tmp_dir="$(mktemp -d)"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o "${tmp_dir}/kubeconform.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  ${tmp_dir}/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "${tmp_dir}/kubeconform.tar.gz" -C "${tmp_dir}" kubeconform
          install -m 0755 "${tmp_dir}/kubeconform" ~/.local/bin/kubeconform
          rm -rf "${tmp_dir}"

      - name: Add Kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo-make
        id: cache-cargo-make
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-make
          key: ${{ runner.os }}-cargo-make-0.37.24

      - name: Install cargo-make (if cache missed)
        if: steps.cache-cargo-make.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo/bin
          tmp_dir="$(mktemp -d)"
          curl -fsSL https://github.com/sagiegurari/cargo-make/releases/download/0.37.24/cargo-make-v0.37.24-x86_64-unknown-linux-musl.zip -o "${tmp_dir}/cargo-make.zip"
          echo "ff76969f0caab39c56d168b94b2540fde34609aa6562d555081818ece387b005  ${tmp_dir}/cargo-make.zip" | sha256sum -c -
          unzip -q "${tmp_dir}/cargo-make.zip" -d "${tmp_dir}"
          install -m 0755 "${tmp_dir}/cargo-make-v0.37.24-x86_64-unknown-linux-musl/cargo-make" ~/.cargo/bin/cargo-make
          rm -rf "${tmp_dir}"

      - name: Run Validation
        run: cargo make validate
