name: CI (Lint & Validate)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Kustomize & Schema Validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Cache Kubeconform Binary
        id: cache-kubeconform
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/kubeconform
          key: ${{ runner.os }}-kubeconform-v0.6.4

      - name: Install Kubeconform (if cache missed)
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sLO https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          mv kubeconform ~/.local/bin/

      - name: Add Kubeconform to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache cargo-make
        id: cache-cargo-make
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-make
          key: ${{ runner.os }}-cargo-make-0.37.24

      - name: Install cargo-make (if cache missed)
        if: steps.cache-cargo-make.outputs.cache-hit != 'true'
        run: cargo install cargo-make

      - name: Run Validation
        run: cargo make validate
