[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.hydrate]
description = "各環境のハイドレーションファイル(_result.json)をローカルに生成します"
category = "GitOps"
script_runner = "@duckscript"
script = '''
base_tmp = temp_dir
base_tmp = replace ${base_tmp} "\\" "/"
now = current_time
proc_id = pid
r1 = rand_range 100000000 999999999
r2 = rand_range 100000000 999999999
tmp_dir = concat ${base_tmp} "/k8s_platform_hydrate_" ${now} "_" ${proc_id} "_" ${r1} "_" ${r2}
tmp_exists = is_path_exists ${tmp_dir}
if ${tmp_exists}
    echo "Temporary directory already exists: ${tmp_dir}"
    assert false
end
mkdir ${tmp_dir}

addon_yaml = glob_array addons/**/kustomization.yaml
addon_yml = glob_array addons/**/kustomization.yml
addon_cap = glob_array addons/**/Kustomization
comp_yaml = glob_array components/**/kustomization.yaml
comp_yml = glob_array components/**/kustomization.yml
comp_cap = glob_array components/**/Kustomization

a1 = array_concat ${addon_yaml} ${addon_yml}
addon_files = array_concat ${a1} ${addon_cap}
c1 = array_concat ${comp_yaml} ${comp_yml}
comp_files = array_concat ${c1} ${comp_cap}
kust_files = array_concat ${addon_files} ${comp_files}

for file in ${kust_files}
    norm_file = replace ${file} "\\" "/"
    target_dir = dirname ${norm_file}
    target_dir = replace ${target_dir} "\\" "/"
    is_chart = contains ${norm_file} "/charts/"

    # components/apps は各アプリの overlays/production を束ねる集約用ディレクトリ。
    # 個別アプリの _result.json と重複し、複数アプリの昇格 PR 同士で競合するため対象外にする。
    # また、Helm Chart 展開キャッシュ (**/charts/**) 内の kustomization も対象外にする。
    # NOTE: duckscript には continue が無い（"Command: continue not found" で落ちる）ので elseif / else で分ける
    if ${is_chart}
        echo "=== Skipping ${target_dir} (inflated chart) ==="
    elseif eq ${target_dir} "components/apps"
        echo "=== Skipping ${target_dir} (aggregator) ==="
    else
        echo "=== Building ${target_dir} ==="
        safe_name = replace ${target_dir} "/" "_"
        rendered_yaml = concat ${tmp_dir} "/k8s_platform_rendered_" ${safe_name} ".yaml"
        yq_json = concat ${tmp_dir} "/k8s_platform_yq_" ${safe_name} ".json"

        kust_code = exec --get-exit-code kustomize build --enable-helm ${target_dir} -o ${rendered_yaml}
        if not eq ${kust_code} 0
            rm -r ${tmp_dir}
            assert false
        end

        # 空の Kustomization でも [null] ではなく [] になるよう null 文書を除外し、
        # jq -s -S "." で RFC 8259 準拠の単一 JSON 配列かつキー順ソート済みに整形する
        yq_out = exec yq -o=json "select(. != null)" ${rendered_yaml}
        rm ${rendered_yaml}
        if not eq ${yq_out.code} 0
            echo "yq execution failed: ${yq_out.stderr}"
            rm -r ${tmp_dir}
            assert false
        end

        writefile ${yq_json} ${yq_out.stdout}
        jq_out = exec jq -s -S "." ${yq_json}
        rm ${yq_json}
        if not eq ${jq_out.code} 0
            echo "jq execution failed: ${jq_out.stderr}"
            rm -r ${tmp_dir}
            assert false
        end

        writefile "${target_dir}/_result.json" ${jq_out.stdout}

        echo "Generated: ${target_dir}/_result.json"
    end
end

rm -r ${tmp_dir}
'''

[tasks.validate]
description = "kustomize buildとkubeconformを用いてローカルのCI検証テストを実行します"
category = "GitOps"
script_runner = "@duckscript"
script = '''
echo "=== Checking backup & manifest consistency ==="
# DB ポート・restic 版・共通ユーティリティイメージ・クラスタ全体リソースの namespace・CIDR・イメージ pin・matchConditions 等を検査する
exec --fail-on-error bash hack/check-backup-consistency.sh

base_tmp = temp_dir
base_tmp = replace ${base_tmp} "\\" "/"
now = current_time
proc_id = pid
r1 = rand_range 100000000 999999999
r2 = rand_range 100000000 999999999
tmp_dir = concat ${base_tmp} "/k8s_platform_validate_" ${now} "_" ${proc_id} "_" ${r1} "_" ${r2}
tmp_exists = is_path_exists ${tmp_dir}
if ${tmp_exists}
    echo "Temporary directory already exists: ${tmp_dir}"
    assert false
end
mkdir ${tmp_dir}
kc_cache = concat ${tmp_dir} "/kubeconform-cache"
mkdir ${kc_cache}
# CRD スキーマは取得元の更新で CI の結果が変わらないようコミット SHA で固定する
crd_schema = set "https://raw.githubusercontent.com/datreeio/CRDs-catalog/3e8a8916ca1b7af6464606c2c2f5869dbafa9653/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

echo "=== Running kubeconform (Plain YAMLs) ==="
# bootstrap/ は Config Sync を起動するために手で 1 回 kubectl apply する素の YAML。
# clusters/・bootstrap/ 配下の YAML 構文と既知スキーマを検査する（Kustomization / RootSync / DeletingPolicy など
# カタログ未収録 CRD は -ignore-missing-schemas によりスキップされ、実リソースは下の Kustomize builds で検証する）。
cluster_yaml = glob_array clusters/**/*.yaml
cluster_yml = glob_array clusters/**/*.yml
yaml_files = array_concat ${cluster_yaml} ${cluster_yml}
for file in ${yaml_files}
    norm_file = replace ${file} "\\" "/"
    is_chart = contains ${norm_file} "/charts/"
    if not ${is_chart}
        kc_code = exec --get-exit-code kubeconform -strict -ignore-missing-schemas -cache ${kc_cache} -schema-location default -schema-location ${crd_schema} -summary ${norm_file}
        if not eq ${kc_code} 0
            rm -r ${tmp_dir}
            assert false
        end
    end
end

bootstrap_yaml = glob_array bootstrap/**/*.yaml
bootstrap_yml = glob_array bootstrap/**/*.yml
bootstrap_files = array_concat ${bootstrap_yaml} ${bootstrap_yml}
for file in ${bootstrap_files}
    norm_file = replace ${file} "\\" "/"
    is_chart = contains ${norm_file} "/charts/"
    if not ${is_chart}
        kc_code = exec --get-exit-code kubeconform -strict -ignore-missing-schemas -cache ${kc_cache} -schema-location default -schema-location ${crd_schema} -summary ${norm_file}
        if not eq ${kc_code} 0
            rm -r ${tmp_dir}
            assert false
        end
    end
end

echo "=== Running kubeconform (Kustomize builds) ==="
addon_yaml = glob_array addons/**/kustomization.yaml
addon_yml = glob_array addons/**/kustomization.yml
addon_cap = glob_array addons/**/Kustomization
comp_yaml = glob_array components/**/kustomization.yaml
comp_yml = glob_array components/**/kustomization.yml
comp_cap = glob_array components/**/Kustomization
cl_yaml = glob_array clusters/**/kustomization.yaml
cl_yml = glob_array clusters/**/kustomization.yml
cl_cap = glob_array clusters/**/Kustomization

a1 = array_concat ${addon_yaml} ${addon_yml}
addon_files = array_concat ${a1} ${addon_cap}
c1 = array_concat ${comp_yaml} ${comp_yml}
comp_files = array_concat ${c1} ${comp_cap}
cl1 = array_concat ${cl_yaml} ${cl_yml}
cluster_files = array_concat ${cl1} ${cl_cap}

kust_files_1 = array_concat ${addon_files} ${comp_files}
kust_files = array_concat ${kust_files_1} ${cluster_files}

for file in ${kust_files}
    norm_file = replace ${file} "\\" "/"
    is_chart = contains ${norm_file} "/charts/"
    if not ${is_chart}
        dir = dirname ${norm_file}
        dir = replace ${dir} "\\" "/"
        echo "--- Validating: ${dir} ---"
        safe_name = replace ${dir} "/" "_"
        kust_tmp = concat ${tmp_dir} "/k8s_platform_kust_tmp_" ${safe_name} ".yaml"

        kust_code = exec --get-exit-code kustomize build --enable-helm ${dir} -o ${kust_tmp}
        if not eq ${kust_code} 0
            rm -r ${tmp_dir}
            assert false
        end
        kc_code = exec --get-exit-code kubeconform -strict -ignore-missing-schemas -cache ${kc_cache} -schema-location default -schema-location ${crd_schema} -summary ${kust_tmp}
        if not eq ${kc_code} 0
            rm -r ${tmp_dir}
            assert false
        end
        rm ${kust_tmp}
    end
end

rm -r ${tmp_dir}
echo "All Validations Passed!"
'''

[tasks.pre-commit]
description = "コミット前に実行すべき検証とハイドレーション生成を一括で行う統合タスク"
category = "GitOps"
dependencies = ["validate", "hydrate"]
