[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.hydrate]
description = "各環境のハイドレーションファイル(_result.json)をローカルに生成します"
category = "GitOps"
script_runner = "@duckscript"
script = '''
kust_files = glob_array components/**/kustomization.yaml

for file in ${kust_files}
    target_dir = dirname ${file}
    echo "=== Building ${target_dir} ==="

    exec --fail-on-error kustomize build --enable-helm ${target_dir} -o rendered.yaml

    out = exec yq "[.]" -o=json rendered.yaml
    if not eq ${out.code} 0
        echo "yq execution failed: ${out.stderr}"
        assert false
    end

    writefile "${target_dir}/_result.json" ${out.stdout}
    rm rendered.yaml

    echo "Generated: ${target_dir}/_result.json"
end
'''

[tasks.validate]
description = "kustomize buildとkubeconformを用いてローカルのCI検証テストを実行します"
category = "GitOps"
script_runner = "@duckscript"
script = '''
echo "=== Running kubeconform (Plain YAMLs) ==="
yaml_files = glob_array clusters/**/*.yaml
for file in ${yaml_files}
    exec --fail-on-error kubeconform -strict -ignore-missing-schemas -summary ${file}
end

echo "=== Running kubeconform (Kustomize builds) ==="
kust_files = glob_array components/**/kustomization.yaml

for file in ${kust_files}
    dir = dirname ${file}
    echo "--- Validating: ${dir} ---"

    exec --fail-on-error kustomize build --enable-helm ${dir} -o kust_tmp.yaml
    exec --fail-on-error kubeconform -strict -ignore-missing-schemas -summary kust_tmp.yaml
    rm kust_tmp.yaml
end

echo "All Validations Passed!"
'''

[tasks.pre-commit]
description = "コミット前に実行すべき検証とハイドレーション生成を一括で行う統合タスク"
category = "GitOps"
dependencies = ["validate", "hydrate"]
