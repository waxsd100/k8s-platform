apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Applications (KubeVela / VelaUX から昇格され、Config Sync が管理するアプリ)
  - ../../components/apps

  # Infrastructure
  - ../../components/infrastructure/namespaces
  - ../../components/infrastructure/cloudflared/base
  - ../../components/infrastructure/nginx-ingress/base
  - ../../components/infrastructure/velaux/overlays/production
  - ../../components/infrastructure/vela-promote/base
  - ../../components/infrastructure/backup/base
  - ../../components/infrastructure/backup/cluster-resources
  - ../../components/infrastructure/vpa-recommendations/base
  - ../../components/infrastructure/dev-access/base

  # Addons
  - ../../addons/external-secrets/base
  - ../../addons/external-secrets/cluster-resources
  - ../../addons/kyverno/base
  - ../../addons/reloader/base
  - ../../addons/headlamp/base
  - ../../addons/kubevela/base
