apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Applications (Canine から昇格され、Config Sync が管理するアプリ)
  - ../../components/apps

  # Infrastructure
  - ../../components/infrastructure/namespaces
  - ../../components/infrastructure/cloudflared/base
  - ../../components/infrastructure/nginx-ingress/base
  - ../../components/infrastructure/canine/overlays/production
  - ../../components/infrastructure/canine-snapshot/base
  - ../../components/infrastructure/canine-promote/base
  - ../../components/infrastructure/vpa-recommendations/base

  # Addons
  - ../../addons/external-secrets/base
  - ../../addons/external-secrets/cluster-resources
  - ../../addons/kyverno/base
  - ../../addons/reloader/base
