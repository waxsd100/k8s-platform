apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-development
  namespace: infra
spec:
  project: default
  source:
    repoURL: "https://github.com/waxsd100/k8s-platform.git"
    targetRevision: HEAD
    path: components/infrastructure/argocd/overlays/development # トラッキング対象パス (Infrastructure Middleware)
  destination:
    server: "https://kubernetes.default.svc"
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
