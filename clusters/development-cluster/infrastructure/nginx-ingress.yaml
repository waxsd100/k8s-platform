apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-development
  namespace: infra
  annotations:
    # デプロイ順序定義: 1 (Infrastructure Middleware)
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    chart: nginx-ingress
    repoURL: "https://helm.nginx.com/stable"
    targetRevision: 1.3.4
    helm:
      values: |
        controller:
          service:
            # 外部公開ポートの静的割当 (L4 LoadBalancer無効化によるコスト削減)
            type: NodePort
            httpPort:
              nodePort: 30080
            httpsPort:
              nodePort: 30443
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nginx-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
