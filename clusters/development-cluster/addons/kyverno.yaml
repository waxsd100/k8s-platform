apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-development
  namespace: argocd
  annotations:
    # デプロイ順序定義: -1 (Cluster Policies)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/waxsd100/k8s-platform.git'
    targetRevision: HEAD
    path: addons/kyverno/overlays/development
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # KyvernoのCRDマニフェストサイズが大きいため必須
