apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-web-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/gitops-repo.git'
    targetRevision: HEAD
    path: components/apps/frontend-web/overlays/dev # <= 本当のアプリを参照
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: frontend-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
