apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-web-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/waxsd100/k8s-platform.git'
    targetRevision: HEAD
    path: components/apps/frontend-web/overlays/staging # <= 本当のアプリを参照
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: frontend-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
